<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解法道場 The Theory of Solutions</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--mut:#6b7280;--line:#e3ded2;--acc:#b45309;--acc2:#1d4ed8;--red:#dc2626;--grn:#15803d;--c1:#dc2626;--c2:#1d4ed8;--c3:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65}
header{background:#1f2430;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:22px;margin:0;letter-spacing:.04em}
header .sub{color:#d6cfc0;font-size:13px}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav button{background:#2e3547;color:#fff;border:1px solid #4a5468;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
nav button:hover{background:#3b465e}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.today{border:2px solid var(--acc)}
.today h2{margin:2px 0 8px;font-size:19px}
.task{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:none}
.task input{width:22px;height:22px;accent-color:var(--acc)}
.task a{color:var(--acc2);text-decoration:none;font-weight:600}
.done-t{color:var(--mut);text-decoration:line-through}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.daycard:hover{border-color:var(--acc)}
.daycard h3{margin:4px 0;font-size:18px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:#fef3c7;color:#92400e;margin-right:6px}
.badge.b{background:#dbeafe;color:#1e40af}
.badge.g{background:#dcfce7;color:#166534}
.badge.r{background:#fee2e2;color:#991b1b}
h2.sec{font-size:20px;margin:22px 0 6px;border-left:6px solid var(--acc);padding-left:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.flip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:118px;cursor:pointer;position:relative}
.flip .face{font-weight:600}
.flip .back{display:none;margin-top:8px;color:#374151;border-top:1px dashed var(--line);padding-top:8px}
.flip.open .back{display:block}
.flip .core{position:absolute;top:8px;right:10px;font-size:11px;color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.mini{border:1px solid var(--line);background:#faf8f3;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
button.mini.ok{background:#dcfce7;border-color:#86efac}
button.mini.bad{background:#fee2e2;border-color:#fca5a5}
button.main{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}
button.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer}
.boss{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.boss{grid-template-columns:1fr}}
.boss .left{position:sticky;top:10px}
@media(max-width:900px){.boss .left{position:static}}
.subq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}
.subq .q{font-weight:600}
.ans{display:none;margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.subq.open .ans{display:block}
.ans .a{font-weight:700;color:var(--acc2)}
.sig{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 10px;font-size:14.5px;margin-top:7px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
figcaption{font-size:13px;color:var(--mut);margin-top:6px}
.c1{color:var(--c1);font-weight:700}.c2{color:var(--c2);font-weight:700}.c3{color:var(--c3);font-weight:700}
.cover li{margin:7px 0;cursor:pointer}
.cover .one{display:none;color:var(--acc2);font-weight:600}
.cover li.open .one{display:inline}
select{font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line)}
.small{font-size:13.5px;color:var(--mut)}
a.jump{color:var(--acc2);text-decoration:none}
.kv{font-size:15px}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
</style>
</head>
<body>
<header>
  <div><h1>解法道場 <span style="font-size:14px;color:#d6cfc0">The Theory of Solutions</span></h1>
  <div class="sub">状況 → 解法選択を鍛える、数学・物理の1週間道場（数III・C／物理）</div></div>
  <nav>
    <button onclick="go('home')">ホーム</button>
    <button onclick="go('zukan')">カード図鑑</button>
    <button onclick="go('review')">復習モード</button>
  </nav>
</header>
<main id="app"></main>
<script>
/* ============ 図を式から描くためのプロッタ（SVG） ============ */
function plot(o){
  const W=520,H=340,pl=42,pr=14,pt=14,pb=36;
  const [x0,x1]=o.xr,[y0,y1]=o.yr;
  const X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr), Y=v=>H-pb-(v-y0)/(y1-y0)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  s+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" stroke="#9ca3af"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" stroke="#9ca3af"/>`;
  s+=`<text x="${X(x1)-8}" y="${Y(0)-6}" font-size="13" fill="#6b7280">x</text><text x="${X(0)+6}" y="${Y(y1)+4}" font-size="13" fill="#6b7280">y</text>`;
  (o.ticks||[]).forEach(([vx,vy,tx])=>{s+=`<text x="${X(vx)-6}" y="${Y(0)+18}" font-size="12" fill="#6b7280">${tx}</text>`;});
  if(o.shade){const f=o.shade.f,g=o.shade.g||(()=>0);let d="";const N=60;
    for(let i=0;i<=N;i++){const vx=o.shade.from+(o.shade.to-o.shade.from)*i/N;d+=(i?"L":"M")+X(vx).toFixed(1)+","+Y(f(vx)).toFixed(1)+" ";}
    for(let i=N;i>=0;i--){const vx=o.shade.from+(o.shade.to-o.shade.from)*i/N;d+="L"+X(vx).toFixed(1)+","+Y(g(vx)).toFixed(1)+" ";}
    s+=`<path d="${d}Z" fill="${o.shade.color}" opacity="0.30"/>`;}
  (o.funcs||[]).forEach(fn=>{let d="";const N=140;let pen=false;
    for(let i=0;i<=N;i++){const vx=x0+(x1-x0)*i/N;let vy=fn.f(vx);if(!isFinite(vy)||vy<y0-3||vy>y1+3){pen=false;continue;}
      vy=Math.max(y0,Math.min(y1,vy));d+=(pen?"L":"M")+X(vx).toFixed(1)+","+Y(vy).toFixed(1)+" ";pen=true;}
    s+=`<path d="${d}" fill="none" stroke="${fn.color}" stroke-width="2.4" ${fn.dash?'stroke-dasharray="6 4"':""}/>`;});
  (o.hlines||[]).forEach(([vy,color,tx])=>{s+=`<line x1="${X(x0)}" y1="${Y(vy)}" x2="${X(x1)}" y2="${Y(vy)}" stroke="${color}" stroke-dasharray="5 4"/><text x="${X(x1)-58}" y="${Y(vy)-5}" font-size="12" fill="${color}">${tx||""}</text>`;});
  (o.points||[]).forEach(([vx,vy,color,tx,dx,dy])=>{s+=`<circle cx="${X(vx)}" cy="${Y(vy)}" r="4.5" fill="${color}"/><text x="${X(vx)+(dx||8)}" y="${Y(vy)+(dy||-8)}" font-size="13" fill="${color}" font-weight="700">${tx||""}</text>`;});
  (o.arrows||[]).forEach(([ax,ay,bx,by,color,tx])=>{s+=`<line x1="${X(ax)}" y1="${Y(ay)}" x2="${X(bx)}" y2="${Y(by)}" stroke="${color}" stroke-width="2" marker-end="url(#ah)"/><text x="${X(bx)+6}" y="${Y(by)-6}" font-size="12.5" fill="${color}" font-weight="700">${tx||""}</text>`;});
  s+=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#374151"/></marker></defs></svg>`;
  return s;
}

 math:{theme:"媒介変数と曲線",core:"前の結果を部品にする",fig:"m6",figcap:"サイクロイド x=t−sin t, y=1−cos t の1アーチ。転がる円が描く曲線で、弧長も面積もキレイな値になる名物曲線。",

   ["x, y が t の式で与えられた","dy/dx = (dy/dt)/(dx/dt)。y の微分 ÷ x の微分","形を揃える"],

  boss:{title:"サイクロイドを解剖する",
   setup:"曲線 C：<span class='c1'>x=t−sin t, y=1−cos t</span>（0≦t≦2π）の1アーチを、微分・弧長・面積・体積の全部で味わう。",
   subs:[
    ["(1) dy/dx を t で表せ","sin t /(1−cos t)","dy/dt=sin t、dx/dt=1−cos t。その比を取る。半角で cot(t/2) とも書ける。"],
    ["(2) t=π/2 での接線の傾きと、その点の座標を求めよ","傾き 1、点 (π/2−1, 1)","傾きは sin(π/2)/(1−cos(π/2))=1/1=1。座標は x=π/2−1, y=1。図の青い点。"],

    ["(4) 1アーチと x軸で囲まれた部分の面積を求めよ","3π","S=∫y dx = ∫₀^{2π} (1−cos t)² dt = ∫(3/2 − 2cos t + (1/2)cos 2t) dt の形に展開すると 3π。転がした円の面積 π のちょうど3倍、という有名な結果。"],

  boss:{title:"陽子の加速と半円（卒業試験）",
   setup:"静止した陽子（質量 1.67×10⁻²⁷ kg、電荷 1.6×10⁻¹⁹ C）を <span class='c2'>200 V</span> で加速し、<span class='c1'>0.010 T</span> の一様磁場に垂直に入射させる。",
   subs:[
    ["(1) 加速で陽子が得る運動エネルギーを eV と J で表せ","200 eV、3.2×10⁻¹⁷ J","qV=1.6×10⁻¹⁹×200=3.2×10⁻¹⁷ J。eV ではそのまま 200 eV。"],
    ["(2) 加速後の速さを求めよ","約 2.0×10⁵ m/s","(1/2)mv²=qV より v=√(2qV/m)=√(2×3.2×10⁻¹⁷/1.67×10⁻²⁷)≈1.96×10⁵ m/s。"],
    ["(3) 磁場中での円運動の半径を求めよ","約 0.20 m","r=mv/(qB)=(1.67×10⁻²⁷×1.96×10⁵)/(1.6×10⁻¹⁹×0.010)≈0.204 m。図の半円。"],
    ["(4) 半円を描いて磁場を出るまでにかかる時間を求めよ","約 3.3×10⁻⁶ s","半周期 = πm/(qB) = π×1.67×10⁻²⁷/(1.6×10⁻²¹) ≈ 3.28×10⁻⁶ s。速さも半径も要らない。"],
    ["(5)【苦手どん】同じ磁場に電場を重ね、陽子が直進するための電場の強さを求めよ","約 2.0×10³ V/m","直進条件は電気力とローレンツ力のつり合い qE=qvB、つまり E=vB≈1.96×10⁵×0.010≈2.0×10³ V/m。速さがこの値の粒子だけが選別される。"]],
   transfer:"加速（エネルギー）→円運動（力）→選別（つり合い）の3段は、Day1・Day2・Day5 の型の合成。卒業試験として全部の型が1題に収まった。"},
  cover:[
   ["ブラウン管・CRT の原理","電場で偏向、磁場でも偏向できる。画面の走査に応用された"],
   ["オーロラの仕組み","荷電粒子が地磁気に沿ってらせん運動し、極地に集まる"],
   ["ベータトロン・シンクロトロン","加速器の発展形。磁場を強めて半径を保つ工夫が入る"],
   ["ローレンツ力の向きの判定","フレミング左手。負電荷では向きが逆になる点に注意"],
   ["磁場中のらせん運動","磁場に平行な成分は等速直線、垂直成分は円運動。その合成"],
   ["電位差と電場の関係","E=V/d は一様電場の話。加速電圧と混同しない"],
   ["相対論が要る境界","速さが光速の1割を超えると古典計算がずれ始める"]]}
}
];
/* ============ アプリ本体 ============ */
const $app=document.getElementById("app");
let S={};
try{S=JSON.parse(localStorage.getItem("dojo-v1")||"{}")}catch(e){S={}}
S.done=S.done||{}; S.weak=S.weak||{}; S.tasks=S.tasks||{}; S.susp=S.susp||[];
function save(){localStorage.setItem("dojo-v1",JSON.stringify(S))}
let view={name:"home"}, openSubs={};
function go(v,arg){view={name:v,...(arg||{})};openSubs={};render();window.scrollTo(0,0)}
function esc(s){return s}
function subjName(s){return s==="math"?"数学":"物理"}
function dayData(d){return DAYS.find(v=>v.day===d)}
function todayDay(){
  const start=new Date("2026-11-27T00:00:00+09:00").getTime();
  const now=Date.now(); let idx=Math.floor((now-start)/86400000);
  if(idx<0)idx=0; return (idx%7)+1;
}
function dateKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function render(){
  if(view.name==="home")renderHome();
  else if(view.name==="day")renderDay(view.subj,view.day);
  else if(view.name==="zukan")renderZukan();
  else if(view.name==="review")renderReview();
}
function taskRow(key,label,linkHtml){
  const tk=S.tasks[dateKey()]||{}; const on=!!tk[key];
  return `<div class="task"><input type="checkbox" ${on?"checked":""} onchange="toggleTask('${key}',this.checked)"><span class="${on?"done-t":""}">${label}</span>${linkHtml||""}</div>`;
}
function toggleTask(k,v){const dk=dateKey();S.tasks[dk]=S.tasks[dk]||{};S.tasks[dk][k]=v;save();render()}
function renderHome(){
  const d=todayDay(); const dd=dayData(d);
  let h=`<div class="panel today"><h2>今日のタスク（Day ${d} / 7）</h2>`;
  h+=taskRow("m","数学：解法カード「"+dd.math.theme+"」＋ 大問1題",`<a href="#" onclick="go('day',{subj:'math',day:${d}});return false">→ 道場で開く</a>`);
  h+=taskRow("p","物理：解法カード「"+dd.phys.theme+"」＋ 大問1題",`<a href="#" onclick="go('day',{subj:'phys',day:${d}});return false">→ 道場で開く</a>`);
  h+=taskRow("e1","英語：神奈川大の大問1つ（新規に解く→精読→音読）","");
  h+=taskRow("e2", d===1?"英語：前日の読み直し（初日は単語サイトの復習で代用）":"英語：昨日やった大問の読み直し＋音読","");
  h+=taskRow("w","英単語：2〜3セット",`<a href="https://yudukik0715-stack.github.io/English/" target="_blank" rel="noopener">→ 単語サイト</a>`);
  h+=`<div class="small">タスクは日付が変わると自動で切り替わります。進み具合はこの端末の中だけに保存されます。</div></div>`;
  h+=`<h2 class="sec">1週間の道場（数学・物理 各7大問）</h2><div class="grid">`;
  DAYS.forEach(v=>{
    ["math","phys"].forEach(s=>{
      const key=s+v.day, done=S.done[key];
      h+=`<div class="daycard" onclick="go('day',{subj:'${s}',day:${v.day}})"><span class="badge ${s==="math"?"":"b"}">${subjName(s)} Day ${v.day}</span>${done?'<span class="badge g">完了</span>':""}<h3>${v[s].theme}</h3><div class="small">芯の考え方：${v[s].core} ／ カード ${v[s].cards.length}枚 ＋ 大問1題 ＋ 網羅確認 ${v[s].cover.length}個</div></div>`;
    });
  });
  h+=`</div>`;
  const wk=Object.keys(S.weak).filter(k=>S.weak[k]);
  h+=`<div class="panel"><b>苦手プール：${wk.length} 件</b> <span class="small">間違えた／あやしいものがここに溜まります。</span> <a class="jump" href="#" onclick="go('review');return false">→ 復習モードで見る</a></div>`;
  h+=`<div class="panel small">このサイトの問題は、複数の大学入試過去問で繰り返し現れる典型構成を再編集したものです（特定の問題の転載ではありません）。全ての小問の答えは、数式処理（SymPy）による機械計算と、別ルートでの解き直しで検証してあります。おかしいと感じた問題は各大問の「これ怪しい」ボタンで知らせてください。</div>`;
  $app.innerHTML=h;
}
function cardId(s,d,i){return `card-${s}-${d}-${i}`}
function subId(s,d,i){return `sub-${s}-${d}-${i}`}
function covId(s,d,i){return `cov-${s}-${d}-${i}`}
function weakBtn(id){
  const on=S.weak[id];
  return `<button class="mini ${on?"bad":""}" onclick="event.stopPropagation();toggleWeak('${id}')">${on?"苦手プール入り ✓":"あやしい→苦手プールへ"}</button>`;
}
function toggleWeak(id){S.weak[id]=!S.weak[id];save();render()}
function flipCard(el){el.classList.toggle("open")}
function renderDay(s,d){
  const v=dayData(d)[s]; const key=s+d;
  let h=`<button class="ghost" onclick="go('home')">← ホームへ</button> <span class="badge ${s==="math"?"":"b"}">${subjName(s)} Day ${d}</span>${S.done[key]?'<span class="badge g">完了</span>':""}`;
  h+=`<h2 class="sec">${v.theme}</h2><p>${v.intro}</p>`;
  h+=`<h3>① 解法カード（状況を見て、解法を先に当てる）</h3><div class="cards">`;
  v.cards.forEach((c,i)=>{
    h+=`<div class="flip" onclick="flipCard(this)"><span class="core">${c[2]}</span><div class="face">${c[0]}</div><div class="back">${c[1]}<div class="btns">${weakBtn(cardId(s,d,i))}</div></div></div>`;
  });
  h+=`</div><h3>② ボス大問</h3><div class="boss"><div class="left"><div class="panel" style="margin-top:0"><b>${v.boss.title}</b><p class="kv">${v.boss.setup}</p></div><figure>${FIG[v.fig]()}<figcaption>${v.figcap}</figcaption></figure></div><div>`;
  v.boss.subs.forEach((q,i)=>{
    const id=subId(s,d,i);
    h+=`<div class="subq ${openSubs[id]?"open":""}" id="${id}"><div class="q">${q[0]}</div><div class="btns"><button class="mini" onclick="toggleSub('${id}')">答えと解説を見る</button>${weakBtn(id)}<button class="mini" onclick="susp('${id}')">これ怪しい</button></div><div class="ans"><div class="a">答え：${q[1]}</div><div class="sig">${q[2]}</div></div></div>`;
  });
  h+=`<div class="panel"><b>この考え方、他ではここで使える</b><br>${v.boss.transfer}<hr class="sep"><span class="small">${SRC}</span></div>`;
  h+=`</div></div><h3>③ 網羅確認（タップで一言が出る）</h3><div class="panel"><ol class="cover">`;
  v.cover.forEach((c,i)=>{
    h+=`<li onclick="this.classList.toggle('open')">${c[0]} → <span class="one">${c[1]}</span> <span class="btns" style="display:inline-flex">${weakBtn(covId(s,d,i))}</span></li>`;
  });
  h+=`</ol></div>`;
  h+=`<button class="main" onclick="markDone('${key}')">${S.done[key]?"完了を取り消す":"このセットを完了にする"}</button>`;
  $app.innerHTML=h;
}
function toggleSub(id){openSubs[id]=!openSubs[id];render();
  const el=document.getElementById(id); if(el)el.scrollIntoView({block:"center"});}
function susp(id){if(!S.susp.includes(id))S.susp.push(id);save();alert("記録しました。あとで再検証します（記録はこの端末に保存されます）");}
function markDone(key){S.done[key]=!S.done[key];save();render()}
function allCards(){
  const out=[];
  DAYS.forEach(v=>{["math","phys"].forEach(s=>{v[s].cards.forEach((c,i)=>out.push({id:cardId(s,v.day,i),s,day:v.day,theme:v[s].theme,core:c[2],face:c[0],back:c[1]}))})});
  return out;
}
function renderZukan(){
  const f=view.f||{};
  const cores=[...new Set(allCards().map(c=>c.core))];
  const themes=[...new Set(allCards().map(c=>c.theme))];
  let h=`<h2 class="sec">カード図鑑（いつでも見返せる）</h2><div class="panel">
  科目 <select id="fz-s" onchange="setF('s',this.value)"><option value="">全部</option><option value="math" ${f.s==="math"?"selected":""}>数学</option><option value="phys" ${f.s==="phys"?"selected":""}>物理</option></select>
  分野 <select id="fz-t" onchange="setF('t',this.value)"><option value="">全部</option>${themes.map(t=>`<option ${f.t===t?"selected":""}>${t}</option>`).join("")}</select>
  考え方 <select id="fz-c" onchange="setF('c',this.value)"><option value="">全部</option>${cores.map(t=>`<option ${f.c===t?"selected":""}>${t}</option>`).join("")}</select>
  <label><input type="checkbox" ${f.w?"checked":""} onchange="setF('w',this.checked)"> 苦手のみ</label></div><div class="cards">`;
  allCards().filter(c=>(!f.s||c.s===f.s)&&(!f.t||c.theme===f.t)&&(!f.c||c.core===f.c)&&(!f.w||S.weak[c.id])).forEach(c=>{
    h+=`<div class="flip" onclick="flipCard(this)"><span class="core">${subjName(c.s)} Day${c.day}・${c.core}</span><div class="face">${c.face}</div><div class="back">${c.back}<div class="btns">${weakBtn(c.id)}</div></div></div>`;
  });
  h+=`</div>`;$app.innerHTML=h;
}
function setF(k,v){view.f=view.f||{};view.f[k]=v;render()}
function renderReview(){
  let h=`<h2 class="sec">復習モード</h2>`;
  const wk=allCards().filter(c=>S.weak[c.id]);
  h+=`<div class="panel"><b>苦手プールのカード（${wk.length}）</b>`;
  if(!wk.length)h+=`<div class="small">まだ空です。カードや小問で「あやしい」を押すとここに溜まります。</div>`;
  wk.forEach(c=>{h+=`<div class="task"><span>${subjName(c.s)} Day${c.day}「${c.theme}」：${c.face}</span><a class="jump" href="#" onclick="go('day',{subj:'${c.s}',day:${c.day}});return false">→ 開く</a></div>`});
  const ws=[]; DAYS.forEach(v=>{["math","phys"].forEach(s=>{v[s].boss.subs.forEach((q,i)=>{if(S.weak[subId(s,v.day,i)])ws.push({s,day:v.day,i,q:q[0]})})})});
  h+=`<br><b>苦手な小問（${ws.length}）</b>`;
  ws.forEach(w=>{h+=`<div class="task"><span>${subjName(w.s)} Day${w.day} ${w.q}</span><a class="jump" href="#" onclick="go('day',{subj:'${w.s}',day:${w.day}});return false">→ 開く</a></div>`});
  h+=`</div><div class="panel"><b>全問題へ直接ジャンプ</b>`;
  DAYS.forEach(v=>{["math","phys"].forEach(s=>{
    h+=`<div style="margin-top:8px"><span class="badge ${s==="math"?"":"b"}">${subjName(s)} Day${v.day} ${v[s].theme}</span> `;
    v[s].boss.subs.forEach((q,i)=>{h+=`<a class="jump" href="#" onclick="jumpSub('${s}',${v.day},'${subId(s,v.day,i)}');return false">(${i+1})</a> `});
    h+=`</div>`;
  })});
  h+=`</div>`;$app.innerHTML=h;
}
function jumpSub(s,d,id){go("day",{subj:s,day:d});openSubs[id]=true;render();const el=document.getElementById(id);if(el)el.scrollIntoView({block:"center"})}
render();
</script>
</body>
</html>
