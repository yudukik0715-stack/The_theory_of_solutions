<script>
const SETS = [{"key": "math1", "group": "数学（III・C）", "theme": "微分の応用", "day": 1, "count": 8}, {"key": "math2", "group": "数学（III・C）", "theme": "積分と面積", "day": 2, "count": 8}, {"key": "math3", "group": "数学（III・C）", "theme": "積分と体積", "day": 3, "count": 8}, {"key": "math4", "group": "数学（III・C）", "theme": "極限の融合", "day": 4, "count": 8}, {"key": "math5", "group": "数学（III・C）", "theme": "複素数平面", "day": 5, "count": 8}, {"key": "math6", "group": "数学（III・C）", "theme": "媒介変数と曲線", "day": 6, "count": 8}, {"key": "math7", "group": "数学（III・C）", "theme": "総合（卒業試験）", "day": 7, "count": 8}, {"key": "ab1", "group": "数学（I・A・II・B・C）", "theme": "二次関数", "day": 1, "count": 8}, {"key": "ab2", "group": "数学（I・A・II・B・C）", "theme": "図形と計量", "day": 2, "count": 8}, {"key": "ab3", "group": "数学（I・A・II・B・C）", "theme": "場合の数と確率", "day": 3, "count": 8}, {"key": "ab4", "group": "数学（I・A・II・B・C）", "theme": "図形の性質", "day": 4, "count": 8}, {"key": "ab5", "group": "数学（I・A・II・B・C）", "theme": "三角関数・指数対数", "day": 5, "count": 8}, {"key": "ab6", "group": "数学（I・A・II・B・C）", "theme": "図形と方程式と微分積分", "day": 6, "count": 8}, {"key": "ab7", "group": "数学（I・A・II・B・C）", "theme": "数列", "day": 7, "count": 8}, {"key": "ab8", "group": "数学（I・A・II・B・C）", "theme": "統計的推測", "day": 8, "count": 8}, {"key": "ab9", "group": "数学（I・A・II・B・C）", "theme": "数と式・集合と命題", "day": 9, "count": 8}, {"key": "ab10", "group": "数学（I・A・II・B・C）", "theme": "データの分析", "day": 10, "count": 8}, {"key": "ab11", "group": "数学（I・A・II・B・C）", "theme": "式と証明・複素数と方程式", "day": 11, "count": 8}, {"key": "ab12", "group": "数学（I・A・II・B・C）", "theme": "ベクトル", "day": 12, "count": 8}, {"key": "phys1", "group": "物理", "theme": "力学・保存則の選択", "day": 1, "count": 8}, {"key": "phys2", "group": "物理", "theme": "円運動と単振動", "day": 2, "count": 8}, {"key": "phys3", "group": "物理", "theme": "熱力学", "day": 3, "count": 8}, {"key": "phys4", "group": "物理", "theme": "電場と回路", "day": 4, "count": 8}, {"key": "phys5", "group": "物理", "theme": "磁場と電磁誘導", "day": 5, "count": 8}, {"key": "phys6", "group": "物理", "theme": "波動", "day": 6, "count": 8}, {"key": "phys7", "group": "物理", "theme": "総合（卒業試験）", "day": 7, "count": 8}];
const NOTES = {"math1": {"core": "微分の仕事は「グラフの形を式から読み取る」こと。増減・極値・接線・解の個数は、全部 f′ の符号と極値という2つの部品に分解できる。", "flow": ["出発点は増減表です。3次関数で「増減を調べよ」と来たら、まず微分して f′(x)=0 の x を出す。そこが山（極大）と谷（極小）の位置だからです。増減表を書くのが面倒でも、f′ を因数分解して符号だけ区間ごとに読めれば本質は同じです。符号が + から − に変わる所が山、− から + が谷、という「符号の変化」が増減の正体です。", "グラフの形が分かると、方程式 f(x)=k の実数解の個数は「y=k の水平線とグラフの交点の数」に翻訳できます。水平線を上下に動かすと、交点の数が変わる境界は必ず極大値・極小値の所。だからパラメータで解の個数が変わる問題は、極値を先に固定してから a を動かすのが順序です。「異なる3つの実数解」と書いてあれば、極大値 > k > 極小値 の形に持ち込む合図だと思ってください。", "接線は「傾き＝その点での微分係数 f′(a)」という1点の情報から作ります。曲線上の点ならすぐ作れますが、「曲線外の点を通る接線」では接点が未知数です。接点を (t, f(t)) と置いて接線を作り、通る点の条件を t の方程式にする——未知数を先に置いて条件で決める、という流れが大事です。", "閉区間の最大・最小は、候補が「極値点と両端」だけに限られます。増減を全部調べる必要はなく、候補を全部代入して比べるだけ。極値と端点は性質が違うので、混同しないことが境界の意識です。"], "example": {"q": "f(x) = x³ − 3x について、極値を求め、方程式 f(x) = 0 の実数解の個数を調べよ。", "a": "f′(x) = 3x² − 3 = 3(x−1)(x+1) だから、x = −1 で極大値 f(−1) = 2、x = 1 で極小値 f(1) = −2。水平線 y = 0 は極大値 2 と極小値 −2 の間にあるので、グラフと3点で交わる。実際 f(x) = x(x² − 3) と因数分解でき、解は x = 0, ±√3 の3つ（機械確認済み）。"}, "confuse": ["極値と最大・最小は別物。閉区間では端点が極値より大きく（小さく）なることがあるので、候補に必ず両端を入れる。", "解の個数は判別式ではなくグラフで数える（3次方程式に判別式の公式運用はしない）。境界は極値。"]}, "phys1": {"core": "力学の計算は、新しい公式を覚えるより「どの量が保存するか」を先に選ぶゲーム。衝突は運動量、なめらかな運動は力学的エネルギー、摩擦があれば仕事を差し引く。", "flow": ["「なめらかな水平面で衝突」と書いてあれば、衝突の前後で運動量保存です。衝突は、外力の力積が無視できるほど短い一瞬の出来事。だから衝突の「直前・直後」だけを切り取って運動量保存を使い、他の区間と混ぜないのが鉄則です。", "衝突の種類で本数が変わります。「完全弾性衝突（弾性衝突）」と明記されたら、運動量保存＋力学的エネルギー保存の2本立て（反発係数 e=1 でも同じ）。逆に「合体した」「くっついて一緒に動く」なら完全非弾性で、保存するのは運動量だけ。エネルギーは減り、減った分は熱や変形に変わっています。", "衝突でない区間は力学的エネルギーが主役です。「なめらかな斜面をのぼる／滑り降りる」なら高さと速さの交換、ばねが絡めば弾性エネルギーを含めた保存で、自然長の位置を基準に置きます。ただし粗い面で摩擦がある区間ではエネルギー保存は使えません。摩擦の仕事 = −(摩擦力)×(距離) を差し引く形に切り替えます。", "2物体が糸や棒でつながっている場合は、一体として運動量やエネルギーを考えると内力が相殺して式が簡単になります。「系全体で見るか、1つずつ見るか」も保存則の選択の一部です。"], "example": {"q": "なめらかな水平面上で、質量 2 kg の球が速さ 3 m/s で進み、静止している質量 1 kg の球に完全弾性衝突をした。衝突後の速さを求めよ。", "a": "運動量保存：2・3 + 1・0 = 2v₁' + 1v₂'。エネルギー保存：(1/2)・2・3² = (1/2)・2v₁'² + (1/2)・1v₂'²。連立すると v₁' = 1 m/s、v₂' = 4 m/s。検算：運動量は前後とも 6、運動エネルギーは前後とも 9 J で一致（機械確認済み）。"}, "confuse": ["「合体」と「弾性」は真逆の合図。合体は運動量だけ、弾性は運動量＋エネルギーの2本。", "摩擦がある区間でエネルギー保存をそのまま使うのが典型的なミス。摩擦の仕事を引く形に変える。"]}, "math2": {"core": "面積は「区間を決めて、(上)−(下) を積む」が本体。交点が区間を決め、符号が区間を割り、対称性と公式が計算を縮める。", "flow": ["2曲線で囲まれた面積は、まず交点を求めることから始めます。交点の x が積分区間の端になるからです。その間で (上の式)−(下の式) を積分するのが基本形。上下が途中で入れ替わるなら、交点で区間を割ります。", "x軸と曲線の面積で曲線が下に潜る区間があると、符号付きで積分すると面積が相殺されてしまいます。符号をそのまま積分せず、区間を割って絶対値を取るのが正解です。「積分の値」と「面積」は別物だという意識が境界になります。", "計算を縮める道具も揃っています。放物線と直線で囲まれ、交点の x が α, β のときだけ使える 1/6 公式（面積 = |a|(β−α)³/6、a は2つの式の差の x² の係数）。偶関数・奇関数が対称区間に出たら、偶関数は半区間の2倍、奇関数は 0。どちらも「形が揃ったときだけ」使える近道です。", "y を x の関数で表しにくい曲線は、x を y の関数として横に積分する（右−左）と素直になります。そして面積をパラメータの式で表して方程式を解く、面積を傾きの関数として微分して最小を探す、といった「面積を部品にする」問題や、回転体の前に面積を確定させる二段構えも、この考え方の延長です。"], "example": {"q": "直線 y = x と放物線 y = x² で囲まれた部分の面積を求めよ。", "a": "交点は x² = x より x = 0, 1。その間は直線が上なので、面積 = ∫₀¹ (x − x²) dx = [x²/2 − x³/3]₀¹ = 1/2 − 1/3 = 1/6。1/6 公式 |a|(β−α)³/6（ここでは a=−1 で |a|=1）= 1/6 とも一致する（機械確認済み）。"}, "confuse": ["1/6 公式は「放物線と直線」の組専用。2つの放物線同士でも差が2次式になれば使える（その時の a は差の x² の係数）が、形が違うときは普通の積分に戻る。", "符号付き積分と面積の混同。下に潜る区間は絶対値を取るか、区間を割って引き算の向きを直す。"]}, "phys2": {"core": "円運動と単振動は「中心向きの復元」という同じ構造。向心力は合力の名前、単振動は円運動の影。周期の公式は振幅によらない形に揃っている。", "flow": ["等速円運動で力を聞かれたら、向心力 = m v²/r、向きは常に中心です。向心力は新しい力ではなく、張力や垂直抗力などの合力についた名前。だから「どの力が中心向きの合力になっているか」を図で読むのが先です。周期は T = 2πr/v、1周の距離 ÷ 速さ、と意味から作れます。", "単振動の周期は T = 2π√(m/k)（ばね）または 2π√(l/g)（単振り子）で、振幅には依存しません。鉛直ばねでも周期は水平ばねと同じで、つり合いの位置が振動の中心になるだけです。", "最大速度・最大加速度は v_max = Aω、a_max = Aω²。速さは中心（つり合い点）で最大、加速度は端で最大と、場所がずれているのがポイントです。エネルギーは (1/2)kA² が全体で一定で、運動エネルギーと位置エネルギーが交換し続けます。", "円運動する物体の影は単振動になり、振幅は半径、ω は円運動の角速度と一致します。この「影」の見方は、単振動の位相を円で考える入口です。また糸がたるむ／面を離れる瞬間は、垂直抗力や張力が 0 になる条件で式を立てます。境界の瞬間が答えを決めます。"], "example": {"q": "ばね定数 k = 100 N/m のばねに質量 1 kg の物体をつけて単振動させた。振幅が 0.20 m のとき、周期と最大速度、全エネルギーを求めよ。", "a": "ω = √(k/m) = 10 rad/s だから周期 T = 2π/ω = π/5 s（約 0.63 s）。最大速度 v_max = Aω = 0.20・10 = 2.0 m/s。全エネルギー E = (1/2)kA² = (1/2)・100・0.04 = 2.0 J（機械確認済み）。"}, "confuse": ["向心力を「新しく加わる力」として図に描き足すのが典型ミス。実在の力の合力の向きと大きさを表す言葉。", "速さ最大は端ではなく中心。加速度最大は端。最大の場所が真逆なのでセットで覚える。"]}, "math3": {"core": "体積は「切って、断面積を積む」の1つの発想で全部まかなう。回転体なら断面は円、半径は「軸からの距離」で測る。", "flow": ["回転体の体積は、回転軸に垂直に切ることから始めます。断面は円だから断面積は π×(半径)²、あとはそれを積分するだけ。x軸の周りの回転なら半径は y そのもので、V = π∫y² dx が基本形になります。", "y軸の周りの回転で詰まったら、方法は2つ。x を y で表して横向きの円盤にするか、円筒の殻を積む（バウムクーヘン）かです。2曲線の間の領域を回転させると断面はドーナツ型（ワッシャー）になり、π×(外半径² − 内半径²) を積みます。", "軸が y=1 のようにずれていても、半径は「軸からの距離」で測れば同じです。1−x² のように引き算で半径を作るのがコツ。そして回転しない立体でも、断面積 S(x) が分かれば体積は ∫S(x)dx と同じ考え方で出ます。回転体かどうかではなく「断面積が書けるか」が本体です。", "体積に π が出るか迷ったら、断面が円かどうかで判断します。断面が多角形なら π は出ません。無限まで回転させる広義積分では、まず有限で積分してから極限を取り、体積が有限に収まることがあるのを確認します。"], "example": {"q": "曲線 y = √x と x 軸、直線 x = 1 で囲まれた部分を x 軸の周りに回転してできる立体の体積を求めよ。", "a": "半径は y = √x だから、V = π∫₀¹ (√x)² dx = π∫₀¹ x dx = π・[x²/2]₀¹ = π/2（機械確認済み）。"}, "confuse": ["y軸回転でそのまま π∫y² dx としてしまうミス。軸に合わせて「切る方向と半径」を取り直す。", "ワッシャーで (外半径 − 内半径)² としてしまうミス。正しくは外半径² − 内半径²。"]}, "phys3": {"core": "熱力学は p−V グラフの読み方の問題。仕事は面積、温度は pV の積、内部エネルギーは状態量。熱力学第一法則で帳尻を合わせる。", "flow": ["p−V グラフで仕事を聞かれたら、仕事はグラフと V 軸の間の面積です。膨張なら +、圧縮なら −。定圧変化なら W = pΔV と長方形の面積として読めます。定積変化（V 一定）では面積が 0 なので仕事は 0、内部エネルギーの変化がそのまま熱になります。", "温度の大小は pV の積で比べます。pV = nRT だから、pV が大きい点ほど高温で、等温線は双曲線です。グラフ上の点の位置から温度を読むのがこの単元の基本動作です。", "サイクル（1周して戻る過程）では、正味の仕事はサイクルが囲む面積。時計回りなら外部に正の仕事をします。熱効率は (正味の仕事)/(吸収した熱) で、放出した熱は分母に入れません。", "断熱変化は Q = 0 で、内部エネルギーと仕事だけが交換します。内部エネルギーの変化 ΔU は経路によらず最初と最後の温度だけで決まる状態量。だから「一周回ると ΔU = 0」という性質がサイクルの計算の土台になります。"], "example": {"q": "気体が圧力 2.0×10⁵ Pa を保ったまま、体積が 1.0×10⁻³ m³ から 4.0×10⁻³ m³ に膨張した。気体がした仕事を求めよ。", "a": "定圧変化だから W = pΔV = 2.0×10⁵ × (4.0×10⁻³ − 1.0×10⁻³) = 2.0×10⁵ × 3.0×10⁻³ = 6.0×10² J。p−V グラフでは幅 ΔV・高さ p の長方形の面積にあたる（機械確認済み）。"}, "confuse": ["熱効率の分母は「吸収した熱」だけ。放出熱まで入れると効率が過小になる。", "ΔU は経路で変わると思ってしまうミス。変わるのは Q と W で、ΔU は始点と終点だけで決まる。"]}, "math4": {"core": "極限は「知っている形に寄せる」作業。有名極限・等比・はさみうち・区分求積の4つの型のどれかに変形できれば勝ち。", "flow": ["漸化式 aₙ₊₁ = f(aₙ) の極限は、まず α = f(α) を解いて極限の候補を出します。次に aₙ − α が等比数列になる形に変形すれば、極限は自然に見えてきます。「候補を先に決めて、差を等比に直す」のが順序です。", "関数の極限は形の寄せ方がすべて。0/0 型で sin が混ざれば sin x / x → 1 の形に角度を揃え、(1+1/n)ⁿ の仲間なら e の定義に寄せます。不定形 ∞−∞ は通分か有理化で分数の形に変えてから考えます。なおロピタルは高校範囲では使えない前提で、有理化・因数分解・有名極限で処理します。", "和の極限 Σ は、はさみうち（各項を端で押さえる）か、区分求積（(1/n)Σf(k/n) の形）のどちらかに寄せます。はさみうちの見つけ方は、一番大きい項と小さい項で全体を押さえること。n 個の和なら n×(最大) と n×(最小) が目安です。", "無限級数の和は部分和を作るのが出発点。等比なら公式、ズレる形なら差分に分解して相殺させます。どれも「知っている形に寄せる」という芯は同じです。"], "example": {"q": "a₁ = 1、aₙ₊₁ = (1/2)aₙ + 1 で定まる数列の a₅ と極限を求めよ。", "a": "α = (1/2)α + 1 を解くと α = 2。aₙ₊₁ − 2 = (1/2)(aₙ − 2) だから aₙ − 2 = (a₁ − 2)(1/2)ⁿ⁻¹ = −(1/2)ⁿ⁻¹。よって a₅ = 2 − (1/2)⁴ = 31/16、極限は 2（機械確認済み）。"}, "confuse": ["α = f(α) を解いただけでは極限の証明にならない。aₙ − α が等比（公比の絶対値 < 1）になる変形までがセット。", "和の極限ではさみうちと区分求積の見分け：(1/n) の因子と k/n の形が見えたら区分求積、項の大小で押さえられそうならはさみうち。"]}, "phys4": {"core": "コンデンサーの切り替え問題は「電荷保存」と「エネルギー保存」を分けて考えるのが芯。保存するのは孤立部分の総電荷で、エネルギーは減って熱になる。", "flow": ["土台は Q = CV。電荷・容量・電圧の3つは常にこの関係で結ばれます。エネルギーは U = (1/2)CV² = (1/2)QV = Q²/(2C) の3形があり、場面で使いやすい形を選びます。", "スイッチ切り替えでコンデンサーをつなぎ替えると、孤立部分の総電荷が保存します。まず Q の合計を固定してから電圧を配分するのが順序です。切り替え後の共通電位は V = Q合計/(C合計) で、並列接続として1つのコンデンサーに読み替えられます。", "ここで大事なのが、つなぎ替えでエネルギーは保存しないことです。減った分の行き先は抵抗で発生する熱。電荷保存とエネルギー保存は別物だと意識するのがこの単元の芯です。", "接続の形も整理しておきます。直列接続は電荷が共通で電圧が分かれ、合成容量は逆数の和の逆数。極板間隔や面積を変えると C = εS/d で容量が変わりますが、電池に接続中か切り離した後かで固定される量（V か Q か）が違うので、切り替わる瞬間で区切って考えます。回路全体では、閉回路1周で電圧の合計が 0、分岐点で電流の合計が保存するキルヒホッフの法則が土台になります。"], "example": {"q": "容量 2 μF のコンデンサーを 6 V で充電して電池を外し、充電されていない容量 4 μF のコンデンサーに並列につないだ。共通の電圧と、失われたエネルギーを求めよ。", "a": "電荷は Q = CV = 2×6 = 12 μC で保存する。共通電位 V = 12/(2+4) = 2 V。エネルギーは前が (1/2)・2・6² = 36 μJ、後が (1/2)・6・2² = 12 μJ。差の 24 μJ が熱として失われた（機械確認済み）。"}, "confuse": ["つなぎ替えで「エネルギーも保存する」と思うミス。保存するのは電荷。エネルギーの減少分は熱。", "直列と並列で合成容量の作り方が逆になる点。直列は逆数の和の逆数、並列は単純な和。"]}, "math5": {"core": "複素数平面は「掛け算＝回転と拡大」という1つの読み替えで回る。距離は |z−α|、回転は偏角の和、と式を図の言葉に翻訳する。", "flow": ["複素数の掛け算は、絶対値は積、偏角は和になります。つまり回転と拡大の合成。特に ×i は原点の周りの 90° 回転で、座標では (a, b) → (−b, a) とそのまま読めます。", "図形の条件は距離の言葉で読みます。|z−α| は点 α からの距離で、= r なら円、|z−α| = |z−β| なら垂直二等分線。式の形を見て図形を言い当てるのがこの単元の基本動作です。", "正三角形・正方形の頂点を求める問題は、1辺のベクトル（複素数）を ±60°（正方形なら 90°）回転して足す、という部品化で解けます。回転の中心が原点でない場合は、中心を引いて原点中心に直し、回転してから戻す「平行移動の往復」です。", "z² の解は極形式で、絶対値は √、偏角は半分。解は2つあり、もう1つは符号反転。共役 z̄ は実軸対称の点で、z + z̄ = 2Re z、z・z̄ = |z|² を使います。軌跡の問題は、z = x + yi と置いて実数の条件式に直すか、距離の言葉で読むかの二択で攻めます。"], "example": {"q": "複素数 1 + i に i を掛けた値を求め、図形的な意味を述べよ。", "a": "(1 + i)i = i + i² = −1 + i。|1 + i| = √2、偏角 45° の点が、i を掛けることで偏角 135° の点 −1 + i に移る。つまり原点の周りの 90° 回転（機械確認済み）。"}, "confuse": ["|z−α| = |z−β| を円だと思ってしまうミス。これは2点から等距離の点の集合、つまり垂直二等分線。", "回転の中心が原点でないのに、そのまま偏角を足してしまうミス。中心を引いてから回転し、最後に戻す。"]}, "phys5": {"core": "電磁誘導は「磁束の変化が起電力を作る」の一点。向きはレンツ（変化を妨げる向き）、大きさは Φ の変化の速さで決まる。", "flow": ["磁束の定義 Φ = BS（垂直な時、傾いていれば Φ = BS cosθ）が土台です。コイルを貫く磁束が変わると起電力 −N(ΔΦ/Δt) が生じます。マイナスは「変化を妨げる向き」という宣言（レンツの法則）で、誘導電流の向きは、増える磁束には反対向きの磁場を作る向き、と読みます。", "磁場中で導体棒が動く場合は起電力 V = BLv。磁場・長さ・速さの3つが全部垂直な時の形です。誘導電流が流れると、その電流が磁場から受ける力 F = BIL が運動を妨げる向きに働きます。", "エネルギーの帳尻も確認できます。棒を引く外力の仕事率 Fv と、電気的仕事率 VI は一致するはずで、検算に使えます。「妨げる向きの力に逆らって仕事をした分が電気エネルギーになる」という流れです。", "磁場中を動く荷電粒子は、ローレンツ力 qvB が向心力になって円運動をし、半径は r = mv/(qB)。自己誘導・相互誘導では、電流の変化そのものが起電力を作り、大きさは変化の速さ ΔI/Δt に比例します。"], "example": {"q": "磁束密度 0.50 T の磁場に垂直に置いた長さ 0.40 m の導体棒を、磁場と棒の両方に垂直な向きに速さ 3.0 m/s で動かした。棒に生じる起電力を求めよ。", "a": "V = BLv = 0.50 × 0.40 × 3.0 = 0.60 V（機械確認済み）。"}, "confuse": ["起電力の公式 V = BLv は3つが互いに垂直な時だけの形。傾いている成分は cos や sin で分解してから使う。", "誘導電流の向きを「磁束と同じ向きを強める」と勘違いするミス。必ず変化を妨げる向き。"]}, "math6": {"core": "媒介変数表示は「t で全部を動かす」表示。微分も積分も弧長も、x と y を t の式に直してから普通の計算に戻す。", "flow": ["x, y が t の式で与えられたら、接線の傾きは dy/dx = (dy/dt)/(dx/dt)、つまり y の微分 ÷ x の微分です。傾きが 0 になる点は dy/dt = 0 の t（ただし dx/dt ≠ 0）で、グラフの山や谷の頂点に対応します。", "曲線の概形を描くには、x, y それぞれの増減表を t で作り、組み合わせて点の動きを追います。t を消去して x, y の式にしたい場面では、三角なら sin² + cos² = 1 のような恒等式で消しますが、消せない曲線も多いので無理に消そうとしないことも大事です。", "積分は置き換えが鍵です。面積は ∫y dx = ∫y(t)・x′(t) dt と、dx を t の式に替えます。回転体の体積も V = π∫y(t)²x′(t) dt と置き換えは同じ。弧長は L = ∫√((x′)² + (y′)²) dt で、これは「速さの積分」だと読めます。", "速さ √((x′)² + (y′)²) は物理の速度ベクトルの大きさそのもの。数学の弧長の要素と物理の速さは同じ量だという接続が、この単元の芯です。"], "example": {"q": "x = cos t、y = sin t（0 ≦ t ≦ π/2）で表される曲線の長さと、t = π/4 における dy/dx を求めよ。", "a": "速さは √((−sin t)² + (cos t)²) = 1 だから、弧長 L = ∫₀^{π/2} 1 dt = π/2（単位円の4分の1周、そのもの）。dy/dx = (cos t)/(−sin t) = −cot t で、t = π/4 では −1（機械確認済み）。"}, "confuse": ["dy/dx を dy/dt のまま答えてしまうミス。必ず dx/dt で割る。", "面積で dx の置き換え（x′(t) dt）を掛け忘れるミス。∫y dx の dx も t の式に替える。"]}, "phys6": {"core": "波動は「経路差（位相差）を波長で測る」単元。干渉・回折は経路差 = mλ の形に揃え、ドップラーは音源と観測者を別々に処理する。", "flow": ["干渉の明線条件は経路差 = mλ（m = 0, 1, 2, …）で強め合い、暗線は (m + 1/2)λ。ヤングの実験の明線間隔は Δx = λL/d で、波長が長い・スクリーンが遠い・スリットが狭いほど広がります。回折格子は d sinθ = mλ で、次数 m には |sinθ| ≦ 1 から決まる上限があります。", "音の現象は式の形が決まっています。うなりの振動数は2つの振動数の差 |f₁ − f₂|。弦や管の固有振動は、両端固定の弦は L = (m/2)λ、開管はその倍音列、閉管は奇数倍のみ、と境界条件で許される波長が決まります。", "ドップラー効果は、音源の動きと観測者の動きを別々に処理するのが芯です。観測者が静止していて音源が近づくなら、聞こえる波長が短くなり f′ = V/(V − v_s)・f。観測者も動く場合は、分子は観測者の動き (V ∓ v_o)、分母は音源の動き (V ∓ v_s) と、分子・分母に分けて符号を決めます。", "すべての土台は波の重ね合わせの原理。合成波は足し算であり、干渉も定常波もこの原理の応用です。"], "example": {"q": "ヤングの実験で、波長 6.0×10⁻⁷ m の光を使い、スリット間隔 3.0×10⁻⁴ m、スクリーンまでの距離 1.5 m とした。明線の間隔を求めよ。", "a": "Δx = λL/d = (6.0×10⁻⁷ × 1.5)/(3.0×10⁻⁴) = 3.0×10⁻³ m = 3.0 mm（機械確認済み）。"}, "confuse": ["ドップラーで音源と観測者の符号を分子・分母で取り違えるミス。分母は音源、分子は観測者と固定してから符号を決める。", "閉管の倍音は奇数倍のみ（1, 3, 5…）。開管・弦と同じ倍音列だと思わないこと。"]}, "math7": {"core": "総合セットは「指数関数 e^{−x} をめぐる部品の合体技」。微分しても形が崩れない性質と、部分積分で次数を下げる操作が両輪。", "flow": ["指数×多項式の関数を見たら、微分すると同型が残ることに注目します。e^{−x} は微分しても形が崩れないので、増減や最大値の計算が多項式の部分だけに集中できます。最大値問題で指数が絡む場合は、対数を取って微分する（対数微分）手もあり、単調性は変わりません。", "積分 ∫x e^{−x} 型は部分積分で多項式の次数を1つ下げます。これを繰り返すと Iₙ の漸化式になり、前の結果を部品にする王道の形です。x → ∞ での競争では指数関数の増大が圧倒的で、xⁿ e^{−x} → 0 は暗記級の事実として使います。", "広義積分の回転体は、有限区間で計算してから端を飛ばすのが手順。収束するなら値が残ります。接線と曲線で囲まれた面積は「接線の式を作る（微分）→ 差を積分する（面積）」という微分と積分の合体技です。", "不等式の証明に微分を使う型も覚えておきます。差を f(x) と置き、増減を調べて最小値が 0 以上であることを示す。「式の証明をグラフの形に翻訳する」のが芯です。"], "example": {"q": "広義積分 ∫₀^∞ x e^{−x} dx の値を求めよ。", "a": "部分積分すると ∫₀^A x e^{−x} dx = [−(x+1)e^{−x}]₀^A = 1 − (A+1)e^{−A}。A → ∞ で (A+1)e^{−A} → 0 だから値は 1。Iₙ の漸化式 Iₙ = n・Iₙ₋₁ と I₀ = 1 から I₁ = 1 とも一致する（機械確認済み）。"}, "confuse": ["x e^{−x} の極限を「x が勝つ」と思うミス。指数の減少（増大）が常に勝ち、xⁿ e^{−x} → 0。", "部分積分の符号、特に e^{−x} を積分すると −e^{−x} になる点のミスが多い。1回ごとに検算する。"]}, "phys7": {"core": "荷電粒子の運動は「電場はエネルギーを変え、磁場は向きだけ変える」の分担。加速は qV、円運動は r = mv/(qB)、周期は速さに依らない。", "flow": ["荷電粒子が電圧 V で加速されたら、qV = (1/2)mv²。エネルギーの保存だけで速さが出ます。加速後のエネルギーは qV をそのまま eV で読み、200 V なら 200 eV です。", "磁場に垂直に入射した荷電粒子は、ローレンツ力が向心力になって円運動をします。半径は r = mv/(qB)、そして周期は速さに依りません。半円を描いて出てくる時間は半周期 πm/(qB) で、半径が要らないのがミソです。", "磁場は仕事をしません。ローレンツ力は速度と常に垂直だから、速さは変わらず向きだけ変わる。この性質が「磁場ではエネルギーが保存する」理由です。", "電場と磁場を直交させて重ねると、qE = qvB の時だけ粒子は直進します（速度選別器、v = E/B が条件）。サイクロトロンは、周期が速さに依らないからこそ、磁場で回しながら電場で少しずつ加速を同期できる装置。質量分析器は、同じ速さでも r が m/q で変わることを使って、軌道で質量を選り分けます。"], "example": {"q": "陽子を 100 V の電圧で加速し、0.10 T の磁場に垂直に入射させた。陽子の速さと円運動の半径を求めよ。（e = 1.60×10⁻¹⁹ C、陽子の質量 1.67×10⁻²⁷ kg）", "a": "加速エネルギーは 100 eV。eV = (1/2)mv² より v = √(2eV/m) ≈ 1.38×10⁵ m/s。半径 r = mv/(eB) ≈ 1.44×10⁻² m（約 1.4 cm）（機械確認済み）。"}, "confuse": ["磁場で「加速される」と思うミス。磁場は向きだけを変え、速さとエネルギーは変えない。エネルギーを変えるのは電場。", "円運動の周期が速さで変わると思うミス。T = 2πm/(qB) で速さに依らない（半径と速さが比例して伸びるため）。"]}, "ab1": {"core": "二次関数は「軸と区間の位置関係」ですべて決まる。平方完成で軸を出し、頂点と両端だけを候補にして比べる。", "flow": ["二次関数の最大・最小は、平方完成で軸 x = a を出すのが第一歩。区間の中に軸があるか外にあるかで場合分けし、候補は軸の頂点と区間の両端だけに絞ります。下に凸（x² の係数が正）なら、軸から遠い端点が最大、軸に近い側（軸が区間内なら頂点）が最小（上に凸なら逆）、と距離の比較に帰着させる見方も同じことです。", "「x² の係数が文字」の問題では、まず係数が 0 の場合（一次関数になる）を別に調べるのが約束事。そのあと 0 でない場合を軸の位置で場合分けします。係数が文字のとき、いきなり平方完成に進まないのが境界です。", "放物線と直線の共有点の個数は、連立してできる二次方程式の判別式 D の符号で決まります。D > 0 で2点、D = 0 で接する、D < 0 で共有点なし。放物線が x 軸と共有点を持つ条件も D = b² − 4ac ≧ 0 と同値で、頂点の y 座標の符号でも読めます。", "ただし判別式は「個数だけ知りたいとき」の道具。実際に解が要るなら因数分解・解の公式で直接解く方が速い場面も多いです。平行移動は頂点の移動だけ追えばよく、y = a(x−p)² + q の p, q がそのまま移動量。二次不等式は、対応する二次関数のグラフの符号（解の内側か外側か）で読みます。"], "example": {"q": "f(x) = x² − 4x + 3 の 0 ≦ x ≦ 5 における最大値と最小値を求めよ。", "a": "平方完成すると f(x) = (x−2)² − 1 で軸は x = 2、区間の中にある。頂点の値 f(2) = −1 が最小値。最大は軸から遠い端 x = 5 で f(5) = 25 − 20 + 3 = 8（もう一端は f(0) = 3）（機械確認済み）。"}, "confuse": ["最大・最小の候補から端点を落とすミス。極値（頂点）だけでは区間の最大は決まらない。", "判別式は個数専用。解そのものが要る問題で D だけ計算して止まらないこと。"]}, "ab2": {"core": "正弦定理と余弦定理の使い分けは「分かっている情報の形」で決まる。対角のペアがあれば正弦、挟まれた角か3辺なら余弦。", "flow": ["三角形で、向かいの辺と角のペアが分かっているときは正弦定理 a/sinA = 2R。辺とその対角は常にペアで使います。外接円の半径 R を聞かれたら a = 2R sinA と読めば、1辺とその対角からすぐ出ます。", "2辺とその間の角が分かっている三角形は、挟まれた角なので余弦定理 a² = b² + c² − 2bc cosA で残りの辺が出ます。3辺の長さだけが分かっているときは、余弦定理を cos について解き直して角を求めます。", "面積は S = (1/2)bc sinA。挟む角の sin が要るので、角が未知なら余弦定理で cos を出してから sin に変換する、という部品のつなぎ方が定番です。内接円の半径 r とは S = (1/2)r(a + b + c) の関係があり、三角形を中心と各辺で3つに分けて面積を足した形だと理解します。", "迷ったときの判断基準はシンプルです。対角のペアがあれば正弦、挟まれた角か3辺なら余弦。空間図形でも、求めたい辺や角を含む平面で切り取り、その三角形に正弦・余弦定理を持ち込めば同じです。"], "example": {"q": "三角形 ABC で b = 3、c = 5、A = 60° のとき、a と面積 S を求めよ。", "a": "2辺と挟む角だから余弦定理：a² = 3² + 5² − 2・3・5・cos60° = 9 + 25 − 15 = 19、a = √19。面積 S = (1/2)・3・5・sin60° = 15√3/4（機械確認済み）。"}, "confuse": ["挟まれていない角で余弦定理の形 a² = b² + c² − 2bc cosA を使うミス。cos の角は、求める辺の対角でなければならない。", "面積に cos を入れてしまうミス。S = (1/2)bc sinA は sin。cos が分かったら sin² + cos² = 1 で変換する。"]}, "ab3": {"core": "確率の型は4つ：「少なくとも」は余事象、条件付きは世界を絞る、反復試行は C(n,k)p^k(1−p)^(n−k)、期待値は分解して足す。", "flow": ["順列 P と組合せ C の見分けは『入れ替えたら別のものになるか』を問うこと。並べる順序に意味があるなら P、選ぶだけなら C です。", "「少なくとも1つ」と来たら余事象に逃げます。1 − (1つもない確率)。直接数えると重なってしまう場面で特に効きます。排反なら確率は単純に足せますが、重なりがあれば P(A∪B) = P(A) + P(B) − P(A∩B) と重なりを引く。独立な試行は確率を掛けますが、独立と排反は別の概念だと区別してください。", "条件付き確率「〜のとき、〜である確率」は、世界を条件の中に絞ってから数えます。P(A|B) = P(A∩B)/P(B) で、分母が B に変わるのが本質です。くじや玉の取り出しで「戻す／戻さない」は試行の構造を決めます。戻せば各回は独立な反復試行、戻さなければ全体が減るのでそのつど条件付きで数え直します。", "反復試行で成功 k 回の確率は C(n,k) p^k (1−p)^(n−k)。「起こる回数の選び方 × 1通りの確率」と読みます。期待値を数え上げで求めるのが重い場面では、各試行の期待値に分解して足す線形性が効きます。分布表を作らずに済むことが多いです。"], "example": {"q": "サイコロを3回投げるとき、1の目がちょうど1回出る確率を求めよ。", "a": "反復試行だから C(3,1) × (1/6) × (5/6)² = 3 × (1/6) × (25/36) = 75/216 = 25/72（機械確認済み）。"}, "confuse": ["独立と排反の混同。排反は「同時には起こらない」、独立は「影響しない」。独立な2つの事象は（確率が正なら）排反にはならない。", "条件付き確率で分母を全体のままにするミス。条件 B が付いたら、世界は B の中に絞られる。"]}, "ab4": {"core": "図形の性質は「比の積が1周して1」と「円の積の一定」が2大エンジン。チェバ・メネラウスと方べきを、図の形で見分ける。", "flow": ["三角形の内部の点から各頂点へ引いた線と辺の比は、チェバの定理：(BP/PC)(CQ/QA)(AR/RB) = 1。辺の比の積が1周して1になります。三角形の辺を直線が切る比の問題はメネラウスの定理で、外分も含めて同じく比の積が1周して1。2つは形が似ていますが、「内部の点で3線が集まる」のがチェバ、「1本の直線が切る」のがメネラウスです。", "円の外の点から2本の線を引いた長さの関係は方べきの定理：PA・PB = PC・PD。外の点から円への積は一定になる、という保存の形です。円に外から引いた接線は、同じ点からの2本の長さが等しく、半径と接線は接点で垂直になります。", "弦については、中心から弦への垂線が弦を2等分するので、三平方の定理で弦の長さに変換できます。接線と弦の作る角は接弦定理で、その角の内部にある弧に対する円周角に等しくなります。", "角の二等分線は対辺を隣り合う2辺の比に内分し（外角なら外分）、円周角と中心角は「同じ弧に対して中心角は円周角の2倍」。まず弧を決めてから角を運ぶのが順序です。"], "example": {"q": "円の外の点 P から円に直線を引き、円と A、B で交わる。PA = 3、PB = 12 のとき、P から引いたもう1本の直線が円と C、D で交わり PC = 4 なら、PD を求めよ。", "a": "方べきの定理より PA・PB = PC・PD だから 3・12 = 4・PD、PD = 9（機械確認済み）。"}, "confuse": ["チェバとメネラウスの混同。3線が内部の1点に集まるならチェバ、1直線が三角形を横切るならメネラウス。", "方べきで「外の点からの距離」を掛ける相手を取り違えるミス。積は（外の点から近い交点）×（外の点から遠い交点）。"]}, "ab5": {"core": "三角関数も指数対数も「形を1つに揃える」が芯。合成で1つの sin に、置換で二次式に、底の変換で1つの底に。", "flow": ["a sinθ + b cosθ の形を見たら、三角関数の合成で R sin(θ + α) の1つにまとめます。最大・最小は ±R（R = √(a² + b²)）。sin²θ や cos2θ が混ざる方程式は、倍角・半角で次数を下げるか、sin²θ + cos²θ = 1 で1種類の三角関数に統一します。", "sinθ + cosθ = t と置くと sinθcosθ = (t² − 1)/2 が付いてきて、対称な式が二次方程式に化けます。ただし置換と同時に範囲もセットで書くのが約束。t = sinθ + cosθ なら −√2 ≦ t ≦ √2 です。", "指数方程式で底がバラバラなら、底を揃えるか、a^x = t と置いて二次式化します。指数関数は単調だから、指数同士の比較に帰着できます。対数の大小比較は、底が1より大きいか小さいかで不等号の向きが決まるので、まず真数条件（真数 > 0）を押さえてから比べます。", "底が違う対数をまとめたいときは、底の変換公式 log_a b = log_c b / log_c a で底を1つに統一。数の桁数は 10^k ≦ N < 10^{k+1} の形に挟み、log₁₀N の整数部分が（桁数 − 1）に対応します。"], "example": {"q": "√3 sinθ + cosθ の最大値を求めよ。", "a": "合成すると √3 sinθ + cosθ = 2 sin(θ + π/6)（R = √(3 + 1) = 2）。最大値は 2 で、θ + π/6 = π/2、つまり θ = π/3 のとき取る（機械確認済み）。"}, "confuse": ["置換した変数の範囲を書き忘れるミス。t の範囲外の解は元の θ に対応しないので、必ずセットで書く。", "対数の真数条件を忘れて大小比較に進むミス。底が 0 と 1 の間だと不等号が逆になる点もセットで確認する。"]}, "ab6": {"core": "円と直線は「距離 d と半径 r の比較」に翻訳する。軌跡は条件をそのまま式にし、接する条件は「値と微分係数が一致」の2条件。", "flow": ["円と直線の位置関係は、中心と直線の距離 d と半径 r の比較で決まります。d < r で2点共有、d = r で接する、d > r で共有点なし。連立した判別式でも同じ判定になりますが、距離で見る方が速い場面が多いです。直線が円と接する条件をパラメータで聞かれたら、距離 = 半径の1本の式に帰着させます。", "円 x² + y² = r² 上の点 (x₁, y₁) での接線は x₁x + y₁y = r²。中心からの距離 = 半径でも作れますが、この形は暗記級です。", "軌跡は、点を (x, y) と置いて条件をそのまま式にして整理するのが基本動作。最後に、除くべき点がないか確認するまでがセットです。2点からの距離の比が一定という条件は、比が1でないなら軌跡は円（アポロニウスの円）になり、距離の二乗で式を立てて平方完成します。", "微分積分との接続も押さえます。3次関数が極値を持つかどうかは f′ = 0 の判別式が正かどうか。2曲線が接する条件は、接する点で関数の値と微分係数が一致する2条件 f(a) = g(a) かつ f′(a) = g′(a)。放物線と直線で囲まれた面積の 1/6 公式は、差が2次式になる組の時だけ使えます。"], "example": {"q": "円 x² + y² = 25 上の点 (3, 4) における接線の方程式を求めよ。", "a": "接線は 3x + 4y = 25。検算：原点とこの直線の距離は |−25|/√(3² + 4²) = 25/5 = 5 で、半径に一致する（機械確認済み）。"}, "confuse": ["軌跡で「除くべき点」の確認を省くミス。分母や比の条件で除外される点が紛れることがある。", "2曲線が「接する」を f(a) = g(a) の1条件だけで済ませるミス。傾きの一致 f′(a) = g′(a) も必要。"]}, "ab7": {"core": "数列は「型の判定 → 型ごとの道具」の2段構え。差と比で型を見分け、漸化式は特性方程式で等比に直す。", "flow": ["数列を見たら、まず隣との差と比の両方を試します。差が一定なら等差、比が一定なら等比。等比数列の和は Sₙ = a(rⁿ − 1)/(r − 1)（r ≠ 1）で、r = 1 のときは Sₙ = na と別扱いにします。", "漸化式 aₙ₊₁ = paₙ + q の形は、特性方程式 α = pα + q で α を出し、aₙ − α を等比数列に変形するのが王道。分数型 aₙ₊₁ = aₙ/(paₙ + q) は、逆数を取ると等差型に化けることが多いです。もとの数列の差 bₙ が簡単な数列になる場面では階差数列を使い、aₙ = a₁ + Σbₖ の形で戻ります。", "和の公式 Σk = n(n+1)/2、Σk² = n(n+1)(2n+1)/6 は、(k+1)³ − k³ の差分の相殺で導けることも含めて理解しておくと安心です。和 Sₙ から一般項を求めるには aₙ = Sₙ − Sₙ₋₁（n ≧ 2）で、n = 1 のときは S₁ と一致するか別に確認します。", "群数列は二段構え。まず『第 m 群の末項は全体の第何項か』を確定させてから、その群の中での位置を数えます。いきなり群の中を数え始めないのが順序です。"], "example": {"q": "a₁ = 1、aₙ₊₁ = 2aₙ + 1 で定まる数列の一般項と a₅ を求めよ。", "a": "特性方程式 α = 2α + 1 より α = −1。aₙ₊₁ + 1 = 2(aₙ + 1) だから aₙ + 1 は初項 2、公比 2 の等比数列で、aₙ = 2ⁿ − 1。a₅ = 31（機械確認済み）。"}, "confuse": ["等比数列の和で r = 1 の場合を公式にそのまま入れてしまうミス（分母が 0 になる）。r = 1 は別扱い。", "aₙ = Sₙ − Sₙ₋₁ を n = 1 にも使ってしまうミス。n = 1 は S₁ で別に確認する。"]}, "ab8": {"core": "統計的推測は「線形性と分散の公式で分布表を回避する」単元。二項分布は E = np、V = np(1−p)、標本平均の分散は σ²/n。", "flow": ["期待値の計算で分布表が大きいときは、期待値の線形性 E(aX + b) = aE(X) + b、E(X + Y) = E(X) + E(Y) を使います。和の線形性は独立でなくても成り立つのが強い点です。", "分散の計算は V(X) = E(X²) − {E(X)}² が速い形。変量を a 倍して b を足すと V(aX + b) = a²V(X)。b は散らばりに効かず、a は二乗で効きます。標準偏差は |a| 倍です。", "二項分布 B(n, p) は「成功確率 p の試行の n 個分」と読めば、E = np、V = np(1−p) が自然に出ます。np と np(1−p) が十分大きいときは、正規分布 N(np, np(1−p)) で近似できます。", "標本平均 X̄ の期待値は μ、分散は σ²/n、標準偏差は σ/√n。n が大きいほど平均は μ の近くに集まります。母平均の信頼区間は X̄ ± z・(σ/√n) の形で、95% なら z = 1.96。区間の幅は √n に反比例するので、幅を半分にしたければ n を4倍にします。精度と標本数の交換関係です。"], "example": {"q": "成功確率 0.5 の試行を 100 回行うとき、成功回数 X の期待値・分散・標準偏差を求めよ。", "a": "X は B(100, 0.5) に従うから、E(X) = np = 50、V(X) = np(1−p) = 100・0.5・0.5 = 25、標準偏差は √25 = 5（機械確認済み）。"}, "confuse": ["V(aX + b) で b まで分散に効くと思うミス。b（平行移動）は散らばりを変えず、効くのは a² だけ。", "標本平均の分散を σ² のままにするミス。平均を取ると分散は σ²/n に縮む。"]}, "ab9": {"core": "数と式・命題は「境界で場合分け」と「言い換え」の単元。絶対値は中身の符号、命題は対偶、条件は矢印の向きで判定する。", "flow": ["絶対値を含む方程式・不等式は、中身の符号が変わる点を境界にして場合分けし、絶対値を外します。各区間で、出た解がその区間に合うかも確認するまでがセットです。", "命題の真偽を直接示しにくい場面では対偶に替えます。『p ⇒ q』と『q̄ ⇒ p̄』の真偽は一致するからです。結論を否定して仮定し矛盾を1つ導く背理法は、『無理数である』『無限に存在する』の証明の型。「必要条件か十分条件か」は矢印の向きで判定し、p ⇒ q が真なら p は十分条件、q は必要条件。偽なら反例を1つ挙げれば終わりです。", "『すべての』『ある』を含む命題の否定では、全称と存在が入れ替わります。「すべて〜でない」の否定は「ある〜である」。集合の要素の個数は n(A∪B) = n(A) + n(B) − n(A∩B) で、重なりを1回引き、ベン図で確認します。", "式の計算では、因数分解でたすき掛けが決まらないときは、次数の低い文字について整理してから共通因数と公式を探します。対称式（x + y と xy）が見えたら、x² + y² = (x + y)² − 2xy のように基本対称式だけで表すのが方針です。"], "example": {"q": "方程式 |x − 1| + |x + 2| = 5 を解け。", "a": "境界は x = −2 と x = 1。x ≧ 1 では (x−1) + (x+2) = 2x + 1 = 5 より x = 2（区間内、適する）。−2 ≦ x < 1 では 1 − x + x + 2 = 3 で 5 にならず解なし。x < −2 では −(x−1) − (x+2) = −2x − 1 = 5 より x = −3（区間内、適する）。解は x = 2, −3（機械確認済み）。"}, "confuse": ["必要条件と十分条件の取り違え。矢印の出発点（p）が十分条件、到着点（q）が必要条件。", "場合分けで出した解が、その区間に属しているかの確認を省くミス。区間外の解は捨てる。"]}, "ab10": {"core": "データの分析は「中心と散らばりを、変換に強い形で読む」単元。平均・分散は速算法と変量変換の規則で処理する。", "flow": ["四分位数はデータを4等分する境界で、四分位範囲 = 第3四分位数 − 第1四分位数が中央付近の散らばりを表します。箱ひげ図はこの5つの数（最小・Q1・中央値・Q3・最大）の図です。", "外れ値の影響を受けにくい代表値が要るなら、中心は中央値、散らばりは四分位範囲。平均は外れ値に引っ張られます。代表値の「頑丈さ」で選ぶのがこの単元の判断です。", "分散と標準偏差の関係は、標準偏差は分散の平方根。分散は単位が二乗になるので、元の単位に戻すのが標準偏差です。分散の計算は（定義式より）分散 = (二乗の平均) − (平均の二乗) が速い形です。", "変量変換 x → ax + b では、平均も同じ変換を受けて a・x̄ + b になります。全データに同じ操作をするから中心は一緒に動く。一方、分散は a² 倍（b は無関係）、標準偏差は |a| 倍で、平行移動は散らばりを変えません。散布図と相関係数は、右上がりなら正、右下がりなら負、−1 から 1 の間で直線関係の強さだけを見ます。相関係数が高いことと因果関係があることは別で、因果には別の根拠が要ります。"], "example": {"q": "データ 2, 4, 4, 6, 9 について、平均・分散・中央値・四分位範囲を求めよ。", "a": "平均は (2+4+4+6+9)/5 = 5。分散は (二乗の平均) − (平均の二乗) = (4+16+16+36+81)/5 − 25 = 30.6 − 25 = 5.6。中央値は 4。下半分 2, 4 の中央値が Q1 = 3、上半分 6, 9 の中央値が Q3 = 7.5 だから、四分位範囲は 7.5 − 3 = 4.5（教科書方式で機械確認済み）。"}, "confuse": ["変量変換で分散に b まで効かせるミス。散らばりを変えるのは a だけで、分散は a² 倍。", "相関が高い＝因果がある、と言ってしまうミス。相関は直線的な連動の強さだけを表す。"]}, "ab11": {"core": "式と証明・方程式は「係数比較と代入で済ませる」単元。恒等式は係数を並べ、余りは代入し、対称式は解と係数の関係で処理する。", "flow": ["恒等式の係数を決めたいときは係数比較法。同じ次数の係数を並べて連立します。数値代入法でも同じ答えになるはずで、検算に使えます。分数式の恒等式（部分分数分解）は、両辺に分母を掛けて普通の恒等式に直してから同じ処理です。", "剰余の定理：P(x) を x − a で割った余りは P(a)。割る式が1次なら代入だけで余りが出ます。因数定理はその裏返しで、P(a) = 0 になる a を探せば (x − a) が因数になる。a の候補は定数項の約数から探します。高次方程式の重解は (x − a)² のような因数の形に現れるので、因数分解して各因数の次数を数えます。", "解と係数の関係は、ax² + bx + c = 0 の2解 α, β で α + β = −b/a、αβ = c/a。解を出さずに対称式を計算できるのが強みです。2次方程式の虚数解が1つ分かれば、実数係数なら共役なペアで現れるので、もう1つの解も自動的に分かります。", "相加平均・相乗平均は a + b ≧ 2√(ab)（a, b > 0）。使うときは等号が成り立つ条件（a = b）の確認までがセットです。"], "example": {"q": "P(x) = x³ − 3x + 2 を因数分解し、P(x) を x − 1 で割った余りを求めよ。", "a": "P(1) = 1 − 3 + 2 = 0 だから、剰余の定理より余りは 0 で、因数定理より (x − 1) が因数。実際に割り算すると P(x) = (x − 1)(x² + x − 2) = (x − 1)²(x + 2)。根は 1（重解）と −2（機械確認済み）。"}, "confuse": ["解と係数の関係の符号ミス。α + β = −b/a（マイナスが付く）、αβ = c/a（付かない）。", "相加相乗で等号条件の確認を省くミス。最小値を主張するには a = b が実現できることまで示す。"]}, "ab12": {"core": "ベクトルは「図形の条件を内積と成分に翻訳する」単元。垂直は内積 0、角は cos の式、面積は成分のたすき掛け。", "flow": ["ベクトルの大きさは |a| = √(a₁² + a₂²)、成分の二乗和の平方根で、三平方の定理そのものです。計算の前に始点を揃えるのが約束事で、全部を O 始点に直し、AB = b − a の引き算に統一してから計算します。", "2つのベクトルが垂直と言われたら内積が 0：a・b = 0。垂直という図形の条件は内積に翻訳します。なす角は cosθ = (a・b)/(|a||b|) で、内積を大きさで割ったもの。", "内分点の位置ベクトルは、AB を m : n に内分する点が (n・a + m・b)/(m + n)。近い方の点の重みが大きくなる逆比なのがポイントです。3点が同じ直線上にある条件は、AP が AB の実数倍で表せること。位置ベクトルの係数の和が1になる形も使います。", "ベクトル方程式で図形を表すと、|p − a| = r は中心 a・半径 r の円、(p − a)・(p − b) = 0 は AB を直径とする円。三角形 OAB の面積は (1/2)|a₁b₂ − a₂b₁| で、成分のたすき掛けの差で出ます。"], "example": {"q": "a = (1, 2)、b = (3, −1) について、内積 a・b、なす角 θ の cosθ、三角形 OAB の面積を求めよ。", "a": "a・b = 1・3 + 2・(−1) = 1。|a| = √5、|b| = √10 だから cosθ = 1/(√5・√10) = 1/√50 = √2/10。面積は (1/2)|1・(−1) − 2・3| = (1/2)・7 = 7/2（機械確認済み）。"}, "confuse": ["内分点の重みの付け方を逆にするミス。(n・a + m・b)/(m + n) と、比と反対側の点に重みが付く。", "(p − a)・(p − b) = 0 の図形を取り違えるミス。角 APB が直角、つまり AB を直径とする円（タレス）。"]}};

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderList() {
  const el = document.getElementById('setList');
  let html = '';
  let lastGroup = null;
  for (const s of SETS) {
    if (s.group !== lastGroup) {
      html += '<div class="group-title">' + esc(s.group) + '</div>';
      lastGroup = s.group;
    }
    html += '<button class="set-item" onclick="openNote(\'' + s.key + '\')">'
      + '<span class="s-theme">' + esc(s.theme) + '</span>'
      + '<span class="s-meta">カード ' + s.count + ' 枚分</span></button>';
  }
  el.innerHTML = html;
}

function openNote(key) {
  const s = SETS.find(v => v.key === key);
  const n = NOTES[key];
  if (!s || !n) return;
  document.getElementById('nGroup').textContent = s.group;
  document.getElementById('nTheme').textContent = s.theme;
  document.getElementById('nCore').textContent = n.core;
  document.getElementById('nFlow').innerHTML = n.flow.map(p => '<p>' + esc(p) + '</p>').join('');
  const wrap = document.getElementById('nExampleWrap');
  if (n.example) {
    wrap.style.display = '';
    document.getElementById('nExQ').textContent = n.example.q;
    document.getElementById('nExA').textContent = n.example.a;
  } else {
    wrap.style.display = 'none';
  }
  document.getElementById('nConfuse').innerHTML = n.confuse.map(c => '<li>' + esc(c) + '</li>').join('');
  document.getElementById('listView').style.display = 'none';
  document.getElementById('noteView').style.display = '';
  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById('noteView').style.display = 'none';
  document.getElementById('listView').style.display = '';
  window.scrollTo(0, 0);
}

renderList();
</script>
</body>
</html>
