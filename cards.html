<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>解法カード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #ffffff; color: #1e293b; line-height: 1.7;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; padding: 18px 0 8px; }
  header h1 { font-size: 26px; font-weight: 700; color: #0369a1; letter-spacing: .04em; }
  header p { font-size: 13px; color: #64748b; margin-top: 4px; }
  .card-panel {
    background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 16px;
    padding: 20px; margin-top: 18px;
  }
  .seg { display: flex; gap: 8px; justify-content: center; margin: 6px 0 16px; flex-wrap: wrap; }
  .seg label {
    padding: 8px 18px; border-radius: 999px; border: 1px solid #7dd3fc;
    background: #fff; color: #0369a1; font-size: 14px; cursor: pointer; user-select: none;
  }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: #0284c7; border-color: #0284c7; color: #fff; font-weight: 600; }
  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: #0284c7; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: #0369a1; }
  .btn:disabled { background: #cbd5e1; cursor: default; }
  .btn.sub { background: #fff; color: #0284c7; border: 1px solid #7dd3fc; margin-top: 10px; }
  .btn.sub:hover { background: #e0f2fe; }
  .stats { text-align: center; font-size: 13px; color: #64748b; margin-top: 14px; }
  .muted { color: #64748b; font-size: 14px; text-align: center; padding: 12px; }

  /* クイズ */
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 15px; color: #0369a1; font-weight: 600; }
  .timer.over { color: #dc2626; }
  .qcount { font-size: 13px; color: #64748b; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 12px 0 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e2e8f0; }
  .dot.done { background: #38bdf8; }
  .dot.now { background: #0284c7; transform: scale(1.25); }
  .qmeta { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #e0f2fe; color: #0369a1;
  }
  .chip-blue { background: #dbeafe; color: #1d4ed8; }
  .chip-weak { background: #fee2e2; color: #b91c1c; }
  .qface {
    font-size: 19px; font-weight: 600; background: #fff; border: 1px solid #e0f2fe;
    border-left: 5px solid #0284c7; border-radius: 12px; padding: 18px; margin: 8px 0 16px;
  }
  .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .options { grid-template-columns: 1fr 1fr; } }
  .opt {
    position: relative; text-align: left; padding: 14px 16px; font-size: 15px; line-height: 1.55;
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; color: #1e293b;
  }
  .opt:hover { border-color: #7dd3fc; }
  .opt.sel { border-color: #0284c7; background: #e0f2fe; }
  .opt.hit { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrongpick { border-color: #dc2626; background: #fef2f2; }
  .opt.missed { border-color: #16a34a; border-style: dashed; background: #fff; }
  .opt .tag {
    position: absolute; top: -9px; right: 10px; font-size: 11px; font-weight: 700;
    background: #16a34a; color: #fff; padding: 1px 8px; border-radius: 999px;
  }
  .actions { margin-top: 18px; }
  .feedback { border-radius: 12px; padding: 16px 18px; margin-top: 18px; font-size: 15px; }
  .feedback.ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .feedback.ng { background: #fff7ed; border: 1px solid #fed7aa; }
  .fb-back { margin-top: 8px; }
  .fb-core { margin-top: 8px; color: #0369a1; font-size: 14px; }
  .fb-list { margin-top: 8px; font-size: 13px; color: #475569; }

  /* 結果 */
  .result-score { font-size: 32px; font-weight: 700; color: #0369a1; text-align: center; margin-top: 10px; }
  .result-time { text-align: center; color: #64748b; font-size: 14px; margin-top: 4px; }
  .missed-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .m-face { font-weight: 600; font-size: 15px; }
  .m-back { font-size: 14px; color: #475569; margin-top: 4px; }
  #resultView h3, #missedList h3 { font-size: 15px; color: #334155; margin-top: 20px; }

  /* 一覧 */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  .filters select {
    padding: 9px 10px; border: 1px solid #7dd3fc; border-radius: 10px; background: #fff;
    color: #0369a1; font-size: 14px;
  }
  .filters label { font-size: 14px; color: #334155; display: flex; gap: 5px; align-items: center; }
  .list-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .list-grid { grid-template-columns: 1fr 1fr; } }
  .lcard { border: 1px solid #e0f2fe; border-radius: 12px; padding: 14px 16px; cursor: pointer; background: #fff; }
  .lcard:hover { border-color: #7dd3fc; }
  .l-meta { font-size: 12px; color: #0284c7; margin-bottom: 6px; }
  .l-face { font-weight: 600; font-size: 15px; }
  .l-back { margin-top: 10px; font-size: 14px; color: #334155; border-top: 1px dashed #bae6fd; padding-top: 10px; }
  .l-core { color: #0284c7; font-size: 13px; margin-top: 4px; }
  .l-hint { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  .back-link { display: inline-block; margin-top: 14px; color: #0284c7; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>解法カード</h1>
    <p>状況を見て、使う解法カードを選ぶ練習</p>
  </header>

  <!-- ホーム -->
  <div id="homeView">
    <div class="card-panel">
      <div class="seg" role="radiogroup" aria-label="科目">
        <label><input type="radio" name="subj" value="all" checked>全部</label>
        <label><input type="radio" name="subj" value="m3">数学（III・C）</label>
        <label><input type="radio" name="subj" value="mab">数学（I・A・II・B・C）</label>
        <label><input type="radio" name="subj" value="phys">物理</label>
      </div>
      <button class="btn" onclick="startSession()">5分モードをはじめる（10問）</button>
      <button class="btn sub" onclick="showList()">カード一覧を見る</button>
      <a class="btn sub" href="notes.html" style="text-align:center;text-decoration:none;">講義ノートを読む</a>
      <a class="btn sub" href="steps.html" style="text-align:center;text-decoration:none;">ステップ演習をする</a>
      <div class="stats" id="homeStats"></div>
    </div>
  </div>

  <!-- クイズ -->
  <div id="quizView" style="display:none">
    <div class="quiz-top">
      <span class="qcount" id="qCount"></span>
      <span class="timer" id="timer">0:00 / 5:00</span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="qmeta" id="qMeta"></div>
    <div class="qface" id="qFace"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" style="display:none"></div>
    <div class="actions">
      <button class="btn" id="gradeBtn" onclick="grade()" disabled>決定</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none">次の問題へ</button>
      <button class="back-link" onclick="quitToHome()">やめてホームへ戻る</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="resultView" style="display:none">
    <div class="result-score" id="resultScore"></div>
    <div class="result-time" id="resultTime"></div>
    <div id="missedList"></div>
    <div class="actions">
      <button class="btn" onclick="quitToHome()">ホームへ戻る</button>
      <button class="btn sub" onclick="showList()">カード一覧を見る</button>
    </div>
  </div>

  <!-- 一覧 -->
  <div id="listView" style="display:none">
    <button class="back-link" onclick="quitToHome()">← ホームへ戻る</button>
    <div class="filters">
      <select id="fSubj" onchange="renderList()">
        <option value="all">科目：すべて</option>
        <option value="m3">数学（III・C）</option>
        <option value="mab">数学（I・A・II・B・C）</option>
        <option value="phys">物理</option>
      </select>
      <select id="fTheme" onchange="renderList()"></select>
      <select id="fCore" onchange="renderList()"></select>
      <label><input type="checkbox" id="fWeak" onchange="renderList()"> 苦手のみ</label>
      <span class="qcount" id="listCount"></span>
    </div>
    <div class="list-grid" id="listGrid"></div>
  </div>
</div>
<script>
"use strict";
const CARDS = [{"id":"math1-1","subj":"math","day":1,"theme":"微分の応用","face":"3次関数で「増減を調べよ」と来た","back":"まず微分して f′(x)=0 の x を出す。そこが山と谷の位置","core":"図と式を行き来する","label":"まず微分して f′(x)=0 の x を出す"},{"id":"math1-2","subj":"math","day":1,"theme":"微分の応用","face":"方程式 f(x)=k の「実数解の個数を調べよ」","back":"y=k の水平線とグラフの交点の数に翻訳する。境界は極大値・極小値","core":"図と式を行き来する","label":"y=k の水平線とグラフの交点の数に翻訳する"},{"id":"math1-3","subj":"math","day":1,"theme":"微分の応用","face":"「曲線外の点を通る接線」を求めたい","back":"接点を (t, f(t)) と置いてから接線を作り、通る点の条件を t の方程式にする","core":"前の結果を部品にする","label":"接点を (t, f(t)) と置いてから接線を作り…"},{"id":"math1-4","subj":"math","day":1,"theme":"微分の応用","face":"閉区間の最大・最小を聞かれた","back":"候補は「極値点と両端」だけ。全部代入して比べる","core":"境界で分ける","label":"候補は「極値点と両端」だけ"},{"id":"math1-5","subj":"math","day":1,"theme":"微分の応用","face":"パラメータで解の個数が変わる問題","back":"場合分けの境界は必ず極値。極値を先に固定してから a を動かす","core":"境界で分ける","label":"場合分けの境界は必ず極値"},{"id":"math1-6","subj":"math","day":1,"theme":"微分の応用","face":"接線の傾きが知りたい場面","back":"傾きはその点での微分係数 f′(a)。図の傾きと式が一致する","core":"図と式を行き来する","label":"傾きはその点での微分係数 f′(a)"},{"id":"math1-7","subj":"math","day":1,"theme":"微分の応用","face":"「異なる3つの実数解」と書いてある","back":"極大値>k>極小値 の形に持ち込む合図。符号の積 (極大−k)(極小−k)<0 でも可","core":"図と式を行き来する","label":"極大値>k>極小値 の形に持ち込む合図"},{"id":"math1-8","subj":"math","day":1,"theme":"微分の応用","face":"増減表を書くのが面倒な場面","back":"f′ の符号だけ分かればよい。f′ を因数分解して符号を区間ごとに読む","core":"形を揃える","label":"f′ の符号だけ分かればよい"},{"id":"phys1-1","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「なめらかな水平面で衝突」と書いてある","back":"衝突の前後で運動量保存。外力の力積が無視できる一瞬の出来事として切り取る","core":"保存する量を探す","label":"衝突の前後で運動量保存"},{"id":"phys1-2","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「なめらかな斜面をのぼる／滑り降りる」","back":"力学的エネルギー保存。高さと速さを交換する","core":"保存する量を探す","label":"力学的エネルギー保存"},{"id":"phys1-3","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「完全弾性衝突（弾性衝突）」と明記","back":"運動量保存＋力学的エネルギー保存の2本立て。反発係数 e=1 でも同じ","core":"保存する量を探す","label":"運動量保存＋力学的エネルギー保存の2本立て"},{"id":"phys1-4","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「合体した」「くっついて一緒に動く」","back":"完全非弾性。運動量だけが保存し、エネルギーは減る。減った分は熱や変形に","core":"切り替わる瞬間で区切る","label":"完全非弾性"},{"id":"phys1-5","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"粗い面で摩擦がある区間","back":"エネルギー保存は使えない。摩擦の仕事 = −(摩擦力)×(距離) を差し引く","core":"保存する量を探す","label":"エネルギー保存は使えない"},{"id":"phys1-6","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"ばねが絡む運動","back":"弾性エネルギーを含めた力学的エネルギー保存。自然長の位置を基準に","core":"保存する量を探す","label":"弾性エネルギーを含めた力学的エネルギー保存"},{"id":"phys1-7","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"衝突の「直前・直後」だけを聞かれる","back":"その一瞬だけを切り取って運動量保存。他の区間と混ぜない","core":"切り替わる瞬間で区切る","label":"その一瞬だけを切り取って運動量保存"},{"id":"phys1-8","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"2物体が糸や棒でつながっている","back":"一体として運動量やエネルギーを考える。内力は相殺する","core":"保存する量を探す","label":"一体として運動量やエネルギーを考える"},{"id":"math2-1","subj":"math","day":2,"theme":"積分と面積","face":"2曲線で囲まれた面積を求めたい","back":"交点を求めて、その間で (上の式)−(下の式) を積分する","core":"境界で分ける","label":"交点を求めて、その間で (上の式)−(下の式) を積…"},{"id":"math2-2","subj":"math","day":2,"theme":"積分と面積","face":"x軸と曲線で囲まれた面積で、曲線が下に潜る区間がある","back":"符号をそのまま積分しない。区間を割って絶対値を取る","core":"境界で分ける","label":"符号をそのまま積分しない"},{"id":"math2-3","subj":"math","day":2,"theme":"積分と面積","face":"面積の公式 1/6 公式が使える場面","back":"放物線と直線で囲まれ、交点の x が α, β の時だけ。面積=|a|(β−α)³/6（a は2つの式の差の x² の係数）","core":"形を揃える","label":"放物線と直線で囲まれ、交点の x が α, β の時…"},{"id":"math2-4","subj":"math","day":2,"theme":"積分と面積","face":"パラメータ入りの面積が○○に等しい、と来た","back":"面積をパラメータの式で表してから方程式を解く。面積は単調なことが多い","core":"前の結果を部品にする","label":"面積をパラメータの式で表してから方程式を解く"},{"id":"math2-5","subj":"math","day":2,"theme":"積分と面積","face":"y を x の関数で表しにくい曲線の面積","back":"x を y の関数として横に積分する（右−左）","core":"図と式を行き来する","label":"x を y の関数として横に積分する（右−左）"},{"id":"math2-6","subj":"math","day":2,"theme":"積分と面積","face":"偶関数・奇関数が対称な区間に出たら","back":"偶関数は半区間の2倍、奇関数は打ち消して 0。計算を半分にする","core":"形を揃える","label":"偶関数は半区間の2倍、奇関数は打ち消して 0"},{"id":"math2-7","subj":"math","day":2,"theme":"積分と面積","face":"面積が最小になる直線の傾きなどを聞かれた","back":"面積を傾きの関数として表し、微分して最小を探す。積分と微分の融合","core":"前の結果を部品にする","label":"面積を傾きの関数として表し、微分して最小を探す"},{"id":"math2-8","subj":"math","day":2,"theme":"積分と面積","face":"回転体の体積の前に面積が要る構成","back":"まず平面図形として面積を確定させてから回転させる。二段構え","core":"切って積む","label":"まず平面図形として面積を確定させてから回転させる"},{"id":"phys2-1","subj":"phys","day":2,"theme":"円運動と単振動","face":"等速円運動で力を聞かれた","back":"向心力 = m v²/r、向きは常に中心。新しい力ではなく合力の名前","core":"図と式を行き来する","label":"向心力 = m v²/r、向きは常に中心"},{"id":"phys2-2","subj":"phys","day":2,"theme":"円運動と単振動","face":"円運動の周期を聞かれた","back":"T=2πr/v。1周の距離 ÷ 速さ、で意味から作れる","core":"形を揃える","label":"T=2πr/v"},{"id":"phys2-3","subj":"phys","day":2,"theme":"円運動と単振動","face":"単振動の周期を聞かれた","back":"T=2π√(m/k)（ばね）または 2π√(l/g)（単振り子）。振幅には依存しない","core":"形を揃える","label":"T=2π√(m/k)（ばね）または 2π√(l/g)…"},{"id":"phys2-4","subj":"phys","day":2,"theme":"円運動と単振動","face":"単振動の最大速度・最大加速度","back":"v_max=Aω、a_max=Aω²。速さは中心で最大、加速度は端で最大","core":"境界で分ける","label":"v_max=Aω、a_max=Aω²"},{"id":"phys2-5","subj":"phys","day":2,"theme":"円運動と単振動","face":"鉛直ばねの単振動","back":"周期は水平ばねと同じ。つり合いの位置が中心になるだけ","core":"切り替わる瞬間で区切る","label":"周期は水平ばねと同じ"},{"id":"phys2-6","subj":"phys","day":2,"theme":"円運動と単振動","face":"円運動する物体の影の運動","back":"影は単振動。A=半径、ω は円運動の角速度と一致","core":"図と式を行き来する","label":"影は単振動"},{"id":"phys2-7","subj":"phys","day":2,"theme":"円運動と単振動","face":"糸がたるむ／面を離れる瞬間","back":"垂直抗力や張力が 0 になる条件で式を立てる。境界の瞬間が答えを決める","core":"切り替わる瞬間で区切る","label":"垂直抗力や張力が 0 になる条件で式を立てる"},{"id":"phys2-8","subj":"phys","day":2,"theme":"円運動と単振動","face":"単振動のエネルギーを聞かれた","back":"(1/2)kA² が全体で一定。位置エネルギーと運動エネルギーが交換する","core":"保存する量を探す","label":"(1/2)kA² が全体で一定"},{"id":"math3-1","subj":"math","day":3,"theme":"積分と体積","face":"回転体の体積を求めたい","back":"回転軸に垂直に切る。断面は円だから断面積は π×(半径)²、あとは積分","core":"切って積む","label":"回転軸に垂直に切る"},{"id":"math3-2","subj":"math","day":3,"theme":"積分と体積","face":"x軸の周りの回転","back":"半径は y そのもの。V=π∫y² dx","core":"切って積む","label":"半径は y そのもの"},{"id":"math3-3","subj":"math","day":3,"theme":"積分と体積","face":"y軸の周りの回転で詰まった","back":"方法は2つ：x を y で表して横向きの円盤にするか、円筒の殻を積む（バウムクーヘン）","core":"図と式を行き来する","label":"方法は2つ：x を y で表して横向きの円盤にするか…"},{"id":"math3-4","subj":"math","day":3,"theme":"積分と体積","face":"2曲線の間の領域を回転させる","back":"断面はドーナツ型（ワッシャー）。π×(外半径²−内半径²)","core":"切って積む","label":"断面はドーナツ型（ワッシャー）"},{"id":"math3-5","subj":"math","day":3,"theme":"積分と体積","face":"回転しない立体の体積（断面が正方形など）","back":"断面積 S(x) をそのまま ∫S(x)dx。回転でなくても同じ考え方","core":"切って積む","label":"断面積 S(x) をそのまま ∫S(x)dx"},{"id":"math3-6","subj":"math","day":3,"theme":"積分と体積","face":"直線 y=1 など軸がずれた回転","back":"半径は「軸からの距離」で測る。1−x² のように引き算で作る","core":"境界で分ける","label":"半径は「軸からの距離」で測る"},{"id":"math3-7","subj":"math","day":3,"theme":"積分と体積","face":"体積が π を含むか迷った","back":"回転体なら断面が円なので π が出る。断面が多角形なら π は出ない","core":"形を揃える","label":"回転体なら断面が円なので π が出る"},{"id":"math3-8","subj":"math","day":3,"theme":"積分と体積","face":"広義積分（無限まで回転）","back":"まず有限で積分してから極限を取る。体積が有限に収まることがある","core":"前の結果を部品にする","label":"まず有限で積分してから極限を取る"},{"id":"phys3-1","subj":"phys","day":3,"theme":"熱力学","face":"p−V グラフで仕事を聞かれた","back":"仕事はグラフと V 軸の間の面積。膨張なら＋、圧縮なら−","core":"グラフの面積と傾きを読む","label":"仕事はグラフと V 軸の間の面積"},{"id":"phys3-2","subj":"phys","day":3,"theme":"熱力学","face":"定積変化（V 一定）が出たら","back":"仕事は 0。内部エネルギーの変化がそのまま熱になる","core":"グラフの面積と傾きを読む","label":"仕事は 0"},{"id":"phys3-3","subj":"phys","day":3,"theme":"熱力学","face":"定圧変化の仕事","back":"W=pΔV。長方形の面積として読める","core":"グラフの面積と傾きを読む","label":"W=pΔV"},{"id":"phys3-4","subj":"phys","day":3,"theme":"熱力学","face":"サイクル（1周して戻る過程）","back":"正味の仕事はサイクルが囲む面積。時計回りなら正の仕事をする","core":"グラフの面積と傾きを読む","label":"正味の仕事はサイクルが囲む面積"},{"id":"phys3-5","subj":"phys","day":3,"theme":"熱力学","face":"温度の大小を比べたい","back":"pV の積が温度に比例（pV=nRT）。等温線は双曲線","core":"グラフの面積と傾きを読む","label":"pV の積が温度に比例（pV=nRT）"},{"id":"phys3-6","subj":"phys","day":3,"theme":"熱力学","face":"断熱変化が出たら","back":"Q=0。熱の出入りなしで内部エネルギーと仕事だけが交換する","core":"保存する量を探す","label":"Q=0"},{"id":"phys3-7","subj":"phys","day":3,"theme":"熱力学","face":"熱効率を聞かれた","back":"効率 = (正味の仕事)/(吸収した熱)。放出した熱は分母に入れない","core":"境界で分ける","label":"効率 = (正味の仕事)/(吸収した熱)"},{"id":"phys3-8","subj":"phys","day":3,"theme":"熱力学","face":"内部エネルギーの変化","back":"ΔU は経路によらず最初と最後の温度だけで決まる（状態量 x/dt≠…"},{"id":"math6-5","subj":"math","day":6,"theme":"媒介変数と曲線","face":"曲線の概形を描きたい","back":"x, y それぞれの増減表を t で作り、組み合わせて追う","core":"図と式を行き来する","label":"x, y それぞれの増減表を t で作り…"},{"id":"math6-6","subj":"math","day":6,"theme":"媒介変数と曲線","face":"t を消去して x, y の式にしたい場面","back":"三角なら sin²+cos²=1 のような恒等式で消す。消せない曲線も多い","core":"形を揃える","label":"三角なら sin²+cos²=1 のような恒等式で消…"},{"id":"math6-7","subj":"math","day":6,"theme":"媒介変数と曲線","face":"回転体の体積も t のまま","back":"V=π∫y² dx = π∫y(t)²x′(t) dt。置き換えは同じ","core":"切って積む","label":"V=π∫y² dx = π∫y(t)²x′(t) d…"},{"id":"math6-8","subj":"math","day":6,"theme":"媒介変数と曲線","face":"速度ベクトル・速さ（物理との接続）","back":"速さは √((x′)²+(y′)²)。数学の弧長の要素と物理の速さは同じ量","core":"前の結果を部品にする","label":"速さは √((x′)²+(y′)²)"},{"id":"phys6-1","subj":"phys","day":6,"theme":"波動","face":"干渉の明線条件を聞かれた","back":"経路差 = mλ（m=0,1,2…）で強め合う。暗線は (m+1/2)λ","core":"形を揃える","label":"経路差 = mλ（m=0,1,2…）で強め合う"},{"id":"phys6-2","subj":"phys","day":6,"theme":"波動","face":"ヤングの実験の明線間隔","back":"Δx=λL/d。波長が長い・スクリーンが遠い・スリットが狭いほど広がる","core":"形を揃える","label":"Δx=λL/d"},{"id":"phys6-3","subj":"phys","day":6,"theme":"波動","face":"音源が近づいてくるドップラー","back":"聞こえる波長が短くなる。f′=V/(V−v_s)·f（観測者静止）","core":"境界で分ける","label":"聞こえる波長が短くなる"},{"id":"phys6-4","subj":"phys","day":6,"theme":"波動","face":"観測者も動くドップラー","back":"分子は観測者の動き (V∓v_o)、分母は音源の動き (V∓v_s)。別々に処理する","core":"境界で分ける","label":"分子は観測者の動き (V∓v_o)…"},{"id":"phys6-5","subj":"phys","day":6,"theme":"波動","face":"回折格子の明線","back":"d sinθ=mλ。次数 m には上限があり、|sinθ|≦1 から決まる","core":"境界で分ける","label":"d sinθ=mλ"},{"id":"phys6-6","subj":"phys","day":6,"theme":"波動","face":"うなりを聞かれた","back":"うなりの振動数は2つの振動数の差 |f₁−f₂|","core":"形を揃える","label":"うなりの振動数は2つの振動数の差 |f₁−f₂|"},{"id":"phys6-7","subj":"phys","day":6,"theme":"波動","face":"弦や管の固有振動","back":"両端固定の弦は L=(m/2)λ、開管はその倍音列、閉管は奇数倍のみ","core":"形を揃える","label":"両端固定の弦は L=(m/2)λ、開管はその倍音列…"},{"id":"phys6-8","subj":"phys","day":6,"theme":"波動","face":"波の重ね合わせの原理","back":"合成波は足し算。干渉も定常波もこの原理の応用","core":"前の結果を部品にする","label":"合成波は足し算"},{"id":"math7-1"," 総合（卒業試験）","face":"電場と磁場を直交させて重ねた","back":"qE=qvB の時だけ直進する（速度選別器）。v=E/B が条件","core":"境界で分ける","label":"qE=qvB の時だけ直進する（速度選別器）"},{"id":"phys7-6","subj":"phys","day":7,"theme":"総合（卒業試験）","face":"磁場は仕事をしない","back":"ローレンツ力は速度と常に垂直。速さは変わらず向きだけ変わる","core":"保存する量を探す","label":"ローレンツ力は速度と常に垂直"},{"id":"phys7-7","subj":"phys","day":7,"theme":"総合（卒業試験）","face":"サイクロトロンの発想","back":"磁場で回しながら電場で少しずつ加速する。周期一定だから同期できる","core":"前の結果を部品にする","label":"磁場で回しながら電場で少しずつ加速する"},{"id":"phys7-8","subj":"phys","day":7,"theme":"総合（卒業試験）","face":"質量分析器の原理","back":"同じ速さでも r が m/q で変わる。軌道で質量を選り分ける","core":"図と式を行き来する","label":"同じ速さでも r が m/q で変わる"},{"id":"ab1-1","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"二次関数の最大・最小で、軸が区間の中にあるか外にあるかで迷う","back":"平方完成で軸 x=a を出し、区間と軸の位置関係で場合分け。最大最小の候補は軸の頂点と区間の両端だけ","core":"境界で分ける","label":"平方完成で軸 x=a を出し、区間と軸の位置関係で場…"},{"id":"ab1-2","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"「x² の係数が文字」の二次関数の最大最小","back":"まず係数が0の場合（一次関数になる）を別に調べ、0でない場合は軸の位置で場合分けする","core":"境界で分ける","label":"まず係数が0の場合（一次関数になる）を別に調べ、0で…"},{"id":"ab1-3","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"放物線と直線の共有点の個数を聞かれた","back":"連立してできる二次方程式の判別式 D の符号で決まる。D>0で2点、D=0で接する、D<0で共有点なし","core":"図と式を行き来する","label":"連立してできる二次方程式の判別式 D の符号で決まる"},{"id":"ab1-4","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"判別式を使うか因数分解できるか迷う場面","back":"まず因数分解・解の公式で直接解けるか試し、解の個数だけ知りたい時は判別式に切り替える","core":"形を揃える","label":"まず因数分解・解の公式で直接解けるか試し、解の個数だ…"},{"id":"ab1-5","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"二次関数のグラフが x 軸と共有点を持つ条件","back":"判別式 D=b²−4ac≧0 と同値。頂点の y 座標の符号でも読める","core":"図と式を行き来する","label":"判別式 D=b²−4ac≧0 と同値"},{"id":"ab1-6","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"軸と区間の「遠い方・近い方」で最大最小が決まる問題","back":"下に凸（x² の係数が正）なら、最大は軸から遠い端点、最小は軸に近い側（軸が区間内なら頂点）。距離の比較に帰着させる","core":"境界で分ける","label":"下に凸なら、最大は軸から遠い端点…"},{"id":"ab1-7","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"平行移動した放物線の式を求めたい","back":"頂点の移動だけ追う。y=a(x−p)²+q の p, q がそのまま移動量になる","core":"形を揃える","label":"頂点の移動だけ追う"},{"id":"ab1-8","subj":"math","day":1,"set":"ab1","range":"mab","theme":"二次関数","face":"二次不等式を解く場面","back":"対応する二次関数のグラフの符号で読む。因数分解できれば、解の内側か外側かを図で決める","core":"図と式を行き来する","label":"対応する二次関数のグラフの符号で読む"},{"id":"ab2-1","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"三角形で、向かいの辺と角のペアが分かっている","back":"正弦定理 a/sinA=2R。辺とその対角は常にペアで使う","core":"形を揃える","label":"正弦定理 a/sinA=2R"},{"id":"ab2-2","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"2辺とその間の角が分かっている三角形","back":"挟まれた角なら余弦定理で残りの辺が出る。a²=b²+c²−2bc cosA","core":"形を揃える","label":"挟まれた角なら余弦定理で残りの辺が出る"},{"id":"ab2-3","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"3辺の長さだけが分かっている三角形","back":"余弦定理を cos について解き直して角を求める。面積が要れば次に sin に変換して使う","core":"前の結果を部品にする","label":"余弦定理を cos について解き直して角を求める"},{"id":"ab2-4","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"三角形の面積を求めたい（2辺とその間の角）","back":"S=(1/2)bc sinA。挟む角の sin が要る。角が未知なら余弦定理で cos を出してから sin に変換","core":"前の結果を部品にする","label":"S=(1/2)bc sinA"},{"id":"ab2-5","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"正弦定理と余弦定理のどちらか迷う場面","back":"対角のペアがあれば正弦、挟まれた角か3辺なら余弦。分かっている情報の形で決める","core":"形を揃える","label":"対角のペアがあれば正弦、挟まれた角か3辺なら余弦"},{"id":"ab2-6","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"外接円の半径 R を聞かれた","back":"正弦定理 a=2R sinA。1辺とその対角があれば R がすぐ出る","core":"形を揃える","label":"正弦定理 a=2R sinA"},{"id":"ab2-7","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"内接円の半径 r と面積の関係","back":"S=(1/2)r(a+b+c)。三角形を中心と各辺で3つに分けて面積を足した形","core":"切って積む","label":"S=(1/2)r(a+b+c)"},{"id":"ab2-8","subj":"math","day":2,"set":"ab2","range":"mab","theme":"図形と計量","face":"空間図形で、平面の三角形に落としたい場面","back":"求めたい辺や角を含む平面で切り取り、その三角形に正弦・余弦定理を持ち込む","core":"図と式を行き来する","label":"求めたい辺や角を含む平面で切り取り、その三角形に正弦…"},{"id":"ab3-1","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"順列 P と組合せ C のどちらか迷う","back":"並べる順序に意味があるなら P、選ぶだけなら C。迷ったら『入れ替えたら別のものになるか』を問う","core":"境界で分ける","label":"並べる順序に意味があるなら P、選ぶだけなら C"},{"id":"ab3-2","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"「少なくとも1つ」と来た確率","back":"余事象に逃げる。1−(1つもない確率)。直接数えると重なる場面で特に効く","core":"形を揃える","label":"余事象に逃げる"},{"id":"ab3-3","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"条件付き確率「〜のとき、〜である確率」","back":"世界を条件の中に絞ってから数える。P(A|B)=P(A∩B)/P(B) で、分母が B に変わる","core":"境界で分ける","label":"世界を条件の中に絞ってから数える"},{"id":"ab3-4","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"反復試行（同じ試行を n 回）","back":"成功 k 回の確率は C(n,k) p^k (1−p)^(n−k)。起こる回数の選び方×1通りの確率","core":"形を揃える","label":"成功 k 回の確率は C(n,k) p^k (1−p…"},{"id":"ab3-5","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"くじや玉の取り出しで「戻す／戻さない」","back":"戻せば各回は独立（反復試行）、戻さなければ全体が減るので、そのつど条件付きで数え直す","core":"境界で分ける","label":"戻せば各回は独立（反復試行）、戻さなければ全体が減る…"},{"id":"ab3-6","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"排反かどうかで迷う確率の和","back":"同時には起こらない（排反）なら単純に足せる。重なりがあれば P(A∪B)=P(A)+P(B)−P(A∩B)","core":"境界で分ける","label":"同時には起こらない（排反）なら単純に足せる"},{"id":"ab3-7","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"独立な試行が続く場面","back":"互いに影響しないなら確率を掛ける。独立と排反は別の概念だと区別する","core":"前の結果を部品にする","label":"互いに影響しないなら確率を掛ける"},{"id":"ab3-8","subj":"math","day":3,"set":"ab3","range":"mab","theme":"場合の数と確率","face":"期待値を数え上げで求めるのが重い場面","back":"各試行の期待値に分解して足す（期待値の線形性）。分布表を作らずに済むことが多い","core":"前の結果を部品にする","label":"各試行の期待値に分解して足す（期待値の線形性）"},{"id":"ab4-1","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"三角形の内部の点から各頂点へ引いた線と辺の比","back":"チェバの定理：(BP/PC)(CQ/QA)(AR/RB)=1。辺の比の積が1周して1になる","core":"形を揃える","label":"チェバの定理：(BP/PC)(CQ/QA)(AR/R…"},{"id":"ab4-2","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"三角形の辺を直線が切る比の問題","back":"メネラウスの定理。外分も含めて、辺の比の積が1周して1になる","core":"形を揃える","label":"メネラウスの定理"},{"id":"ab4-3","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"円の外の点から2本の線を引いた長さの関係","back":"方べきの定理：PA·PB=PC·PD。外の点から円への積は一定になる","core":"保存する量を探す","label":"方べきの定理：PA·PB=PC·PD"},{"id":"ab4-4","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"円に外から接線を引いた","back":"同じ点から引いた2本の接線の長さは等しい。半径と接線は接点で垂直になる","core":"図と式を行き来する","label":"同じ点から引いた2本の接線の長さは等しい"},{"id":"ab4-5","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"弦と中心の距離が出てきた","back":"中心から弦への垂線は弦を2等分する。三平方の定理で弦の長さに変換できる","core":"図と式を行き来する","label":"中心から弦への垂線は弦を2等分する"},{"id":"ab4-6","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"接線と弦の作る角を聞かれた","back":"接弦定理：接線と弦の作る角は、その角の内部にある弧に対する円周角に等しい","core":"図と式を行き来する","label":"接弦定理：接線と弦の作る角は、その角の内部にある弧に…"},{"id":"ab4-7","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"角の二等分線と辺の比","back":"内角の二等分線は対辺を、隣り合う2辺の比に内分する。外角の二等分線は外分になる","core":"境界で分ける","label":"内角の二等分線は対辺を、隣り合う2辺の比に内分する"},{"id":"ab4-8","subj":"math","day":4,"set":"ab4","range":"mab","theme":"図形の性質","face":"円周角と中心角が混ざる図形","back":"同じ弧に対する中心角は円周角の2倍。まず弧を決めてから角を運ぶ","core":"前の結果を部品にする","label":"同じ弧に対する中心角は円周角の2倍"},{"id":"ab5-1","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"a sinθ+b cosθ の形を見た","back":"三角関数の合成で R sin(θ+α) の1つにまとめる。最大・最小は ±R（R=√(a²+b²)）","core":"形を揃える","label":"三角関数の合成で R sin(θ+α) の1つにまと…"},{"id":"ab5-2","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"sin²θ や cos2θ が混ざる方程式","back":"倍角・半角で次数を下げるか、sin²θ+cos²θ=1 で1種類の三角関数に統一する","core":"形を揃える","label":"倍角・半角で次数を下げるか、sin²θ+cos²θ=…"},{"id":"ab5-3","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"三角関数を置き換えて二次式にしたい場面","back":"sinθ+cosθ=t と置くと sinθcosθ=(t²−1)/2 が付いてきて、二次方程式に化ける","core":"形を揃える","label":"sinθ+cosθ=t と置くと sinθcosθ=…"},{"id":"ab5-4","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"置換した後の t の範囲を忘れそうな場面","back":"t=sinθ+cosθ なら −√2≦t≦√2。置換と同時に範囲もセットで書く","core":"境界で分ける","label":"t=sinθ+cosθ なら −√2≦t≦√2"},{"id":"ab5-5","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"指数方程式で底がバラバラ","back":"底を揃えるか、aˣ=t と置いて二次式化する。指数関数は単調だから、指数同士の比較に帰着できる","core":"形を揃える","label":"底を揃えるか、aˣ=t と置いて二次式化する"},{"id":"ab5-6","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"対数の大小比較","back":"底が1より大きいか小さいかで不等号の向きが決まる。まず真数条件（真数>0）を押さえてから比べる","core":"境界で分ける","label":"底が1より大きいか小さいかで不等号の向きが決まる"},{"id":"ab5-7","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"底が違う対数をまとめたい","back":"底の変換公式 log_a b=log_c b/log_c a で、底を1つに統一する","core":"形を揃える","label":"底の変換公式 log_a b=log_c b/log…"},{"id":"ab5-8","subj":"math","day":5,"set":"ab5","range":"mab","theme":"三角関数・指数対数","face":"数の桁数を聞かれた（常用対数）","back":"10ᵏ≦N<10ᵏ⁺¹ の形に挟む。log₁₀N の整数部分が（桁数−1）に対応する","core":"境界で分ける","label":"10ᵏ≦N<10ᵏ⁺¹ の形に挟む"},{"id":"ab6-1","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"円と直線の位置関係を聞かれた","back":"中心と直線の距離 d と半径 r の比較。d<rで2点共有、d=rで接する、d>rで共有点なし。連立した判別式でも同じ判定","core":"図と式を行き来する","label":"中心と直線の距離 d と半径 r の比較"},{"id":"ab6-2","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"円の接線の方程式を求めたい","back":"円 x²+y²=r² 上の点 (x₁,y₁) での接線は x₁x+y₁y=r²。中心からの距離＝半径でも作れる","core":"形を揃える","label":"円 x²+y²=r² 上の点 (x₁,y₁) での接…"},{"id":"ab6-3","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"条件を満たす点の軌跡","back":"点を (x,y) と置き、条件をそのまま式にして整理する。最後に、除くべき点がないか確認する","core":"図と式を行き来する","label":"点を (x,y) と置き、条件をそのまま式にして整理…"},{"id":"ab6-4","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"2点からの距離の比が一定という条件","back":"比が1でないなら軌跡は円（アポロニウスの円）。距離の二乗で式を立てて平方完成する","core":"図と式を行き来する","label":"比が1でないなら軌跡は円（アポロニウスの円）"},{"id":"ab6-5","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"3次関数が極値を持つかどうか","back":"f′ は2次式。f′=0 の判別式が正かどうかが、極値を持つかの分かれ目","core":"境界で分ける","label":"f′ は2次式"},{"id":"ab6-6","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"放物線と直線で囲まれた面積の 1/6 公式","back":"使えるのは、差が2次式になる組の時だけ。面積=|a|(β−α)³/6（a は2つの式の差の x² の係数）。条件外では普通の積分に戻る","core":"形を揃える","label":"使えるのは、差が2次式になる組の時だけ"},{"id":"ab6-7","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"2曲線が接する条件","back":"接する点で、関数の値と微分係数が一致する2条件。f(a)=g(a) かつ f′(a)=g′(a)","core":"境界で分ける","label":"接する点で、関数の値と微分係数が一致する2条件"},{"id":"ab6-8","subj":"math","day":6,"set":"ab6","range":"mab","theme":"図形と方程式と微分積分","face":"直線が円と接する条件をパラメータで聞かれた","back":"中心と直線の距離＝半径、の1本の式に帰着させる。判別式 D=0 と等価な場面が多い","core":"図と式を行き来する","label":"中心と直線の距離＝半径、の1本の式に帰着させる"},{"id":"ab7-1","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"数列を見て等差か等比か判断したい","back":"隣との差が一定なら等差、比が一定なら等比。まず差と比の両方を試す","core":"境界で分ける","label":"隣との差が一定なら等差、比が一定なら等比"},{"id":"ab7-2","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"等比数列の和を求めたい","back":"Sₙ=a(rⁿ−1)/(r−1)（r≠1）。r=1 の時は Sₙ=na と別扱いにする","core":"形を揃える","label":"Sₙ=a(rⁿ−1)/(r−1)（r≠1）"},{"id":"ab7-3","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"漸化式 aₙ₊₁=paₙ+q の形","back":"特性方程式 α=pα+q で α を出し、aₙ−α を等比数列に変形する","core":"形を揃える","label":"特性方程式 α=pα+q で α を出し、aₙ−α …"},{"id":"ab7-4","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"漸化式が分数型 aₙ₊₁=aₙ/(paₙ+q)","back":"逆数を取ると等差型に化けることが多い。まず逆数や置換を試す","core":"形を揃える","label":"逆数を取ると等差型に化けることが多い"},{"id":"ab7-5","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"階差数列が使える場面","back":"もとの数列の差 bₙ が簡単な数列になる時。aₙ=a₁+Σbₖ の形で戻れる","core":"前の結果を部品にする","label":"もとの数列の差 bₙ が簡単な数列になる時"},{"id":"ab7-6","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"群数列が出てきた","back":"まず『第m群の末項は全体の第何項か』を確定させてから、その群の中での位置を数える。二段構えにする","core":"境界で分ける","label":"まず『第m群の末項は全体の第何項か』を確定させてから…"},{"id":"ab7-7","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"Σk² や Σk³ の和","back":"公式 Σk=n(n+1)/2、Σk²=n(n+1)(2n+1)/6 を使う。(k+1)³−k³ の差分の相殺で導ける","core":"前の結果を部品にする","label":"公式 Σk=n(n+1)/2、Σk²=n(n+1)(…"},{"id":"ab7-8","subj":"math","day":7,"set":"ab7","range":"mab","theme":"数列","face":"和 Sₙ から一般項 aₙ を求めたい","back":"aₙ=Sₙ−Sₙ₋₁（n≧2）。n=1 の時は S₁ と一致するか別に確認する","core":"境界で分ける","label":"aₙ=Sₙ−Sₙ₋₁（n≧2）"},{"id":"ab8-1","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"期待値の計算で分布表が大きい","back":"期待値の線形性：E(aX+b)=aE(X)+b、E(X+Y)=E(X)+E(Y)。和の線形性は独立でなくても成り立つ","core":"前の結果を部品にする","label":"期待値の線形性：E(aX+b)=aE(X)+b、E(…"},{"id":"ab8-2","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"分散の計算が重い場面","back":"V(X)=E(X²)−{E(X)}² を使う。定義の二乗和より速い","core":"形を揃える","label":"V(X)=E(X²)−{E(X)}² を使う"},{"id":"ab8-3","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"変量を a 倍して b を足した時の分散","back":"V(aX+b)=a²V(X)。b は散らばりに効かず、a は二乗で効く。標準偏差は |a| 倍になる","core":"形を揃える","label":"V(aX+b)=a²V(X)"},{"id":"ab8-4","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"二項分布 B(n,p) の期待値と分散","back":"E=np、V=np(1−p)。1回の試行（成功確率 p）の n 個分だと読む","core":"前の結果を部品にする","label":"E=np、V=np(1−p)"},{"id":"ab8-5","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"二項分布を正規分布で近似したい","back":"np と np(1−p) が十分大きい時、N(np, np(1−p)) で近似する","core":"形を揃える","label":"np と np(1−p) が十分大きい時、N(np,…"},{"id":"ab8-6","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"標本平均の分布を聞かれた","back":"X̄ の期待値は μ、分散は σ²/n、標準偏差は σ/√n。n が大きいほど平均は μ の近くに集まる","core":"形を揃える","label":"X̄ の期待値は μ、分散は σ²/n、標準偏差は …"},{"id":"ab8-7","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"母平均の信頼区間","back":"X̄±z·(σ/√n) の形。95%信頼区間なら z=1.96。区間の幅は √n に反比例して狭くなる","core":"境界で分ける","label":"X̄±z·(σ/√n) の形"},{"id":"ab8-8","subj":"math","day":8,"set":"ab8","range":"mab","theme":"統計的推測","face":"信頼区間の幅を半分にしたい","back":"幅は 1/√n に比例するので、n を4倍にする。精度と標本数の交換関係","core":"前の結果を部品にする","label":"幅は 1/√n に比例するので、n を4倍にする"},{"id":"ab9-1","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"絶対値を含む方程式・不等式","back":"中身の符号が変わる点を境界にして場合分けし、絶対値を外す。各区間で、解が区間に合うかも確認する","core":"境界で分ける","label":"中身の符号が変わる点を境界にして場合分けし、絶対値を…"},{"id":"ab9-2","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"命題の真偽を直接示しにくい場面","back":"対偶に替える。『p⇒q』と『q̄⇒p̄』の真偽は一致する","core":"形を揃える","label":"対偶に替える"},{"id":"ab9-3","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"「必要条件か十分条件か」を聞かれた","back":"矢印の向きで判定：p⇒q が真なら、p は十分条件、q は必要条件。偽なら反例を1つ挙げればよい","core":"図と式を行き来する","label":"矢印の向きで判定：p⇒q が真なら、p は十分条件、…"},{"id":"ab9-4","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"背理法の入り口","back":"結論を否定して仮定し、矛盾を1つ導く。『無理数である』『無限に存在する』の証明の型","core":"形を揃える","label":"結論を否定して仮定し、矛盾を1つ導く"},{"id":"ab9-5","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"因数分解で、たすき掛けが決まらない","back":"次数の低い文字について整理してから、共通因数と公式を探す。視点を1つの文字に固定する","core":"形を揃える","label":"次数の低い文字について整理してから、共通因数と公式を…"},{"id":"ab9-6","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"対称式（x+y と xy）が見えた","back":"x²+y²=(x+y)²−2xy のように、基本対称式だけで表す。因数分解でも同じ発想を使う","core":"形を揃える","label":"x²+y²=(x+y)²−2xy のように、基本対称…"},{"id":"ab9-7","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"集合の要素の個数 n(A∪B)","back":"n(A∪B)=n(A)+n(B)−n(A∩B)。重なりを1回引く。ベン図で確認する","core":"図と式を行き来する","label":"n(A∪B)=n(A)+n(B)−n(A∩B)"},{"id":"ab9-8","subj":"math","day":9,"set":"ab9","range":"mab","theme":"数と式・集合と命題","face":"『すべての』『ある』を含む命題の否定","back":"「すべて〜でない」の否定は「ある〜である」。否定では全称と存在が入れ替わる","core":"境界で分ける","label":"「すべて〜でない」の否定は「ある〜である」"},{"id":"ab10-1","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"四分位数と箱ひげ図を読めと言われた","back":"データを4等分する境界が四分位数。四分位範囲＝第3四分位数−第1四分位数で、中央付近の散らばりを表す","core":"境界で分ける","label":"データを4等分する境界が四分位数"},{"id":"ab10-2","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"外れ値の影響を受けにくい代表値が要る","back":"平均は外れ値に引っ張られる。中心は中央値、散らばりは四分位範囲が頑丈","core":"境界で分ける","label":"平均は外れ値に引っ張られる"},{"id":"ab10-3","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"分散と標準偏差の関係","back":"標準偏差は分散の平方根。分散は単位が二乗になるので、元の単位に戻すのが標準偏差","core":"形を揃える","label":"標準偏差は分散の平方根"},{"id":"ab10-4","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"分散の計算で定義式が重い","back":"分散＝(二乗の平均)−(平均の二乗)。x² の平均を先に作ると速い","core":"形を揃える","label":"分散＝(二乗の平均)−(平均の二乗)"},{"id":"ab10-5","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"散布図と相関係数の符号","back":"右上がりの傾向なら正、右下がりなら負。相関係数は −1 から 1 の間で、直線関係の強さだけを見る","core":"グラフの面積と傾きを読む","label":"右上がりの傾向なら正、右下がりなら負"},{"id":"ab10-6","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"変量変換 x→ax+b で平均はどうなる","back":"平均も同じ変換を受ける：x̄ は a·x̄+b になる。全データに同じ操作をするから、中心は一緒に動く","core":"形を揃える","label":"平均も同じ変換を受ける：x̄ は a·x̄+b にな…"},{"id":"ab10-7","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"変量変換で分散・標準偏差はどうなる","back":"分散は a² 倍（b は無関係）、標準偏差は |a| 倍。平行移動は散らばりを変えない","core":"形を揃える","label":"分散は a² 倍（b は無関係）、標準偏差は |a|…"},{"id":"ab10-8","subj":"math","day":10,"set":"ab10","range":"mab","theme":"データの分析","face":"相関係数が高い＝因果関係あり、と言えるか","back":"言えない。相関は直線的な連動を表すだけで、因果には別の根拠が要る","core":"グラフの面積と傾きを読む","label":"言えない"},{"id":"ab11-1","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"恒等式の係数を決めたい","back":"係数比較法：同じ次数の係数を並べて連立する。数値代入法でも同じ答えになるはず","core":"形を揃える","label":"係数比較法：同じ次数の係数を並べて連立する"},{"id":"ab11-2","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"分数式の恒等式（部分分数分解）","back":"両辺に分母を掛けて普通の恒等式に直し、係数比較か数値代入で定数を決める","core":"形を揃える","label":"両辺に分母を掛けて普通の恒等式に直し、係数比較か数値…"},{"id":"ab11-3","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"相加平均・相乗平均を使う場面","back":"a+b≧2√(ab)（a,b>0）。等号が成り立つ条件（a=b）の確認までがセット","core":"境界で分ける","label":"a+b≧2√(ab)（a,b>0）"},{"id":"ab11-4","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"解と係数の関係を使いたい","back":"ax²+bx+c=0 の2解 α,β で α+β=−b/a、αβ=c/a。解を出さずに対称式を計算できる","core":"前の結果を部品にする","label":"ax²+bx+c=0 の2解 α,β で α+β=−…"},{"id":"ab11-5","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"剰余の定理を使う場面","back":"P(x) を x−a で割った余りは P(a)。割る式が1次なら、代入だけで余りが出る","core":"形を揃える","label":"P(x) を x−a で割った余りは P(a)"},{"id":"ab11-6","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"因数定理で因数分解したい","back":"P(a)=0 になる a を探せば (x−a) が因数になる。a の候補は定数項の約数から探す","core":"形を揃える","label":"P(a)=0 になる a を探せば (x−a) が因…"},{"id":"ab11-7","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"2次方程式の虚数解が1つ分かった","back":"実数係数なら、虚数解は共役なペアで現れる。α が解なら、その共役も解になる","core":"前の結果を部品にする","label":"実数係数なら、虚数解は共役なペアで現れる"},{"id":"ab11-8","subj":"math","day":11,"set":"ab11","range":"mab","theme":"式と証明・複素数と方程式","face":"高次方程式の重解が気になる","back":"因数分解して各因数の次数を数える。重解は (x−a)² のような因数の形に現れる","core":"境界で分ける","label":"因数分解して各因数の次数を数える"},{"id":"ab12-1","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"ベクトルの大きさを求めたい","back":"|a|=√(a₁²+a₂²)。成分の二乗和の平方根で、三平方の定理そのもの","core":"形を揃える","label":"|a|=√(a₁²+a₂²)"},{"id":"ab12-2","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"2つのベクトルが垂直と言われた","back":"内積が 0：a·b=0。垂直という図形の条件は、内積に翻訳する","core":"図と式を行き来する","label":"内積が 0：a·b=0"},{"id":"ab12-3","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"ベクトルのなす角を求めたい","back":"cosθ=(a·b)/(|a||b|)。内積を大きさで割る","core":"図と式を行き来する","label":"cosθ=(a·b)/(|a||b|)"},{"id":"ab12-4","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"内分点の位置ベクトル","back":"AB を m:n に内分する点は (n·a+m·b)/(m+n)。近い方の点の重みが大きくなる（逆比）","core":"形を揃える","label":"AB を m:n に内分する点は (n·a+m·b)…"},{"id":"ab12-5","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"3点が同じ直線上にある条件","back":"AP が AB の実数倍で表せること。位置ベクトルの係数の和が1になる形も使う","core":"形を揃える","label":"AP が AB の実数倍で表せること"},{"id":"ab12-6","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"ベクトル方程式で図形を表したい","back":"|p−a|=r は中心 a・半径 r の円。(p−a)·(p−b)=0 は AB を直径とする円を表す","core":"図と式を行き来する","label":"|p−a|=r は中心 a・半径 r の円"},{"id":"ab12-7","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"ベクトルの式の始点を揃えたい","back":"全部を O 始点に直してから計算する。AB=b−a の引き算に統一する","core":"形を揃える","label":"全部を O 始点に直してから計算する"},{"id":"ab12-8","subj":"math","day":12,"set":"ab12","range":"mab","theme":"ベクトル","face":"三角形の面積をベクトルで求めたい","back":"三角形 OAB の面積は (1/2)|a₁b₂−a₂b₁|。成分のたすき掛けの差で出る","core":"図と式を行き来する","label":"三角形 OAB の面積は (1/2)|a₁b₂−a₂…"}];
/* 解法カード — 5分モード＋一覧モード。データは CARDS（元サイトのDAYSから機械抽出） */
const LS_KEY = "kaihou-cards-v1";
const SUBJ_NAME = { math: "数学", phys: "物理" };
/* 範囲：m3=数学III・C（既存セット）、mab=数学I・A・II・B・C（共テ範囲）、phys=物理 */
function rangeOf(c) { return c.range || (c.subj === "math" ? "m3" : "phys"); }
function matchRange(c, f) {
  if (f === "all") return true;
  if (f === "phys") return c.subj === "phys";
  return c.subj === "math" && rangeOf(c) === f;
}
function metaText(c) {
  if (rangeOf(c) === "mab") return "数学（I・A・II・B・C）：" + c.theme;
  return SUBJ_NAME[c.subj] + " Day" + c.day + "：" + c.theme;
}
function setKey(c) { return c.set || (c.subj + "-" + c.day); }

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    return { weak: Array.isArray(s.weak) ? s.weak : [], stats: s.stats || {} };
  } catch (e) { return { weak: [], stats: {} }; }
}
function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadState();

const byId = {};
CARDS.forEach(c => { byId[c.id] = c; });
/* 選択肢は同じセット（科目×日）のカード群。正解はその状況のカード1枚だけ（同じ芯というだけでは正解にしない） */
function setOf(card) { return CARDS.filter(c => setKey(c) === setKey(card)); }
function correctIds(card) {
  return [card.id];
}

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function fmtTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ============ 5分モード ============ */
let session = null;
function pickSession(subj) {
  const pool = CARDS.filter(c => matchRange(c, subj));
  const weak = shuffle(pool.filter(c => state.weak.includes(c.id)));
  const rest = shuffle(pool.filter(c => !state.weak.includes(c.id)));
  return weak.concat(rest).slice(0, 10);
}
function startSession() {
  const subj = document.querySelector("input[name=subj]:checked").value;
  const qs = pickSession(subj);
  session = { qs: qs, idx: 0, correct: 0, missed: [], startAt: Date.now(), timer: null, selected: new Set(), graded: false };
  document.getElementById("homeView").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("quizView").style.display = "";
  document.getElementById("resultView").style.display = "none";
  session.timer = setInterval(tickTimer, 500);
  tickTimer();
  renderQuestion();
}
function tickTimer() {
  if (!session) return;
  const el = Math.floor((Date.now() - session.startAt) / 1000);
  const t = document.getElementById("timer");
  t.textContent = fmtTime(el) + " / 5:00";
  t.classList.toggle("over", el > 300);
}
function currentCard() { return session.qs[session.idx]; }
function renderQuestion() {
  const card = currentCard();
  const corr = correctIds(card);
  session.correctSet = new Set(corr);
  session.selected = new Set();
  session.graded = false;
  document.getElementById("qMeta").innerHTML =
    '<span class="chip">' + esc(metaText(card)) + "</span>" +
    (corr.length > 1 ? '<span class="chip chip-blue">複数選択（当てはまるものを全部）</span>' : '<span class="chip chip-blue">1枚選択</span>') +
    (state.weak.includes(card.id) ? '<span class="chip chip-weak">苦手プール</span>' : "");
  document.getElementById("qFace").textContent = card.face;
  document.getElementById("qCount").textContent = (session.idx + 1) + " / " + session.qs.length + "問";
  document.getElementById("dots").innerHTML = session.qs.map(function (_, i) {
    return '<span class="dot' + (i < session.idx ? " done" : (i === session.idx ? " now" : "")) + '"></span>';
  }).join("");
  const opts = shuffle(setOf(card));
  document.getElementById("options").innerHTML = opts.map(function (c) {
    return '<button type="button" class="opt" data-id="' + c.id + '" onclick="toggleOpt(this)">' + esc(c.label) + "</button>";
  }).join("");
  document.getElementById("feedback").style.display = "none";
  document.getElementById("gradeBtn").style.display = "";
  document.getElementById("gradeBtn").disabled = true;
  document.getElementById("nextBtn").style.display = "none";
}
function toggleOpt(btn) {
  if (!session || session.graded) return;
  const id = btn.getAttribute("data-id");
  if (session.selected.has(id)) { session.selected.delete(id); btn.classList.remove("sel"); }
  else {
    if (session.correctSet.size === 1) {
      session.selected.clear();
      document.querySelectorAll("#options .opt.sel").forEach(function (b) { b.classList.remove("sel"); });
    }
    session.selected.add(id); btn.classList.add("sel");
  }
  document.getElementById("gradeBtn").disabled = session.selected.size === 0;
}
function grade() {
  if (!session || session.graded || session.selected.size === 0) return;
  session.graded = true;
  const card = currentCard();
  const corr = session.correctSet, sel = session.selected;
  let exact = sel.size === corr.size;
  if (exact) { corr.forEach(id => { if (!sel.has(id)) exact = false; }); }
  document.querySelectorAll("#options .opt").forEach(function (btn) {
    const id = btn.getAttribute("data-id");
    const isC = corr.has(id), isS = sel.has(id);
    btn.disabled = true;
    if (isC && isS) btn.classList.add("hit");
    else if (!isC && isS) btn.classList.add("wrongpick");
    else if (isC && !isS) btn.classList.add("missed");
    if (isC) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "正解"; btn.appendChild(tag); }
  });
  const st = state.stats[card.id] || { seen: 0, ok: 0 };
  st.seen++;
  if (exact) {
    st.ok++;
    session.correct++;
    state.weak = state.weak.filter(id => id !== card.id);
  } else {
    session.missed.push(card);
    if (!state.weak.includes(card.id)) state.weak.push(card.id);
  }
  state.stats[card.id] = st;
  saveState();
  const fb = document.getElementById("feedback");
  const correctLabels = [...corr].map(id => byId[id].label);
  fb.className = "feedback " + (exact ? "ok" : "ng");
  fb.innerHTML =
    "<strong>" + (exact ? "正解！" : (sel.size && [...sel].some(id => corr.has(id)) ? "部分正解（あと少し）" : "不正解")) + "</strong>" +
    '<div class="fb-back">' + esc(card.back) + "</div>" +
    '<div class="fb-core">芯：<b>' + esc(card.core) + "</b>" +
    (corr.size > 1 ? " ― この状況では、同じ芯「" + esc(card.core) + "」のカードも正解です" : "") + "</div>" +
    '<div class="fb-list">正解のカード：' + correctLabels.map(esc).join(" ／ ") + "</div>";
  fb.style.display = "";
  document.getElementById("gradeBtn").style.display = "none";
  const nb = document.getElementById("nextBtn");
  nb.textContent = session.idx + 1 >= session.qs.length ? "結果を見る" : "次の問題へ";
  nb.style.display = "";
}
function nextQuestion() {
  session.idx++;
  if (session.idx >= session.qs.length) { showResult(); return; }
  renderQuestion();
}
function showResult() {
  clearInterval(session.timer);
  const elapsed = Math.floor((Date.now() - session.startAt) / 1000);
  document.getElementById("quizView").style.display = "none";
  const rv = document.getElementById("resultView");
  rv.style.display = "";
  document.getElementById("resultScore").textContent = session.correct + " / " + session.qs.length + " 正解";
  document.getElementById("resultTime").textContent = "かかった時間 " + fmtTime(elapsed) + "（目安5分）";
  const ml = document.getElementById("missedList");
  if (session.missed.length === 0) {
    ml.innerHTML = '<p class="muted">間違えたカードはありませんでした。</p>';
  } else {
    ml.innerHTML = "<h3>間違えたカード（苦手プール入り）</h3>" + session.missed.map(function (c) {
      return '<div class="missed-item"><div class="m-face">' + esc(c.face) + '</div><div class="m-back">' + esc(c.back) + "（芯：" + esc(c.core) + "）</div></div>";
    }).join("");
  }
  session = null;
}
function quitToHome() {
  if (session && session.timer) clearInterval(session.timer);
  session = null;
  document.getElementById("quizView").style.display = "none";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("homeView").style.display = "";
  renderHomeStats();
}
function renderHomeStats() {
  const el = document.getElementById("homeStats");
  const seen = Object.keys(state.stats).length;
  el.textContent = "苦手プール " + state.weak.length + "枚 ／ これまで出題 " + seen + "枚（全" + CARDS.length + "枚）";
}

/* ============ 一覧モード ============ */
function showList() {
  if (session && session.timer) clearInterval(session.timer);
  session = null;
  document.getElementById("homeView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("listView").style.display = "";
  renderList();
}
function fillFilters() {
  const subj = document.getElementById("fSubj").value;
  const themeSel = document.getElementById("fTheme");
  const coreSel = document.getElementById("fCore");
  const themes = [...new Set(CARDS.filter(c => matchRange(c, subj)).map(c => c.theme))];
  const cores = [...new Set(CARDS.map(c => c.core))];
  const curT = themeSel.value, curC = coreSel.value;
  themeSel.innerHTML = '<option value="all">分野：すべて</option>' + themes.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
  coreSel.innerHTML = '<option value="all">芯：すべて</option>' + cores.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
  if (themes.includes(curT)) themeSel.value = curT;
  if (cores.includes(curC)) coreSel.value = curC;
}
function renderList() {
  fillFilters();
  const subj = document.getElementById("fSubj").value;
  const theme = document.getElementById("fTheme").value;
  const core = document.getElementById("fCore").value;
  const weakOnly = document.getElementById("fWeak").checked;
  const list = CARDS.filter(c =>
    (matchRange(c, subj)) &&
    (theme === "all" || c.theme === theme) &&
    (core === "all" || c.core === core) &&
    (!weakOnly || state.weak.includes(c.id)));
  document.getElementById("listCount").textContent = list.length + "枚";
  document.getElementById("listGrid").innerHTML = list.map(function (c) {
    return '<div class="lcard" data-id="' + c.id + '" onclick="flipCard(this)">' +
      '<div class="l-meta">' + esc(metaText(c)) +
      (state.weak.includes(c.id) ? ' <span class="chip chip-weak">苦手</span>' : "") + "</div>" +
      '<div class="l-face">' + esc(c.face) + "</div>" +
      '<div class="l-back" style="display:none">' + esc(c.back) + '<div class="l-core">芯：' + esc(c.core) + "</div></div>" +
      '<div class="l-hint">タップで解法を表示／隠す</div></div>';
  }).join("") || '<p class="muted">該当するカードがありません。</p>';
}
function flipCard(el) {
  const b = el.querySelector(".l-back");
  b.style.display = b.style.display === "none" ? "" : "none";
}

renderHomeStats();

</script>
</body>
</html>
