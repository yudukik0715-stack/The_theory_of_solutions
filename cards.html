<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>解法カード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #ffffff; color: #1e293b; line-height: 1.7;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; padding: 18px 0 8px; }
  header h1 { font-size: 26px; font-weight: 700; color: #0369a1; letter-spacing: .04em; }
  header p { font-size: 13px; color: #64748b; margin-top: 4px; }
  .card-panel {
    background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 16px;
    padding: 20px; margin-top: 18px;
  }
  .seg { display: flex; gap: 8px; justify-content: center; margin: 6px 0 16px; flex-wrap: wrap; }
  .seg label {
    padding: 8px 18px; border-radius: 999px; border: 1px solid #7dd3fc;
    background: #fff; color: #0369a1; font-size: 14px; cursor: pointer; user-select: none;
  }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: #0284c7; border-color: #0284c7; color: #fff; font-weight: 600; }
  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: #0284c7; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: #0369a1; }
  .btn:disabled { background: #cbd5e1; cursor: default; }
  .btn.sub { background: #fff; color: #0284c7; border: 1px solid #7dd3fc; margin-top: 10px; }
  .btn.sub:hover { background: #e0f2fe; }
  .stats { text-align: center; font-size: 13px; color: #64748b; margin-top: 14px; }
  .muted { color: #64748b; font-size: 14px; text-align: center; padding: 12px; }

  /* クイズ */
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 15px; color: #0369a1; font-weight: 600; }
  .timer.over { color: #dc2626; }
  .qcount { font-size: 13px; color: #64748b; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 12px 0 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e2e8f0; }
  .dot.done { background: #38bdf8; }
  .dot.now { background: #0284c7; transform: scale(1.25); }
  .qmeta { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #e0f2fe; color: #0369a1;
  }
  .chip-blue { background: #dbeafe; color: #1d4ed8; }
  .chip-weak { background: #fee2e2; color: #b91c1c; }
  .qface {
    font-size: 19px; font-weight: 600; background: #fff; border: 1px solid #e0f2fe;
    border-left: 5px solid #0284c7; border-radius: 12px; padding: 18px; margin: 8px 0 16px;
  }
  .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .options { grid-template-columns: 1fr 1fr; } }
  .opt {
    position: relative; text-align: left; padding: 14px 16px; font-size: 15px; line-height: 1.55;
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; color: #1e293b;
  }
  .opt:hover { border-color: #7dd3fc; }
  .opt.sel { border-color: #0284c7; background: #e0f2fe; }
  .opt.hit { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrongpick { border-color: #dc2626; background: #fef2f2; }
  .opt.missed { border-color: #16a34a; border-style: dashed; background: #fff; }
  .opt .tag {
    position: absolute; top: -9px; right: 10px; font-size: 11px; font-weight: 700;
    background: #16a34a; color: #fff; padding: 1px 8px; border-radius: 999px;
  }
  .actions { margin-top: 18px; }
  .feedback { border-radius: 12px; padding: 16px 18px; margin-top: 18px; font-size: 15px; }
  .feedback.ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .feedback.ng { background: #fff7ed; border: 1px solid #fed7aa; }
  .fb-back { margin-top: 8px; }
  .fb-core { margin-top: 8px; color: #0369a1; font-size: 14px; }
  .fb-list { margin-top: 8px; font-size: 13px; color: #475569; }

  /* 結果 */
  .result-score { font-size: 32px; font-weight: 700; color: #0369a1; text-align: center; margin-top: 10px; }
  .result-time { text-align: center; color: #64748b; font-size: 14px; margin-top: 4px; }
  .missed-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .m-face { font-weight: 600; font-size: 15px; }
  .m-back { font-size: 14px; color: #475569; margin-top: 4px; }
  #resultView h3, #missedList h3 { font-size: 15px; color: #334155; margin-top: 20px; }

  /* 一覧 */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  .filters select {
    padding: 9px 10px; border: 1px solid #7dd3fc; border-radius: 10px; background: #fff;
    color: #0369a1; font-size: 14px;
  }
  .filters label { font-size: 14px; color: #334155; display: flex; gap: 5px; align-items: center; }
  .list-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .list-grid { grid-template-columns: 1fr 1fr; } }
  .lcard { border: 1px solid #e0f2fe; border-radius: 12px; padding: 14px 16px; cursor: pointer; background: #fff; }
  .lcard:hover { border-color: #7dd3fc; }
  .l-meta { font-size: 12px; color: #0284c7; margin-bottom: 6px; }
  .l-face { font-weight: 600; font-size: 15px; }
  .l-back { margin-top: 10px; font-size: 14px; color: #334155; border-top: 1px dashed #bae6fd; padding-top: 10px; }
  .l-core { color: #0284c7; font-size: 13px; margin-top: 4px; }
  .l-hint { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  .back-link { display: inline-block; margin-top: 14px; color: #0284c7; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>解法カード</h1>
    <p>状況を見て、使う解法カードを選ぶ練習</p>
  </header>

  <!-- ホーム -->
  <div id="homeView">
    <div class="card-panel">
      <div class="seg" role="radiogroup" aria-label="科目">
        <label><input type="radio" name="subj" value="all" checked>全部</label>
        <label><input type="radio" name="subj" value="math">数学</label>
        <label><input type="radio" name="subj" value="phys">物理</label>
      </div>
      <button class="btn" onclick="startSession()">5分モードをはじめる（10問）</button>
      <button class="btn sub" onclick="showList()">カード一覧を見る</button>
      <div class="stats" id="homeStats"></div>
    </div>
  </div>

  <!-- クイズ -->
  <div id="quizView" style="display:none">
    <div class="quiz-top">
      <span class="qcount" id="qCount"></span>
      <span class="timer" id="timer">0:00 / 5:00</span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="qmeta" id="qMeta"></div>
    <div class="qface" id="qFace"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" style="display:none"></div>
    <div class="actions">
      <button class="btn" id="gradeBtn" onclick="grade()" disabled>決定</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none">次の問題へ</button>
      <button class="back-link" onclick="quitToHome()">やめてホームへ戻る</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="resultView" style="display:none">
    <div class="result-score" id="resultScore"></div>
    <div class="result-time" id="resultTime"></div>
    <div id="missedList"></div>
    <div class="actions">
      <button class="btn" onclick="quitToHome()">ホームへ戻る</button>
      <button class="btn sub" onclick="showList()">カード一覧を見る</button>
    </div>
  </div>

  <!-- 一覧 -->
  <div id="listView" style="display:none">
    <button class="back-link" onclick="quitToHome()">← ホームへ戻る</button>
    <div class="filters">
      <select id="fSubj" onchange="renderList()">
        <option value="all">科目：すべて</option>
        <option value="math">数学</option>
        <option value="phys">物理</option>
      </select>
      <select id="fTheme" onchange="renderList()"></select>
      <select id="fCore" onchange="renderList()"></select>
      <label><input type="checkbox" id="fWeak" onchange="renderList()"> 苦手のみ</label>
      <span class="qcount" id="listCount"></span>
    </div>
    <div class="list-grid" id="listGrid"></div>
  </div>
</div>
<script>
"use strict";
const CARDS = [{"id":"math1-1","subj":"math","day":1,"theme":"微分の応用","face":"3次関数で「増減を調べよ」と来た","back":"まず微分して f′(x)=0 の x を出す。そこが山と谷の位置","core":"図と式","label":"まず微分して f′(x)=0 の x を出す"},{"id":"math1-2","subj":"math","day":1,"theme":"微分の応用","face":"方程式 f(x)=k の「実数解の個数を調べよ」","back":"y=k の水平線とグラフの交点の数に翻訳する。境界は極大値・極小値","core":"図と式","label":"y=k の水平線とグラフの交点の数に翻訳する"},{"id":"math1-3","subj":"math","day":1,"theme":"微分の応用","face":"「曲線外の点を通る接線」を求めたい","back":"接点を (t, f(t)) と置いてから接線を作り、通る点の条件を t の方程式にする","core":"前の結果を部品にする","label":"接点を (t, f(t)) と置いてから接線を作り…"},{"id":"math1-4","subj":"math","day":1,"theme":"微分の応用","face":"閉区間の最大・最小を聞かれた","back":"候補は「極値点と両端」だけ。全部代入して比べる","core":"境界で分ける","label":"候補は「極値点と両端」だけ"},{"id":"math1-5","subj":"math","day":1,"theme":"微分の応用","face":"パラメータで解の個数が変わる問題","back":"場合分けの境界は必ず極値。極値を先に固定してから a を動かす","core":"境界で分ける","label":"場合分けの境界は必ず極値"},{"id":"math1-6","subj":"math","day":1,"theme":"微分の応用","face":"接線の傾きが知りたい場面","back":"傾きはその点での微分係数 f′(a)。図の傾きと式が一致する","core":"図と式","label":"傾きはその点での微分係数 f′(a)"},{"id":"math1-7","subj":"math","day":1,"theme":"微分の応用","face":"「異なる3つの実数解」と書いてある","back":"極大値>k>極小値 の形に持ち込む合図。符号の積 (極大−k)(極小−k)<0 でも可","core":"図と式","label":"極大値>k>極小値 の形に持ち込む合図"},{"id":"math1-8","subj":"math","day":1,"theme":"微分の応用","face":"増減表を書くのが面倒な場面","back":"f′ の符号だけ分かればよい。f′ を因数分解して符号を区間ごとに読む","core":"形を揃える","label":"f′ の符号だけ分かればよい"},{"id":"phys1-1","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「なめらかな水平面で衝突」と書いてある","back":"衝突の前後で運動量保存。外力が仕事をしない一瞬の出来事として切り取る","core":"保存する量を探す","label":"衝突の前後で運動量保存"},{"id":"phys1-2","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「なめらかな斜面をのぼる／滑り降りる」","back":"力学的エネルギー保存。高さと速さを交換する","core":"保存する量を探す","label":"力学的エネルギー保存"},{"id":"phys1-3","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「完全弾性衝突（弾性衝突）」と明記","back":"運動量保存＋力学的エネルギー保存の2本立て。反発係数 e=1 でも同じ","core":"保存する量を探す","label":"運動量保存＋力学的エネルギー保存の2本立て"},{"id":"phys1-4","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"「合体した」「くっついて一緒に動く」","back":"完全非弾性。運動量だけが保存し、エネルギーは減る。減った分は熱や変形に","core":"切り替わる瞬間で区切る","label":"完全非弾性"},{"id":"phys1-5","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"粗い面で摩擦がある区間","back":"エネルギー保存は使えない。摩擦の仕事 = −(摩擦力)×(距離) を差し引く","core":"保存する量を探す","label":"エネルギー保存は使えない"},{"id":"phys1-6","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"ばねが絡む運動","back":"弾性エネルギーを含めた力学的エネルギー保存。自然長の位置を基準に","core":"保存する量を探す","label":"弾性エネルギーを含めた力学的エネルギー保存"},{"id":"phys1-7","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"衝突の「直前・直後」だけを聞かれる","back":"その一瞬だけを切り取って運動量保存。他の区間と混ぜない","core":"切り替わる瞬間で区切る","label":"その一瞬だけを切り取って運動量保存"},{"id":"phys1-8","subj":"phys","day":1,"theme":"力学・保存則の選択","face":"2物体が糸や棒でつながっている","back":"一体として運動量やエネルギーを考える。内力は相殺する","core":"保存する量を探す","label":"一体として運動量やエネルギーを考える"},{"id":"math2-1","subj":"math","day":2,"theme":"積分と面積","face":"2曲線で囲まれた面積を求めたい","back":"交点を求めて、その間で (上の式)−(下の式) を積分する","core":"境界で分ける","label":"交点を求めて、その間で (上の式)−(下の式) を積…"},{"id":"math2-2","subj":"math","day":2,"theme":"積分と面積","face":"x軸と曲線で囲まれた面積で、曲線が下に潜る区間がある","back":"符号をそのまま積分しない。区間を割って絶対値を取る","core":"境界で分ける","label":"符号をそのまま積分しない"},{"id":"math2-3","subj":"math","day":2,"theme":"積分と面積","face":"面積の公式 1/6 公式が使える場面","back":"放物線と直線で囲まれ、交点の x が α, β の時だけ。面積=(β−α)³/6","core":"形を揃える","label":"放物線と直線で囲まれ、交点の x が α, β の時…"},{"id":"math2-4","subj":"math","day":2,"theme":"積分と面積","face":"パラメータ入りの面積が○○に等しい、と来た","back":"面積をパラメータの式で表してから方程式を解く。面積は単調なことが多い","core":"前の結果を部品にする","label":"面積をパラメータの式で表してから方程式を解く"},{"id":"math2-5","subj":"math","day":2,"theme":"積分と面積","face":"y を x の関数で表しにくい曲線の面積","back":"x を y の関数として横に積分する（右−左）","core":"図と式を行き来する","label":"x を y の関数として横に積分する（右−左）"},{"id":"math2-6","subj":"math","day":2,"theme":"積分と面積","face":"偶関数・奇関数が対称な区間に出たら","back":"偶関数は半区間の2倍、奇関数は打ち消して 0。計算を半分にする","core":"形を揃える","label":"偶関数は半区間の2倍、奇関数は打ち消して 0"},{"id":"math2-7","subj":"math","day":2,"theme":"積分と面積","face":"面積が最小になる直線の傾きなどを聞かれた","back":"面積を傾きの関数として表し、微分して最小を探す。積分と微分の融合","core":"前の結果を部品にする","label":"面積を傾きの関数として表し、微分して最小を探す"},{"id":"math2-8","subj":"math","day":2,"theme":"積分と面積","face":"回転体の体積の前に面積が要る構成","back":"まず平面図形として面積を確定させてから回転させる。二段構え","core":"切って積む","label":"まず平面図形として面積を確定させてから回転させる"},{"id":"phys2-1","subj":"phys","day":2,"theme":"円運動と単振動","face":"等速円運動で力を聞かれた","back":"向心力 = m v²/r、向きは常に中心。新しい力ではなく合力の名前","core":"図と式を行き来する","label":"向心力 = m v²/r、向きは常に中心"},{"id":"phys2-2","subj":"phys","day":2,"theme":"円運動と単振動","face":"円運動の周期を聞かれた","back":"T=2πr/v。1周の距離 ÷ 速さ、で意味から作れる","core":"形を揃える","label":"T=2πr/v"},{"id":"phys2-3","subj":"phys","day":2,"theme":"円運動と単振動","face":"単振動の周期を聞かれた","back":"T=2π√(m/k)（ばね）または 2π√(l/g)（単振り子）。振幅には依存しない","core":"形を揃える","label":"T=2π√(m/k)（ばね）または 2π√(l/g)…"},{"id":"phys2-4","subj":"phys","day":2,"theme":"円運動と単振動","face":"単振動の最大速度・最大加速度","back":"v_max=Aω、a_max=Aω²。速さは中心で最大、加速度は端で最大","core":"境界で分ける","label":"v_max=Aω、a_max=Aω²"},{"id":"phys2-5","subj":"phys","day":2,"theme":"円運動と単振動","face":"鉛直ばねの単振動","back":"周期は水平ばねと同じ。つり合いの位置が中心になるだけ","core":"切り替わる瞬間で区切る","label":"周期は水平ばねと同じ"},{"id":"phys2-6","subj":"phys","day":2,"theme":"円運動と単振動","face":"円運動する物体の影の運動","back":"影は単振動。A=半径、ω は円運動の角速度と一致","core":"図と式を行き来する","label":"影は単振動"},{"id":"phys2-7","subj":"phys","day":2,"theme":"円運動と単振動","face":"糸がたるむ／面を離れる瞬間","back":"垂直抗力や張力が 0 になる条件で式を立てる。境界の瞬間が答えを決める","core":"切り替わる瞬間で区切る","label":"垂直抗力や張力が 0 になる条件で式を立てる"},{"id":"phys2-8","subj":"phys","day":2,"theme":"円運動と単振動","face":"単振動のエネルギーを聞かれた","back":"(1/2)kA² が全体で一定。位置エネルギーと運動エネルギーが交換する","core":"保存する量を探す","label":"(1/2)kA² が全体で一定"},{"id":"math3-1","subj":"math","day":3,"theme":"積分と体積","face":"回転体の体積を求めたい","back":"回転軸に垂直に切る。断面は円だから断面積は π×(半径)²、あとは積分","core":"切って積む","label":"回転軸に垂直に切る"},{"id":"math3-2","subj":"math","day":3,"theme":"積分と体積","face":"x軸の周りの回転","back":"半径は y そのもの。V=π∫y² dx","core":"切って積む","label":"半径は y そのもの"},{"id":"math3-3","subj":"math","day":3,"theme":"積分と体積","face":"y軸の周りの回転で詰まった","back":"方法は2つ：x を y で表して横向きの円盤にするか、円筒の殻を積む（バウムクーヘン）","core":"図と式を行き来する","label":"方法は2つ：x を y で表して横向きの円盤にするか…"},{"id":"math3-4","subj":"math","day":3,"theme":"積分と体積","face":"2曲線の間 /* 解法カード — 5分モード＋一覧モード。データは CARDS（元サイトのDAYSから機械抽出） */
const LS_KEY = "kaihou-cards-v1";
const SUBJ_NAME = { math: "数学", phys: "物理" };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    return { weak: Array.isArray(s.weak) ? s.weak : [], stats: s.stats || {} };
  } catch (e) { return { weak: [], stats: {} }; }
}
function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadState();

const byId = {};
CARDS.forEach(c => { byId[c.id] = c; });
/* 同じセット（科目×日）のカード群と、正解集合（自分＋同じセットで同じ芯のカード）を機械的に決める */
function setOf(card) { return CARDS.filter(c => c.subj === card.subj && c.day === card.day); }
function correctIds(card) {
  return setOf(card).filter(c => c.id === card.id || c.core === card.core).map(c => c.id);
}

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function fmtTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ============ 5分モード ============ */
let session = null;
function pickSession(subj) {
  const pool = CARDS.filter(c => subj === "all" || c.subj === subj);
  const weak = shuffle(pool.filter(c => state.weak.includes(c.id)));
  const rest = shuffle(pool.filter(c => !state.weak.includes(c.id)));
  return weak.concat(rest).slice(0, 10);
}
function startSession() {
  const subj = document.querySelector("input[name=subj]:checked").value;
  const qs = pickSession(subj);
  session = { qs: qs, idx: 0, correct: 0, missed: [], startAt: Date.now(), timer: null, selected: new Set(), graded: false };
  document.getElementById("homeView").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("quizView").style.display = "";
  document.getElementById("resultView").style.display = "none";
  session.timer = setInterval(tickTimer, 500);
  tickTimer();
  renderQuestion();
}
function tickTimer() {
  if (!session) return;
  const el = Math.floor((Date.now() - session.startAt) / 1000);
  const t = document.getElementById("timer");
  t.textContent = fmtTime(el) + " / 5:00";
  t.classList.toggle("over", el > 300);
}
function currentCard() { return session.qs[session.idx]; }
function renderQuestion() {
  const card = currentCard();
  const corr = correctIds(card);
  session.correctSet = new Set(corr);
  session.selected = new Set();
  session.graded = false;
  document.getElementById("qMeta").innerHTML =
    '<span class="chip">' + esc(SUBJ_NAME[card.subj]) + " Day" + card.day + "：" + esc(card.theme) + "</span>" +
    (corr.length > 1 ? '<span class="chip chip-blue">複数選択（当てはまるものを全部）</span>' : '<span class="chip chip-blue">1枚選択</span>') +
    (state.weak.includes(card.id) ? '<span class="chip chip-weak">苦手プール</span>' : "");
  document.getElementById("qFace").textContent = card.face;
  document.getElementById("qCount").textContent = (session.idx + 1) + " / " + session.qs.length + "問";
  document.getElementById("dots").innerHTML = session.qs.map(function (_, i) {
    return '<span class="dot' + (i < session.idx ? " done" : (i === session.idx ? " now" : "")) + '"></span>';
  }).join("");
  const opts = shuffle(setOf(card));
  document.getElementById("options").innerHTML = opts.map(function (c) {
    return '<button type="button" class="opt" data-id="' + c.id + '" onclick="toggleOpt(this)">' + esc(c.label) + "</button>";
  }).join("");
  document.getElementById("feedback").style.display = "none";
  document.getElementById("gradeBtn").style.display = "";
  document.getElementById("gradeBtn").disabled = true;
  document.getElementById("nextBtn").style.display = "none";
}
function toggleOpt(btn) {
  if (!session || session.graded) return;
  const id = btn.getAttribute("data-id");
  if (session.selected.has(id)) { session.selected.delete(id); btn.classList.remove("sel"); }
  else { session.selected.add(id); btn.classList.add("sel"); }
  document.getElementById("gradeBtn").disabled = session.selected.size === 0;
}
function grade() {
  if (!session || session.graded || session.selected.size === 0) return;
  session.graded = true;
  const card = currentCard();
  const corr = session.correctSet, sel = session.selected;
  let exact = sel.size === corr.size;
  if (exact) { corr.forEach(id => { if (!sel.has(id)) exact = false; }); }
  document.querySelectorAll("#options .opt").forEach(function (btn) {
    const id = btn.getAttribute("data-id");
    const isC = corr.has(id), isS = sel.has(id);
    btn.disabled = true;
    if (isC && isS) btn.classList.add("hit");
    else if (!isC && isS) btn.classList.add("wrongpick");
    else if (isC && !isS) btn.classList.add("missed");
    if (isC) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "正解"; btn.appendChild(tag); }
  });
  const st = state.stats[card.id] || { seen: 0, ok: 0 };
  st.seen++;
  if (exact) {
    st.ok++;
    session.correct++;
    state.weak = state.weak.filter(id => id !== card.id);
  } else {
    session.missed.push(card);
    if (!state.weak.includes(card.id)) state.weak.push(card.id);
  }
  state.stats[card.id] = st;
  saveState();
  const fb = document.getElementById("feedback");
  const correctLabels = [...corr].map(id => byId[id].label);
  fb.className = "feedback " + (exact ? "ok" : "ng");
  fb.innerHTML =
    "<strong>" + (exact ? "正解！" : (sel.size && [...sel].some(id => corr.has(id)) ? "部分正解（あと少し）" : "不正解")) + "</strong>" +
    '<div class="fb-back">' + esc(card.back) + "</div>" +
    '<div class="fb-core">芯：<b>' + esc(card.core) + "</b>" +
    (corr.size > 1 ? " ― この状況では、同じ芯「" + esc(card.core) + "」のカードも正解です" : "") + "</div>" +
    '<div class="fb-list">正解のカード：' + correctLabels.map(esc).join(" ／ ") + "</div>";
  fb.style.display = "";
  document.getElementById("gradeBtn").style.display = "none";
  const nb = document.getElementById("nextBtn");
  nb.textContent = session.idx + 1 >= session.qs.length ? "結果を見る" : "次の問題へ";
  nb.style.display = "";
}
function nextQuestion() {
  session.idx++;
  if (session.idx >= session.qs.length) { showResult(); return; }
  renderQuestion();
}
function showResult() {
  clearInterval(session.timer);
  const elapsed = Math.floor((Date.now() - session.startAt) / 1000);
  document.getElementById("quizView").style.display = "none";
  const rv = document.getElementById("resultView");
  rv.style.display = "";
  document.getElementById("resultScore").textContent = session.correct + " / " + session.qs.length + " 正解";
  document.getElementById("resultTime").textContent = "かかった時間 " + fmtTime(elapsed) + "（目安5分）";
  const ml = document.getElementById("missedList");
  if (session.missed.length === 0) {
    ml.innerHTML = '<p class="muted">間違えたカードはありませんでした。</p>';
  } else {
    ml.innerHTML = "<h3>間違えたカード（苦手プール入り）</h3>" + session.missed.map(function (c) {
      return '<div class="missed-item"><div class="m-face">' + esc(c.face) + '</div><div class="m-back">' + esc(c.back) + "（芯：" + esc(c.core) + "）</div></div>";
    }).join("");
  }
  session = null;
}
function quitToHome() {
  if (session && session.timer) clearInterval(session.timer);
  session = null;
  document.getElementById("quizView").style.display = "none";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("homeView").style.display = "";
  renderHomeStats();
}
function renderHomeStats() {
  const el = document.getElementById("homeStats");
  const seen = Object.keys(state.stats).length;
  el.textContent = "苦手プール " + state.weak.length + "枚 ／ これまで出題 " + seen + "枚（全" + CARDS.length + "枚）";
}

/* ============ 一覧モード ============ */
function showList() {
  if (session && session.timer) clearInterval(session.timer);
  session = null;
  document.getElementById("homeView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("listView").style.display = "";
  renderList();
}
function fillFilters() {
  const subj = document.getElementById("fSubj").value;
  const themeSel = document.getElementById("fTheme");
  const coreSel = document.getElementById("fCore");
  const themes = [...new Set(CARDS.filter(c => subj === "all" || c.subj === subj).map(c => c.theme))];
  const cores = [...new Set(CARDS.map(c => c.core))];
  const curT = themeSel.value, curC = coreSel.value;
  themeSel.innerHTML = '<option value="all">分野：すべて</option>' + themes.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
  coreSel.innerHTML = '<option value="all">芯：すべて</option>' + cores.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
  if (themes.includes(curT)) themeSel.value = curT;
  if (cores.includes(curC)) coreSel.value = curC;
}
function renderList() {
  fillFilters();
  const subj = document.getElementById("fSubj").value;
  const theme = document.getElementById("fTheme").value;
  const core = document.getElementById("fCore").value;
  const weakOnly = document.getElementById("fWeak").checked;
  const list = CARDS.filter(c =>
    (subj === "all" || c.subj === subj) &&
    (theme === "all" || c.theme === theme) &&
    (core === "all" || c.core === core) &&
    (!weakOnly || state.weak.includes(c.id)));
  document.getElementById("listCount").textContent = list.length + "枚";
  document.getElementById("listGrid").innerHTML = list.map(function (c) {
    return '<div class="lcard" data-id="' + c.id + '" onclick="flipCard(this)">' +
      '<div class="l-meta">' + esc(SUBJ_NAME[c.subj]) + " Day" + c.day + "：" + esc(c.theme) +
      (state.weak.includes(c.id) ? ' <span class="chip chip-weak">苦手</span>' : "") + "</div>" +
      '<div class="l-face">' + esc(c.face) + "</div>" +
      '<div class="l-back" style="display:none">' + esc(c.back) + '<div class="l-core">芯：' + esc(c.core) + "</div></div>" +
      '<div class="l-hint">タップで解法を表示／隠す</div></div>';
  }).join("") || '<p class="muted">該当するカードがありません。</p>';
}
function flipCard(el) {
  const b = el.querySelector(".l-back");
  b.style.display = b.style.display === "none" ? "" : "none";
}

renderHomeStats();

</script>
</body>
