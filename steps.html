<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ステップ演習｜解法カード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #ffffff; color: #1e293b; line-height: 1.7;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; padding: 18px 0 8px; }
  header h1 { font-size: 26px; font-weight: 700; color: #0369a1; letter-spacing: .04em; }
  header p { font-size: 13px; color: #64748b; margin-top: 4px; }
  .card-panel {
    background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 16px;
    padding: 20px; margin-top: 18px;
  }
  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: #0284c7; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: #0369a1; }
  .btn:disabled { background: #cbd5e1; cursor: default; }
  .btn.sub { background: #fff; color: #0284c7; border: 1px solid #7dd3fc; margin-top: 10px; }
  .btn.sub:hover { background: #e0f2fe; }
  .muted { color: #64748b; font-size: 14px; text-align: center; padding: 12px; }
  .back-link { display: inline-block; margin-top: 14px; color: #0284c7; font-size: 14px; cursor: pointer; background: none; border: none; padding: 0; }

  /* 大問一覧 */
  .group-title { font-size: 15px; color: #0369a1; font-weight: 700; margin: 22px 0 4px; }
  .boss-item {
    display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #e0f2fe;
    border-left: 5px solid #0284c7; border-radius: 12px; padding: 14px 16px; margin-top: 10px; cursor: pointer;
  }
  .boss-item:hover { border-color: #7dd3fc; border-left-color: #0284c7; }
  .boss-item .b-theme { font-size: 12px; color: #0284c7; }
  .boss-item .b-title { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .boss-item .b-meta { font-size: 12px; color: #64748b; margin-top: 4px; }
  .chip {
    display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #e0f2fe; color: #0369a1;
  }
  .chip-blue { background: #dbeafe; color: #1d4ed8; }
  .chip-clear { background: #dcfce7; color: #15803d; }

  /* 演習画面：問題ヘッダー固定 */
  .sticky-head {
    position: sticky; top: 0; z-index: 20; background: #fff;
    border-bottom: 2px solid #bae6fd; padding: 10px 0 12px; margin-bottom: 14px;
  }
  .sticky-head .p-title { font-size: 16px; font-weight: 700; color: #0369a1; }
  .sticky-head .p-setup { font-size: 14.5px; margin-top: 4px; }
  .sticky-head details { margin-top: 6px; }
  .sticky-head summary { font-size: 13px; color: #0284c7; cursor: pointer; }
  .sticky-head figure { margin: 6px 0 0; background: #fff; border: 1px solid #e0f2fe; border-radius: 12px; padding: 10px; }
  .sticky-head figcaption { font-size: 12.5px; color: #64748b; margin-top: 6px; }
  .c1 { color: #dc2626; font-weight: 700; } .c2 { color: #1d4ed8; font-weight: 700; } .c3 { color: #15803d; font-weight: 700; }
  .play-top { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 15px; color: #0369a1; font-weight: 600; }
  .qcount { font-size: 13px; color: #64748b; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 10px 0 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e2e8f0; }
  .dot.done { background: #38bdf8; }
  .dot.now { background: #0284c7; transform: scale(1.25); }

  /* ステップ */
  .stepq {
    font-size: 18px; font-weight: 600; background: #fff; border: 1px solid #e0f2fe;
    border-left: 5px solid #0284c7; border-radius: 12px; padding: 16px 18px; margin: 10px 0 14px;
  }
  .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .options { grid-template-columns: 1fr 1fr; } }
  .opt {
    position: relative; text-align: left; padding: 14px 16px; font-size: 15px; line-height: 1.55;
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; color: #1e293b;
  }
  .opt:hover { border-color: #7dd3fc; }
  .opt.sel { border-color: #0284c7; background: #e0f2fe; }
  .opt.hit { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrongpick { border-color: #dc2626; background: #fef2f2; }
  .opt:disabled { cursor: default; }
  .actions { margin-top: 18px; }
  .feedback { border-radius: 12px; padding: 16px 18px; margin-top: 18px; font-size: 15px; }
  .feedback.ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .feedback.ng { background: #fff7ed; border: 1px solid #fed7aa; }
  .feedback.hint { background: #f0f9ff; border: 1px solid #bae6fd; }
  .fb-ans { font-weight: 700; margin-top: 6px; }
  .fb-expl { margin-top: 8px; }
  .fb-card { margin-top: 10px; font-size: 14px; color: #475569; border-top: 1px dashed #bae6fd; padding-top: 8px; }

  /* 通過済みステップ・振り返り */
  .review-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .review-item .r-q { font-weight: 600; font-size: 15px; cursor: pointer; }
  .review-item .r-a { font-size: 14px; font-weight: 700; color: #15803d; margin-top: 4px; }
  .review-item .r-e { font-size: 14px; color: #334155; margin-top: 6px; border-top: 1px dashed #bae6fd; padding-top: 8px; }
  .review-item .r-miss { font-size: 12px; color: #b91c1c; }
  #clearedBox h3, #clearView h3 { font-size: 15px; color: #334155; margin-top: 20px; }

  /* クリア画面 */
  .result-score { font-size: 32px; font-weight: 700; color: #0369a1; text-align: center; margin-top: 10px; }
  .result-time { text-align: center; color: #64748b; font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ステップ演習</h1>
    <p>大問を1題、使う解法を選びながら最後まで解き切る練習</p>
  </header>

  <!-- 大問一覧 -->
  <div id="listView">
    <div id="bossList"></div>
    <a class="back-link" href="cards.html">← 解法カードへ戻る</a>
  </div>

  <!-- 演習 -->
  <div id="playView" style="display:none">
    <div class="sticky-head">
      <div>
        <span class="chip" id="pMeta"></span>
        <span class="chip chip-blue" id="pCore"></span>
      </div>
      <div class="p-title" id="pTitle"></div>
      <div class="p-setup" id="pSetup"></div>
      <details id="figDetails" open>
        <summary>図を見る／閉じる</summary>
        <figure><div id="pFig"></div><figcaption id="pFigcap"></figcaption></figure>
      </details>
      <div class="play-top">
        <span class="qcount" id="pCount"></span>
        <span class="qcount" id="pMiss"></span>
        <span class="timer" id="pTimer">0:00</span>
      </div>
      <div class="dots" id="pDots"></div>
    </div>

    <div id="clearedBox" style="display:none">
      <h3>通過したステップ</h3>
      <div id="clearedList"></div>
    </div>

    <div id="stepBox">
      <div class="stepq" id="sQ"></div>
      <div class="options" id="sOptions"></div>
      <div class="feedback hint" id="sHint" style="display:none"></div>
      <div class="feedback" id="sFeedback" style="display:none"></div>
      <div class="actions">
        <button class="btn" id="decideBtn" onclick="decide()" disabled>決定</button>
        <button class="btn" id="nextBtn" onclick="nextStep()" style="display:none">次のステップへ</button>
        <button class="btn" id="finishBtn" onclick="finishRun()" style="display:none">結果を見る</button>
        <button class="back-link" onclick="quitToList()">やめて一覧へ戻る</button>
      </div>
    </div>
  </div>

  <!-- クリア -->
  <div id="clearView" style="display:none">
    <div class="result-score">クリア！</div>
    <div class="result-time" id="clearStats"></div>
    <div id="finaleBox"></div>
    <h3>全ステップの振り返り</h3>
    <div id="reviewList"></div>
    <div class="actions">
      <button class="btn" onclick="quitToList()">大問一覧へ戻る</button>
      <button class="btn sub" id="retryBtn">もう一度この大問を解く</button>
    </div>
  </div>

  <!-- 仕上げ問題 -->
  <div id="finaleView" style="display:none">
    <div>
      <span class="chip" id="fMeta"></span>
      <span class="chip chip-blue">仕上げ問題</span>
    </div>
    <div class="stepq" id="fQ" style="margin-top:12px"></div>
    <div id="fThinkBox">
      <p class="muted">選択肢はないよ。頭の中で「どの解法カードを使うか」と解き方を思い浮かべてみよう。</p>
      <div class="actions">
        <button class="btn" onclick="thinkFinale('got')">出来た（解法が思いついた）</button>
        <button class="btn sub" onclick="thinkFinale('unknown')">分からない</button>
      </div>
    </div>
    <div id="fRevealBox" style="display:none">
      <div class="feedback ok">
        <div style="font-weight:700">使うカード</div>
        <div id="fCards"></div>
        <div style="font-weight:700;margin-top:12px">解法の流れ</div>
        <div class="fb-expl" id="fFlow"></div>
        <div class="fb-ans" id="fAns"></div>
      </div>
      <p class="muted">自分の考えと比べてどうだった？</p>
      <div class="actions">
        <button class="btn" onclick="judgeFinale('match')">合ってた</button>
        <button class="btn sub" onclick="judgeFinale('diff')">違ってた</button>
      </div>
    </div>
    <div class="actions">
      <button class="back-link" onclick="backToClear()">← クリア画面へ戻る</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 図（元サイト index.html から verbatim 転載） ============ */
const FIG = {
m1(){return plot({xr:[-2.6,2.6],yr:[-3.4,3.4],funcs:[{f:v=>v**3-3*v,color:"#dc2626"}],hlines:[[2,"#1d4ed8","y=2 (極大)"],[-2,"#15803d","y=-2 (極小)"]],points:[[-1,2,"#1d4ed8","極大 2",8,-8],[1,-2,"#15803d","極小 -2",8,16]],ticks:[[-1,0,"-1"],[1,0,"1"]]});},
m2(){return plot({xr:[-2.2,3.4],yr:[-1.5,10.5],funcs:[{f:v=>v*v,color:"#dc2626"},{f:v=>v+2,color:"#1d4ed8"}],shade:{f:v=>v+2,g:v=>v*v,from:-1,to:2,color:"#f59e0b"},points:[[-1,1,"#374151","(-1,1)",-52,0],[2,4,"#374151","(2,4)",10,-6]]});},
m3(){return plot({xr:[-0.4,4.6],yr:[-0.6,2.6],funcs:[{f:v=>Math.sqrt(Math.max(v,0)),color:"#dc2626"}],shade:{f:v=>Math.sqrt(Math.max(v,0)),from:0,to:4,color:"#3b82f6"},points:[[4,2,"#1d4ed8","(4,2)",8,-4]],ticks:[[4,0,"4"]]});},
m4(){let pts=[];for(let nn=1;nn<=8;nn++)pts.push([nn,2-Math.pow(0.5,nn-1),"#dc2626",nn===1?"a₁=1":"",8,-8]);
  return plot({xr:[0,9],yr:[0,2.6],funcs:[],hlines:[[2,"#1d4ed8","y=2 (極限)"]],points:pts});},
m5(){const s3=Math.sqrt(3);return plot({xr:[-2.4,3.2],yr:[-1.6,3.4],funcs:[],points:[[0,0,"#374151","O",-16,14],[2,0,"#dc2626","B=2",8,16],[1,s3,"#1d4ed8","γ=1+√3 i",8,-8],[2,1,"#9ca3af","2+i",8,-4],[-1,2,"#15803d","-1+2i",8,-6]],arrows:[[2,1,-1,2,"#15803d","×i (90°回転)"]]});},
m6(){let d="";const N=160;for(let i=0;i<=N;i++){const tt=i/N*2*Math.PI;const vx=tt-Math.sin(tt),vy=1-Math.cos(tt);d+=(i?"L":"M")+(42+vx/6.6*450).toFixed(1)+","+(300-vy/2.4*260).toFixed(1)+" ";}
  let s=`<svg viewBox="0 0 520 340" width="100%"><line x1="30" y1="300" x2="505" y2="300" stroke="#9ca3af"/><path d="${d}" fill="none" stroke="#dc2626" stroke-width="2.4"/>`;
  const px=v=>42+v/6.6*450, py=v=>300-v/2.4*260;
  s+=`<circle cx="${px(Math.PI/2-1)}" cy="${py(1)}" r="4.5" fill="#1d4ed8"/><text x="${px(Math.PI/2-1)+8}" y="${py(1)-8}" font-size="13" fill="#1d4ed8" font-weight="700">t=π/2 (π/2−1, 1)</text>`;
  s+=`<circle cx="${px(Math.PI)}" cy="${py(2)}" r="4.5" fill="#15803d"/><text x="${px(Math.PI)+8}" y="${py(2)-8}" font-size="13" fill="#15803d" font-weight="700">頂点 (π, 2)</text></svg>`;return s;},
m7(){return plot({xr:[-0.3,5],yr:[-0.08,0.45],funcs:[{f:v=>v*Math.exp(-v),color:"#dc2626"}],shade:{f:v=>v*Math.exp(-v),from:0,to:1,color:"#f59e0b"},points:[[1,Math.exp(-1),"#1d4ed8","最大 1/e (x=1)",8,-8]]});},
p1(){return `<svg viewBox="0 0 520 300" width="100%">
<line x1="20" y1="200" x2="330" y2="200" stroke="#374151" stroke-width="2"/>
<circle cx="90" cy="182" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="70" y="150" font-size="13" fill="#1d4ed8" font-weight="700">A 1kg</text>
<line x1="112" y1="182" x2="168" y2="182" stroke="#dc2626" stroke-width="3" marker-end="url(#ah2)"/><text x="118" y="168" font-size="13" fill="#dc2626" font-weight="700">6 m/s</text>
<circle cx="250" cy="182" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="228" y="150" font-size="13" fill="#dc2626" font-weight="700">B 2kg 静止</text>
<polygon points="330,200 500,110 500,200" fill="#f3f4f6" stroke="#374151"/><text x="392" y="140" font-size="13" fill="#374151" font-weight="700">なめらかな斜面</text>
<text x="30" y="245" font-size="13" fill="#6b7280">衝突後は B が右へ 4 m/s で進み、斜面をのぼる</text>
<defs><marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker></defs></svg>`;},
p2(){let d="";for(let i=0;i<=140;i++){const tt=i/140*4*Math.PI;d+=(i?"L":"M")+(285+tt/(4*Math.PI)*220).toFixed(1)+","+(90-Math.cos(tt)*55).toFixed(1)+" ";}
 return `<svg viewBox="0 0 520 300" width="100%">
<circle cx="130" cy="140" r="80" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
<circle cx="130" cy="140" r="4" fill="#374151"/><line x1="130" y1="140" x2="210" y2="140" stroke="#374151"/>
<circle cx="210" cy="140" r="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<line x1="210" y1="140" x2="210" y2="98" stroke="#dc2626" stroke-width="3" marker-end="url(#ah3)"/><text x="218" y="105" font-size="13" fill="#dc2626" font-weight="700">v=4</text>
<text x="118" y="250" font-size="13" fill="#374151">r=2 m の円運動</text>

p3(){return plot({xr:[0,5],yr:[0,4],funcs:[],points:[[2,1,"#374151","A (2,1)",8,16],[2,3,"#dc2626","B (2,3)",8,-6],[4,3,"#1d4ed8","C (4,3)",8,-6],[4,1,"#15803d","D (4,1)",8,16]],shade:{f:()=>3,g:()=>1,from:2,to:4,color:"#f59e0b"}}).replace('>x<','>V [10⁻³m³]<').replace(/y<\/text>/,'p [10⁵Pa]<\/text>');},
p4(){return `<svg viewBox="0 0 520 300" width="100%">

p5(){let s=`<svg viewBox="0 0 520 300" width="100%">`;
 for(let gx=70;gx<470;gx+=44)for(let gy=60;gy<180;gy+=40)s+=`<text x="${gx}" y="${gy}" font-size="15" fill="#93c5fd">×</text>`;

<line x1="440" y1="60" x2="440" y2="240" stroke="#374151" stroke-width="3"/><text x="398" y="50" font-size="12.5" fill="#374151">スクリーン（1m 先）</text>`;
 for(let mm=-3;mm<=3;mm++){s+=`<circle cx="440" cy="${150+mm*22}" r="5" fill="${mm===0?"#dc2626":"#f59e0b"}"/>`;}
 s+=`<text x="452" y="140" font-size="12.5" fill="#dc2626" font-weight="700">明線間隔 3mm</text></svg>`;return s;},
p7(){return `<svg viewBox="0 0 520 300" width="100%">

ネルギーも保存していることを確認せよ","a":"前 18 J = 後 18 J","e":"前は (1/2)×1×36=18。後は (1/2)×1×4+(1/2)×2×16=2+16=18。弾性衝突の証拠。","correct":[2]},{"q":"(4) B が斜面をのぼる最高点の高さを求めよ","a":"0.8 m","e":"エネルギー保存 (1/2)mv²=mgh より h=v²/(2g)=16/20=0.8。質量は消えるのがポイント。","correct":[1]},{"q":"(5)【苦手どん】衝突が完全非弾性（合体）だったら、合体後の速度、失われるエネルギー、のぼる高さはどう変わるか","a":"合体速度 2 m/s、失うエネルギー 12 J、のぼる高さ 0.2 m","e":"運動量保存だけが使える：6=(1+2)v より v=2。エネルギーは前 18J → 後 (1/2)×3×4=6J で 12J 失う。高さは 2²/20=0.2 m。衝突の種類で使える式が変わるのが核心。","correct":[3]}],"finale":{"q":"なめらかな水平面で、質量2kgの球Aが 4 m/s で進み、静止している質量2kgの球Bに完全弾性衝突した。衝突直後のAとBの速度を求めよ。また、Bがその後なめらかな斜面をのぼる最高点の高さを求めよ（g=10 m/s²）。","cards":[2,1],"flow":"完全弾性衝突だから運動量保存と力学的エネルギー保存の2本立て。公式 v₁′=(m₁−m₂)/(m₁+m₂)·v、v₂′=2m₁/(m₁+m₂)·v に m₁=m₂=2 を入れると、v₁′=0、v₂′=4 で、質量が等しい弾性衝突では速度が入れ替わる。斜面ののぼりは力学的エネルギー保存 (1/2)mv²=mgh より h=v²/(2g)=16/20=0.8 m。","a":"A は 0 m/s（静止）、B は 4 m/s、最高点の高さ 0.8 m","claims":["v₂′=4","h=v²/(2g)=16/20=0.8"]}},{"id":"math-2","subj":"math","day":2,"theme":"積分と面積","core":"境界で分ける","fig":"m2","figcap":"放物線 y=x² と直線 y=x+2。交点 x=−1, 2 の間だけ、直線が上にある。色のついた部分が求める面積。","title":"放物線と直線で囲まれた世界","setup":"<span class='c1'>放物線 y=x²<\/span> と <span class='c2'>直線 y=x+2<\/span> を軸に、面積の基本から絶対値のどんまで進む。","cards":[{"face":"2曲線で囲まれた面積を求めたい","back":"交点を求めて、その間で (上の式)−(下の式) を積分する","core":"境界で分ける","label":"交点を求めて、その間で (上の式)−(下の式) を積分する"},{"face":"x軸と曲線で囲まれた面積で、曲線が下に潜る区間がある","back":"符号をそのまま積分しない。区間を割って絶対値を取る","core":"境界で分ける","label":"符号をそのまま積分しない"},{"face":"面積の公式 1/6 公式が使える場面","back":"放物線と直線で囲まれ、交点の x が α, β の時だけ。面積=(β−α)³/6","core":"形を揃える","label":"放物線と直線で囲まれ、交点の x が α, β の時だけ"},{"face":"パラメータ入りの面積が○○に等しい、と来た","back":"面積をパラメータの式で表してから方程式を解く。面積は単調なことが多い","core":"前の結果を部品にする","label":"面積をパラメータの式で表してから方程式を解く"},{"face":"y を x の関数で表しにくい曲線の面積","back":"x を y の関数として横に積分する（右−左）","core":"図と式を行き来する","label":"x を y の関数として横に積分する（右−左）"},{"face":"偶関数・奇関数が対称な区間に出たら","back":"偶関数は半区間の2倍、奇関数は打ち消して 0。計算を半分にする","core":"形を揃える","label":"偶関数は半区間の2倍、奇関数は打ち消して 0"},{"face":"面積が最小になる直線の傾きなどを聞かれた","back":"面積を傾きの関数として表し、微分して最小を探す。積分と微分の融合","core":"前の結果を部品にする","label":"面積を傾きの関数として表し、微分して最小を探す"},{"face":"回転体の体積の前に面積が要る構成","back":"まず平面図形として面積を確定させてから回転させる。二段構え","core":"切って積む","label":"まず平面図形として面積を確定させてから回転させる"}],"steps":[{"q":"(1) 放物線と直線の交点の座標を求めよ","a":"(−1, 1) と (2, 4)","e":"x²=x+2 を解くと x²−x−2=(x−2)(x+1)=0。交点の x が積分区間の端になる。","correct":[0]},{"q":"(2) 2曲線で囲まれた部分の面積を求めよ","a":"9/2","e":"区間 [−1,2] で直線が上。∫(x+2−x²)dx = [x²/2+2x−x³/3] で 9/2。1/6 公式 (2−(−1))³/6=27/6=9/2 でも一致。","correct":[0,2]},{"q":"(3) 放物線 y=x² と x軸、および直線 x=2 で囲まれた部分の面積を求めよ","a":"8/3","e":"∫₀² x² dx = 8/3。(2) と違い「下」が x軸 (y=0) になるだけ。上の式−下の式の形は同じ。","correct":[0]},{"q":"(4) 放物線 y=x² と直線 y=mx (m>0) で囲まれた部分の面積が 36 の時、m を求めよ","a":"m=6","e":"交点は x=0, m。面積は ∫₀ᵐ(mx−x²)dx=m³/6。これが 36 だから m³=216、m=6。面積を文字のまま表すのが先。","correct":[3]},{"q":"(5)【苦手どん】∫₋₂² |x²−1| dx を求めよ","a":"4","e":"|中身| の符号は x=±1 で入れ替わる。区間を [−2,−1],[−1,1],[1,2] に割る。対称性で右半分 [0,2] の2倍：2×{∫₀¹(1−x²)dx+∫₁²(x²−1)dx}=2×(2/3+4/3)=4。","correct":[1,5]}],"finale":{"q":"放物線 y=x² と直線 y=2x+3 の交点の座標と、2曲線で囲まれた部分の面積を求めよ。","cards":[0,2],"flow":"交点は x²=2x+3、つまり x²−2x−3=(x−3)(x+1)=0 から x=−1, 3。区間 [−1,3] では直線が上だから、面積は ∫₋₁³ (2x+3−x²) dx = 32/3。1/6 公式 (3−(−1))³/6=64/6=32/3 でも一致する。","a":"交点 (−1, 1) と (3, 9)、面積 32/3","claims":["面積は ∫₋₁³ (2x+3−x²) dx = 32/3","面積 32/3"]}},{"id":"phys-2","subj":"phys","day":2,"theme":"円運動と単振動","core":"切り替わる瞬間で区切る","fig":"p2","figcap":"左：等速円運動（速度は接線方向、加速度は中心向き）。右：単振動の x−t グラフ。円運動の影が単振動になる。","title":"円運動から単振動へ（g=10 m/s²）","setup":"<span class='c2'>質量1kgの物体<\/span>が<span class='c1'>半径2mの円周上を速さ4 m/s<\/span>で等速円運動している。後半はこの物体を<span class='c3'>ばね定数100 N/mのばね<\/span>につけた単振動に切り替える。","cards":[{"face":"等速円運動で力を聞かれた","back":"向心力 = m v²/r、向きは常に中心。新しい力ではなく合力の名前","core":"図と式を行き来する","label":"向心力 = m v²/r、向きは常に中心"},{"face":"円運動の周期を聞かれた","back":"T=2πr/v。1周の距離 ÷ 速さ、で意味から作れる","core":"形を揃える","label":"T=2πr/v"},{"face":"単振動の周期を聞かれた","back":"T=2π√(m/k)（ばね）または 2π√(l/g)（単振り子）。振幅には依存しない","core":"形を揃える","label":"T=2π√(m/k)（ばね）または 2π√(l/g)（単振り子）"},{"face":"単振動の最大速度・最大加速度","back":"v_max=Aω、a_max=Aω²。速さは中心で最大、加速度は端で最大","core":"境界で分ける","label":"v_max=Aω、a_max=Aω²"},{"face":"鉛直ばねの単振動","back":"周期は水平ばねと同じ。つり合いの位置が中心になるだけ","core":"切り替わる瞬間で区切る","label":"周期は水平ばねと同じ"},{"face":"円運動する物体の影の運動","back":"影は単振動。A=半径、ω は円運動の角速度と一致","core":"図と式を行き来する","label":"影は単振動"},{"face":"糸がたるむ／面を離れる瞬間","back":"垂直抗力や張力が 0 になる条件で式を立てる。境界の瞬間が答えを決める","core":"切り替わる瞬間で区切る","label":"垂直抗力や張力が 0 になる条件で式を立てる"},{"face":"単振動のエネルギーを聞かれた","back":"(1/2)kA² が全体で一定。位置エネルギーと運動エネルギーが交換する","core":"保存する量を探す","label":"(1/2)kA² が全体で一定"}],"steps":[{"q":"(1) 円運動の向心加速度と向心力の大きさを求めよ","a":"加速度 8 m/s²、向心力 8 N","e":"a=v²/r=16/2=8、F=ma=8。向きは常時中心向き。","correct":[0]},{"q":"(2) 円運動の周期を求めよ","a":"π 秒（約3.14秒）","e":"T=2πr/v=2π×2/4=π。","correct":[1]},{"q":"(3) ばねにつけた単振動の角振動数と周期を求めよ","a":"ω=10 rad/s、周期 π/5 秒","e":"ω=√(k/m)=√100=10。T=2π/ω=π/5。","correct":[2]},{"q":"(4) 振幅0.20 m の単振動での最大速度と最大加速度を求めよ","a":"最大速度 2 m/s、最大加速度 20 m/s²","e":"v_max=Aω=0.2×10=2、a_max=Aω²=0.2×100=20。","correct":[3]},{"q":"(5)【苦手どん】ばねを鉛直につるして物体を静止させた後、つり合いの位置からさらに0.30 m 引いて静かに離した。振幅、周期、最大速度はどうなるか","a":"振幅 0.30 m、周期 π/5 秒（不変）、最大速度 3 m/s","e":"まず自然長からの伸びは mg/k=10/100=0.10 m で、これが新しい中心（つり合い位置）。振幅は「中心からどれだけ引いたか」の 0.30 m。周期は鉛直でも変わらない。v_max=0.3×10=3。","correct":[4,3]}],"finale":{"q":"質量0.5kgの物体が、半径1mの円周上を速さ3 m/sで等速円運動している。向心加速度と向心力の大きさ、円運動の周期を求めよ。また、この物体をばね定数50 N/mのばねにつけた単振動の周期を求めよ。","cards":[0,1,2],"flow":"向心加速度は a=v²/r=9/1=9 m/s²、向心力は F=ma=0.5×9=4.5 N。円運動の周期は T=2πr/v=2π/3 秒。単振動は ω=√(k/m)=√(50/0.5)=10 だから、周期は T=2π/ω=π/5 秒。","a":"向心加速度 9 m/s²、向心力 4.5 N、円運動の周期 2π/3 秒、単振動の周期 π/5 秒","claims":["a=v²/r=9/1=9","F=ma=0.5×9=4.5","T=2π/ω=π/5"]}},{"id":"phys-3","subj":"phys","day":3,"theme":"熱力学","core":"グラフの面積と傾きを読む","fig":"p3","figcap":"p−V グラフ上の矩形サイクル A→B→C→D→A。色つき矩形の面積が、サイクル全体で気体がする仕事に等しい。","title":"矩形サイクルを読む（単原子分子理想気体）","setup":"気体が図の矩形サイクル A(2,1) → B(2,3) → C(4,3) → D(4,1) → A を回る。座標は V [10⁻³ m³]、p [10⁵ Pa]。単原子分子理想気体として C<sub>V<\/sub>=3R/2 を使う。","cards":[{"face":"p−V グラフで仕事を聞かれた","back":"仕事はグラフと V 軸の間の面積。膨張なら＋、圧縮なら−","core":"グラフの面積と傾きを読む","label":"仕事はグラフと V 軸の間の面積"},{"face":"定積変化（V 一定）が出たら","back":"仕事は 0。内部エネルギーの変化がそのまま熱になる","core":"グラフの面積と傾きを読む","label":"仕事は 0"},{"face":"定圧変化の仕事","back":"W=pΔV。長方形の面積として読める","core":"グラフの面積と傾きを読む","label":"W=pΔV"},{"face":"サイクル（1周して戻る過程）","back":"正味の仕事はサイクルが囲む面積。時計回りなら正の仕事をする","core":"グラフの面積と傾きを読む","label":"正味の仕事はサイクルが囲む面積"},{"face":"温度の大小を比べたい","back":"pV の積が温度に比例（pV=nRT）。等温線は双曲線","core":"グラフの面積と傾きを読む","label":"pV の積が温度に比例（pV=nRT）"},{"face":"断熱変化が出たら","back":"Q=0。熱の出入りなしで内部エネルギーと仕事だけが交換する","core":"保存する量を探す","label":"Q=0"},{"face":"熱効率を聞かれた","back":"効率 = (正味の仕事)/(吸収した熱)。放出した熱は分母に入れない","core":"境界で分ける","label":"効率 = (正味の仕事)/(吸収した熱)"},{"face":"内部エネルギーの変化","back":"ΔU は経路によらず最初と最後の温度だけで決まる（状態量）","core":"保存する量を探す","label":"ΔU は経路によらず最初と最後の温度だけで決まる（状態量）"}],"steps":[{"q":"(1) A→B（定積加熱）で気体がする仕事を求めよ","a":"0 J","e":"V が変わらないので仕事は 0。グラフでは縦の辺＝面積なし。","correct":[1]},{"q":"(2) B→C（定圧膨張）で気体がする仕事を求めよ","a":"600 J","e":"W=pΔV=3×10⁵ × (4−2)×10⁻³ = 600 J。","correct":[2]},{"q":"(3) サイクル全体で気体がする正味の仕事を求めよ","a":"400 J","e":"C→D は 0、D→A は −1×10⁵×2×10⁻³=−200 J。合計 600−200=400 J。囲まれた矩形の面積 (2×10⁵)×(2×10⁻³)=400 J と一致する。","correct":[3]},{"q":"(4) 状態 C の温度は状態 A の温度の何倍か","a":"6 倍","e":"T は pV に比例。A は 1×2=2、C は 3×4=12。比は 6。","correct":[4]},{"q":"(5)【苦手どん】このサイクルの熱効率を求めよ","a":"4/21（約19%）","e":"吸熱は温度が上がる A→B と B→C。ΔU(AB)=(3/2)(p_B−p_A)V=(3/2)×2×10⁵×2×10⁻³=600 J で Q(AB)=600。ΔU(BC)=(3/2)pΔV=900 J で Q(BC)=900+600=1500。吸熱合計 2100 J。効率=400/2100=4/21。","correct":[6]}],"finale":{"q":"理想気体が p−V グラフ上の矩形サイクル A(1,1) → B(1,2) → C(3,2) → D(3,1) → A を回る（座標は V [10⁻³ m³]、p [10⁵ Pa]）。B→C で気体がする仕事、サイクル全体で気体がする正味の仕事、状態Cの温度は状態Aの温度の何倍かを求めよ。","cards":[2,3,4],"flow":"B→C は定圧膨張だから W=pΔV=2×10⁵×(3−1)×10⁻³=400 J。サイクルの正味の仕事は囲まれた矩形の面積 (2−1)×10⁵×(3−1)×10⁻³=200 J（A→B と C→D は定積で仕事 0、D→A の圧縮が −200 J で、合計でも 400−200=200 J と一致）。温度は pV に比例し、A は 1×1=1、C は 2×3=6 だから6倍。","a":"B→C の仕事 400 J、正味の仕事 200 J、状態Cの温度は状態Aの6倍","claims":["W=pΔV=2×10⁵×(3−1)×10⁻³=400 J","正味の仕事 200 J","6倍"]}},{"id":"math-4","subj":"math","day":4,"theme":"極限の融合","core":"形を揃える","fig":"m4","figcap":"aₙ=2−(1/2)ⁿ⁻¹ の点列。n が増えると 2 に下から近づく。極限は「近づく先」を読む問題。","title":"極限の形を揃える","setup":"数列は <span class='c2'>a₁=1, aₙ₊₁=(1/2)aₙ+1<\/span> から始める。後半は関数の極限と、はさみうちのどんで締める。","cards":[{"face":"漸化式 aₙ₊₁=f(aₙ) の極限を聞かれた","back":"まず α=f(α) を解いて極限候補を出し、aₙ−α が等比になる形に変形する","core":"形を揃える","label":"まず α=f(α) を解いて極限候補を出し、aₙ−α が等比になる形に変形する"},{"face":"0/0 型で sin が混ざる極限","back":"sin x / x → 1 の形に寄せる。角度を揃えるのがコツ","core":"形を揃える","label":"sin x / x → 1 の形に寄せる"},{"face":"(1+1/n)ⁿ の仲間の極限","back":"e の定義に寄せる。指数と底のずれを揃える","core":"形を揃える","label":"e の定義に寄せる"},{"face":"和の極限 Σ が出てきた","back":"はさみうち（各項を端で押さえる）か、区分求積（(1/n)Σf(k/n)）のどちらかに寄せる","core":"形を揃える","label":"はさみうち（各項を端で押さえる）か、区分求積（(1/n)Σf(k/n)）のどちらかに寄せる"},{"face":"無限級数の和を聞かれた","back":"部分和を作る。等比なら公式、ズレる形なら差分に分解して相殺させる","core":"前の結果を部品にする","label":"部分和を作る"},{"face":"ロピタルを使いたくなる場面","back":"高校範囲では使えない前提。有理化・因数分解・有名極限で処理する","core":"形を揃える","label":"高校範囲では使えない前提"},{"face":"不定形 ∞−∞ が出たら","back":"通分か有理化で分数の形に変えてから考える","core":"形を揃える","label":"通分か有理化で分数の形に変えてから考える"},{"face":"はさみうちの見つけ方","back":"一番大きい項と小さい項で全体を押さえる。n 個の和なら n×(最大) と n×(最小)","core":"境界で分ける","label":"一番大きい項と小さい項で全体を押さえる"}],"steps":[{"q":"(1) bₙ=aₙ−2 と置いて、aₙ を n で表せ","a":"aₙ=2−(1/2)ⁿ⁻¹","e":"bₙ₊₁=(1/2)bₙ となる等比数列。b₁=−1 だから bₙ=−(1/2)ⁿ⁻¹。よって aₙ=2−(1/2)ⁿ⁻¹。2 は漸化式の不動点 α=(1/2)α+1 の解。","correct":[0]},{"q":"(2) lim aₙ を求めよ","a":"2","e":"(1/2)ⁿ⁻¹→0 だから aₙ→2。図の点列そのもの。","correct":[0]},{"q":"(3) 無限級数 Σₙ₌₁^∞ (2−aₙ) の和を求めよ","a":"2","e":"2−aₙ=(1/2)ⁿ⁻¹ は初項1、公比1/2 の等比数列。和は 1/(1−1/2)=2。","correct":[4]},{"q":"(4) lim_{x→0} (eˣ−1−x)/x² を求めよ","a":"1/2","e":"eˣ の展開 eˣ=1+x+x²/2+… を使うと分子は x²/2+… となり比は 1/2。展開の2次の項が主役になる形。","correct":[5]},{"q":"(5)【苦手どん】Sₙ=Σ_{k=1}^n 1/√(n²+k) の極限を求めよ","a":"1","e":"各項は 1/√(n²+n) ≦ 1/√(n²+k) ≦ 1/√(n²+1)。n 個の和だから n/√(n²+n) ≦ Sₙ ≦ n/√(n²+1)。両端とも →1 なので、はさみうちで Sₙ→1。項の大きさを端で押さえるのが鍵。","correct":[7,3]}],"finale":{"q":"数列 a₁=2, aₙ₊₁=(1/3)aₙ+2 について、aₙ を n で表し、lim aₙ を求めよ。また無限級数 Σₙ₌₁^∞ (3−aₙ) の和を求めよ。","cards":[0,4],"flow":"まず不動点 α=(1/3)α+2 を解くと α=3。bₙ=aₙ−3 と置くと bₙ₊₁=(1/3)bₙ の等比数列になり、b₁=−1 だから bₙ=−(1/3)ⁿ⁻¹。よって aₙ=3−(1/3)ⁿ⁻¹ で、極限は 3。3−aₙ=(1/3)ⁿ⁻¹ は初項1、公比1/3 の等比数列だから、無限級数の和は 1/(1−1/3)=3/2。","a":"aₙ=3−(1/3)ⁿ⁻¹、lim aₙ=3、級数の和 3/2","claims":["α=3","aₙ=3−(1/3)ⁿ⁻¹","1/(1−1/3)=3/2"]}},{"id":"phys-4","subj":"phys","day":4,"theme":"電場と回路","core":"保存する量を探す","fig":"p4","figcap":"充電したコンデンサーを、充電していないコンデンサーにつなぐと、電荷は保存するがエネルギーは減る。その対比が今日の核。","title":"コンデンサーのつなぎ替え（電荷は残り、エネルギーは逃げる）","setup":"<span class='c2'>C₁=2μF<\/span> を 10V で充電した後、電池を外し、充電していない <span class='c3'>C₂=3μF<\/span> にスイッチで接続する。","cards":[{"face":"コンデンサーの基本式","back":"Q=CV。電荷・容量・電圧の3つは常にこの関係で結ばれる","core":"形を揃える","label":"Q=CV"},{"face":"スイッチ切り替えでコンデンサーをつなぎ替えた","back":"孤立部分の総電荷が保存する。まず Q の合計を固定してから電圧を配分する","core":"保存する量を探す","label":"孤立部分の総電荷が保存する"},{"face":"切り替え後の共通電位","back":"V=Q合計/(C合計)。並列接続として1つのコンデンサーに読み替える","core":"保存する量を探す","label":"V=Q合計/(C合計)"},{"face":"コンデンサーのエネルギー","back":"U=(1/2)CV²=(1/2)QV=Q²/(2C)。場面で使いやすい形を選ぶ","core":"形を揃える","label":"U=(1/2)CV²=(1/2)QV=Q²/(2C)"},{"face":"エネルギーが減った分の行き先","back":"抵抗で熱になる。電荷保存とエネルギー保存は別物だと意識する","core":"保存する量を探す","label":"抵抗で熱になる"},{"face":"直列接続のコンデンサー","back":"電荷は共通、電圧が分かれる。合成容量は逆数の和の逆数","core":"形を揃える","label":"電荷は共通、電圧が分かれる"},{"face":"キルヒホッフの法則を使う場面","back":"閉回路1周で電圧の合計が 0（電圧則）、分岐点で電流の合計が保存（電流則）","core":"保存する量を探す","label":"閉回路1周で電圧の合計が 0（電圧則）、分岐点で電流の合計が保存（電流則）"},{"face":"極板間隔や面積を変えた","back":"C=εS/d で容量が変わる。電池接続中か切り離した後かで、固定される量が違う","core":"切り替わる瞬間で区切る","label":"C=εS/d で容量が変わる"}],"steps":[{"q":"(1) 接続前の C₁ の電荷とエネルギーを求めよ","a":"電荷 20μC、エネルギー 100μJ","e":"Q=CV=2×10=20μC。U=(1/2)CV²=(1/2)×2×100=100μJ。","correct":[0,3]},{"q":"(2) 接続後の共通の電圧を求めよ","a":"4 V","e":"総電荷 20μC が保存し、合計容量は 5μF。V=20/5=4V。","correct":[2,1]},{"q":"(3) 接続後の C₁, C₂ それぞれの電荷を求めよ","a":"C₁ は 8μC、C₂ は 12μC","e":"Q=CV で C₁ は 2×4=8、C₂ は 3×4=12。合計 20μC で保存を確認できる。","correct":[0]},{"q":"(4) 接続後の総エネルギーと、失われたエネルギーを求めよ","a":"40μJ、損失 60μJ","e":"U=(1/2)(C₁+C₂)V²=(1/2)×5×16=40μJ。差の 60μJ は接続時の電流で熱などに変わった。","correct":[3,4]},{"q":"(5)【苦手どん】C₂ をあらかじめ 6V で、C₁ と逆向きになるよう充電してから接続したら、共通電位と総エネルギーはどうなるか","a":"電位 0.4 V、エネルギー 0.4μJ","e":"逆向きなので電荷は打ち消し合う：正味の電荷は 20−18=2μC。V=2/5=0.4V。U=(1/2)×5×0.16=0.4μJ。符号（向き）を付けて電荷を数えるのが鍵。","correct":[1]}],"finale":{"q":"C₁=4μF のコンデンサーを 6V で充電した後、電池を外し、充電していない C₂=2μF のコンデンサーにスイッチで接続した。接続後の共通の電圧と、失われるエネルギーを求めよ。","cards":[1,2,3],"flow":"接続前の電荷は Q=CV=4×6=24μC。つなぎ替えでは総電荷が保存し、合計容量は 4+2=6μF だから、共通電圧は V=24/6=4V。エネルギーは接続前 (1/2)×4×6²=72μJ、接続後 (1/2)×6×4²=48μJ で、差の 24μJ が失われる（熱などに変わる）。","a":"共通電圧 4 V、失われるエネルギー 24μJ","claims":["Q=CV=4×6=24μC","V=24/6=4V","24μJ が失われる"]}},{"id":"math-6","subj":"math","day":6,"theme":"媒介変数と曲線","core":"前の結果を部品にする","fig":"m6","figcap":"サイクロイド x=t−sin t, y=1−cos t の1アーチ。転がる円が描く曲線で、弧長も面積もキレイな値になる名物曲線。","title":"サイクロイドを解剖する","setup":"曲線 C：<span class='c1'>x=t−sin t, y=1−cos t<\/span>（0≦t≦2π）の1アーチを、微分・弧長・面積・体積の全部で味わう。","cards":[{"face":"x, y が t の式で与えられた","back":"dy/dx = (dy/dt)/(dx/dt)。y の微分 ÷ x の微分","core":"形を揃える","label":"dy/dx = (dy/dt)/(dx/dt)"},{"face":"媒介変数のまま面積を求めたい","back":"∫y dx = ∫y(t)·x′(t) dt に直す。dx を t の式に替えるのが鍵","core":"切って積む","label":"∫y dx = ∫y(t)·x′(t) dt に直す"},{"face":"弧長を求めたい","back":"L=∫√((x′)²+(y′)²) dt。速さの積分だと読む","core":"切って積む","label":"L=∫√((x′)²+(y′)²) dt"},{"face":"接線の傾きが 0 になる点","back":"dy/dt=0 の t を探す（ただし dx/dt≠0）。山の頂点に対応","core":"境界で分ける","label":"dy/dt=0 の t を探す（ただし dx/dt≠0）"},{"face":"曲線の概形を描きたい","back":"x, y それぞれの増減表を t で作り、組み合わせて追う","core":"図と式を行き来する","label":"x, y それぞれの増減表を t で作り、組み合わせて追う"},{"face":"t を消去して x, y の式にしたい場面","back":"三角なら sin²+cos²=1 のような恒等式で消す。消せない曲線も多い","core":"形を揃える","label":"三角なら sin²+cos²=1 のような恒等式で消す"},{"face":"回転体の体積も t のまま","back":"V=π∫y² dx = π∫y(t)²x′(t) dt。置き換えは同じ","core":"切って積む","label":"V=π∫y² dx = π∫y(t)²x′(t) dt"},{"face":"速度ベクトル・速さ（物理との接続）","back":"速さは √((x′)²+(y′)²)。数学の弧長の要素と物理の速さは同じ量","core":"前の結果を部品にする","label":"速さは √((x′)²+(y′)²)"}],"steps":[{"q":"(1) dy/dx を t で表せ","a":"sin t /(1−cos t)","e":"dy/dt=sin t、dx/dt=1−cos t。その比を取る。半角で cot(t/2) とも書ける。","correct":[0]},{"q":"(2) t=π/2 での接線の傾きと、その点の座標を求めよ","a":"傾き 1、点 (π/2−1, 1)","e":"傾きは sin(π/2)/(1−cos(π/2))=1/1=1。座標は x=π/2−1, y=1。図の青い点。","correct":[0]},{"q":"(3) 1アーチの弧長を求めよ","a":"8","e":"速さは √((1−cos t)²+sin²t)=√(2−2cos t)=2 sin(t/2)（区間で正）。L=∫₀^{2π} 2 sin(t/2) dt = [−4 cos(t/2)]₀^{2π} = 8。転がる円の半径1に対して 8 は直径の4倍。","correct":[2]},{"q":"(4) 1アーチと x軸で囲まれた部分の面積を求めよ","a":"3π","e":"S=∫y dx = ∫₀^{2π} (1−cos t)² dt = ∫(3/2 − 2cos t + (1/2)cos 2t) dt の形に展開すると 3π。転がした円の面積 π のちょうど3倍、という有名な結果。","correct":[1]},{"q":"(5)【苦手どん】このアーチを x軸の周りに回転させた立体の体積を求めよ","a":"5π²","e":"V=π∫y² dx = π∫₀^{2π} (1−cos t)³ dt。展開して積分すると ∫(1−cos t)³ dt = 5π になるので V=5π²。媒介変数のまま体積まで持っていく総仕上げ。","correct":[6]}],"finale":{"q":"曲線 C：x=2(t−sin t), y=2(1−cos t)（0≦t≦2π）の1アーチについて、弧長と、曲線と x軸で囲まれた部分の面積を求めよ。","cards":[2,1],"flow":"dx/dt=2(1−cos t)、dy/dt=2 sin t だから、速さは √((dx/dt)²+(dy/dt)²)=√(8−8cos t)=4 sin(t/2)（区間で正）。弧長は ∫₀^{2π} 4 sin(t/2) dt = 16。面積は ∫y dx = ∫₀^{2π} 2(1−cos t)·2(1−cos t) dt = 4∫₀^{2π} (1−cos t)² dt = 12π。","a":"弧長 16、面積 12π","claims":["弧長は ∫₀^{2π} 4 sin(t/2) dt = 16","面積 12π"]}},{"id":"phys-6","subj":"phys","day":6,"theme":"波動","core":"グラフの面積と傾きを読む","fig":"p6","figcap":"二重スリットとスクリーン。経路差が波長の整数倍の所に明線が並び、間隔は λL/d で決まる。","title":"干渉とドップラーと回折格子","setup":"波長 <span class='c1'>600 nm<\/span> の光でヤングの実験（スリット間隔 0.2 mm、スクリーンまで 1 m）を行い、後半は音と回折格子に広げる。音速は 340 m/s とする。","cards":[{"face":"干渉の明線条件を聞かれた","back":"経路差 = mλ（m=0,1,2…）で強め合う。暗線は (m+1/2)λ","core":"形を揃える","label":"経路差 = mλ（m=0,1,2…）で強め合う"},{"face":"ヤングの実験の明線間隔","back":"Δx=λL/d。波長が長い・スクリーンが遠い・スリットが狭いほど広がる","core":"形を揃える","label":"Δx=λL/d"},{"face":"音源が近づいてくるドップラー","back":"聞こえる波長が短くなる。f′=V/(V−v_s)·f（観測者静止）","core":"境界で分ける","label":"聞こえる波長が短くなる"},{"face":"観測者も動くドップラー","back":"分子は観測者の動き (V∓v_o)、分母は音源の動き (V∓v_s)。別々に処理する","core":"境界で分ける","label":"分子は観測者の動き (V∓v_o)、分母は音源の動き (V∓v_s)"},{"face":"回折格子の明線","back":"d sinθ=mλ。次数 m には上限があり、|sinθ|≦1 から決まる","core":"境界で分ける","label":"d sinθ=mλ"},{"face":"うなりを聞かれた","back":"うなりの振動数は2つの振動数の差 |f₁−f₂|","core":"形を揃える","label":"うなりの振動数は2つの振動数の差 |f₁−f₂|"},{"face":"弦や管の固有振動","back":"両端固定の弦は L=(m/2)λ、開管はその倍音列、閉管は奇数倍のみ","core":"形を揃える","label":"両端固定の弦は L=(m/2)λ、開管はその倍音列、閉管は奇数倍のみ"},{"face":"波の重ね合わせの原理","back":"合成波は足し算。干渉も定常波もこの原理の応用","core":"前の結果を部品にする","label":"合成波は足し算"}],"steps":[{"q":"(1) スクリーン上の明線の間隔を求めよ","a":"3 mm","e":"Δx=λL/d=(600×10⁻⁹×1)/(0.2×10⁻³)=3×10⁻³ m = 3 mm。","correct":[1]},{"q":"(2) 中央から数えて3番目の明線は、経路差が波長の何倍の点か","a":"3倍（m=3）","e":"明線条件は経路差=mλ。数え方：中央が m=0 で、3番目は m=3。","correct":[0]},{"q":"(3) 680 Hz の音源が 20 m/s で静止した観測者に近づく時、聞こえる振動数を求めよ","a":"722.5 Hz","e":"f′=V/(V−v_s)·f=(340/320)×680=722.5 Hz。波長が圧縮される。","correct":[2]},{"q":"(4) さらに観測者が 10 m/s で音源から遠ざかると、振動数はどうなるか","a":"701.25 Hz","e":"f′=(V−v_o)/(V−v_s)·f=(330/320)×680=701.25 Hz。分子と分母を別々に処理する。","correct":[3]},{"q":"(5)【苦手どん】1 mm あたり 500 本の線を引いた回折格子に波長 600 nm の光を当てた。明線は何次まで見えるか。また1次の明線の角度 sinθ はいくつか","a":"最大3次まで。1次は sinθ=0.30","e":"格子定数 d=1/500 mm=2×10⁻⁶ m。条件は sinθ=mλ/d で、m≦d/λ=3.33… だから m=3 まで。m=1 では sinθ=600×10⁻⁹/2×10⁻⁶=0.30。","correct":[4]}],"finale":{"q":"波長 500 nm の光でヤングの実験（スリット間隔 0.25 mm、スクリーンまで 2 m）を行うと、明線の間隔はいくつか。また、1 mm あたり 300 本の線を引いた回折格子に同じ光を当てた時、明線は何次まで見えるかと、1次の明線の sinθ を求めよ。","cards":[1,4],"flow":"明線間隔は Δx=λL/d=(500×10⁻⁹×2)/(0.25×10⁻³)=4×10⁻³ m = 4 mm。回折格子の格子定数は d=1/300 mm≈3.33×10⁻⁶ m。明線条件 d sinθ=mλ で |sinθ|≦1 だから m≦d/λ≈6.67、つまり6次まで。1次は sinθ=λ/d=0.15。","a":"明線間隔 4 mm、明線は6次まで、1次の明線の sinθ=0.15","claims":["Δx=λL/d=(500×10⁻⁹×2)/(0.25×10⁻³)=4×10⁻³ m = 4 mm","6次まで","sinθ=λ/d=0.15"]}},{"id":"math-7","subj":"math","day":7,"theme":"総合（卒業試験）","core":"前の結果を部品にする","fig":"m7","figcap":"f(x)=x e^{−x} のグラフ。最大値、面積、極限、回転体、漸化式まで、1つの関数から全部引き出す卒業試験。","title":"f(x)=x e^{−x} を使い倒す","setup":"<span class='c1'>f(x)=x e^{−x}<\/span>（x≧0）を題材に、6日分の道具を全部つなぐ。","cards":[{"face":"指数×多項式の関数を見た","back":"微分すると同型が残る。e^{−x} は微分しても形が崩れない","core":"形を揃える","label":"微分すると同型が残る"},{"face":"∫x e^{−x} 型の積分","back":"部分積分で多項式の次数を1つ下げる。繰り返せば漸化式になる","core":"前の結果を部品にする","label":"部分積分で多項式の次数を1つ下げる"},{"face":"x→∞ での x と eˣ の競争","back":"指数関数の増大が圧倒的。xⁿ e^{−x}→0 は暗記級の事実","core":"形を揃える","label":"指数関数の増大が圧倒的"},{"face":"広義積分の回転体","back":"有限区間で計算してから端を飛ばす。収束するなら値が残る","core":"前の結果を部品にする","label":"有限区間で計算してから端を飛ばす"},{"face":"Iₙ の漸化式を作りたい","back":"Iₙ を部分積分して Iₙ₋₁ を登場させる。部品化の王道","core":"前の結果を部品にする","label":"Iₙ を部分積分して Iₙ₋₁ を登場させる"},{"face":"最大値問題で指数が絡む","back":"対数を取って微分してもよい（対数微分）。単調性は変わらない","core":"形を揃える","label":"対数を取って微分してもよい（対数微分）"},{"face":"接線と曲線で囲まれた面積","back":"接線の式を作る→差を積分する。Day1 と Day2 の合体技","core":"前の結果を部品にする","label":"接線の式を作る→差を積分する"},{"face":"不等式の証明に微分を使う","back":"差を f(x) と置き、増減を調べて最小値が 0 以上を示す","core":"図と式を行き来する","label":"差を f(x) と置き、増減を調べて最小値が 0 以上を示す"}],"steps":[{"q":"(1) f(x) の増減を調べ、最大値を求めよ","a":"x=1 で最大値 1/e","e":"f′(x)=(1−x)e^{−x}。e^{−x}>0 だから符号は (1−x) で決まる。x=1 で最大 f(1)=1/e。","correct":[0]},{"q":"(2) 曲線と x軸、直線 x=1 で囲まれた部分の面積を求めよ","a":"1−2/e","e":"∫₀¹ x e^{−x} dx。部分積分で [−(x+1)e^{−x}]₀¹ = −2/e − (−1) = 1−2/e。図の色つき部分。","correct":[1]},{"q":"(3) lim_{x→∞} x e^{−x} を求めよ","a":"0","e":"eˣ の増大が x を圧倒する。eˣ≧x²/2（展開の1項）で押さえると 0≦x e^{−x}≦2/x→0 とはさめる。","correct":[2]},{"q":"(4) 曲線 y=f(x)（x≧0）と x軸で囲まれた部分を x軸の周りに回転させた体積を求めよ","a":"π/4","e":"V=π∫₀^∞ x² e^{−2x} dx。∫₀^∞ x² e^{−2x} dx = 2!/2³ = 1/4（部分積分を2回でも同じ）。よって π/4。無限に伸びても体積は有限。","correct":[3]},{"q":"(5)【苦手どん】Iₙ=∫₀¹ xⁿ e^{−x} dx とする。Iₙ と Iₙ₋₁ の漸化式を作り、I₂ を求めよ","a":"Iₙ=−1/e + n·Iₙ₋₁、I₂=2−5/e","e":"部分積分：Iₙ=[−xⁿ e^{−x}]₀¹ + n∫₀¹ xⁿ⁻¹ e^{−x} dx = −1/e + n Iₙ₋₁。I₀=1−1/e、I₁=−1/e+I₀=1−2/e、I₂=−1/e+2I₁=2−5/e。(2) の答えが部品になって次が解ける。","correct":[4]}],"finale":{"q":"f(x)=x²e^{−x}（x≧0）について、最大値を求めよ。また、曲線 y=f(x) と x軸で囲まれた部分を x軸の周りに回転させた立体の体積を求めよ。","cards":[0,3],"flow":"微分すると f′(x)=(2x−x²)e^{−x}=x(2−x)e^{−x}。x≧0 では符号は x(2−x) で決まり、x=2 で最大値 f(2)=4/e²。体積は広義積分 V=π∫₀^∞ x⁴e^{−2x} dx で、∫₀^∞ x⁴e^{−2x} dx = 4!/2⁵ = 3/4（部分積分を繰り返しても同じ）だから V=3π/4。","a":"最大値 4/e²（x=2）、体積 3π/4","claims":["最大値 f(2)=4/e²","4!/2⁵ = 3/4","V=3π/4"]}},{"id":"phys-7","subj":"phys","day":7,"theme":"総合（卒業試験）","core":"保存する量を探す","fig":"p7","figcap":"電場で加速 → 磁場で半円。エネルギーの保存とローレンツ力の円運動が1本につながる、荷電粒子の王道構成。","title":"陽子の加速と半円（卒業試験）","setup":"静止した陽子（質量 1.67×10⁻²⁷ kg、電荷 1.6×10⁻¹⁹ C）を <span class='c2'>200 V<\/span> で加速し、<span class='c1'>0.010 T<\/span> の一様磁場に垂直に入射させる。","cards":[{"face":"荷電粒子が電圧 V で加速された","back":"qV = (1/2)mv²。エネルギーの保存だけで速さが出る","core":"保存する量を探す","label":"qV = (1/2)mv²"},{"face":"加速後のエネルギーの単位","back":"qV をそのまま eV で読む。200V なら 200 eV","core":"形を揃える","label":"qV をそのまま eV で読む"},{"face":"磁場に垂直に入射した荷電粒子","back":"ローレンツ力が向心力。r=mv/(qB)、周期は速さに依らない","core":"保存する量を探す","label":"ローレンツ力が向心力"},{"face":"半円を描いて出てくる時間","back":"半周期 πm/(qB)。半径が要らないのがミソ","core":"前の結果を部品にする","label":"半周期 πm/(qB)"},{"face":"電場と磁場を直交させて重ねた","back":"qE=qvB の時だけ直進する（速度選別器）。v=E/B が条件","core":"境界で分ける","label":"qE=qvB の時だけ直進する（速度選別器）"},{"face":"磁場は仕事をしない","back":"ローレンツ力は速度と常に垂直。速さは変わらず向きだけ変わる","core":"保存する量を探す","label":"ローレンツ力は速度と常に垂直"},{"face":"サイクロトロンの発想","back":"磁場で回しながら電場で少しずつ加速する。周期一定だから同期できる","core":"前の結果を部品にする","label":"磁場で回しながら電場で少しずつ加速する"},{"face":"質量分析器の原理","back":"同じ速さでも r が m/q で変わる。軌道で質量を選り分ける","core":"図と式を行き来する","label":"同じ速さでも r が m/q で変わる"}],"steps":[{"q":"(1) 加速で陽子が得る運動エネルギーを eV と J で表せ","a":"200 eV、3.2×10⁻¹⁷ J","e":"qV=1.6×10⁻¹⁹×200=3.2×10⁻¹⁷ J。eV ではそのまま 200 eV。","correct":[0,1]},{"q":"(2) 加速後の速さを求めよ","a":"約 2.0×10⁵ m/s","e":"(1/2)mv²=qV より v=√(2qV/m)=√(2×3.2×10⁻¹⁷/1.67×10⁻²⁷)≈1.96×10⁵ m/s。","correct":[0]},{"q":"(3) 磁場中での円運動の半径を求めよ","a":"約 0.20 m","e":"r=mv/(qB)=(1.67×10⁻²⁷×1.96×10⁵)/(1.6×10⁻¹⁹×0.010)≈0.204 m。図の半円。","correct":[2]},{"q":"(4) 半円を描いて磁場を出るまでにかかる時間を求めよ","a":"約 3.3×10⁻⁶ s","e":"半周期 = πm/(qB) = π×1.67×10⁻²⁷/(1.6×10⁻²¹) ≈ 3.28×10⁻⁶ s。速さも半径も要らない。","correct":[3]},{"q":"(5)【苦手どん】同じ磁場に電場を重ね、陽子が直進するための電場の強さを求めよ","a":"約 2.0×10³ V/m","e":"直進条件は電気力とローレンツ力のつり合い qE=qvB、つまり E=vB≈1.96×10⁵×0.010≈2.0×10³ V/m。速さがこの値の粒子だけが選別される。","correct":[4]}],"finale":{"q":"静止した陽子（質量 1.67×10⁻²⁷ kg、電荷 1.6×10⁻¹⁹ C）を 50 V で加速し、0.010 T の一様磁場に垂直に入射させる。加速後の速さ、磁場中での円運動の半径、半円を描いて磁場を出るまでにかかる時間を求めよ。","cards":[0,2,3],"flow":"加速で得るエネルギーは qV だから、速さは v=√(2qV/m)=√(2×1.6×10⁻¹⁹×50 / 1.67×10⁻²⁷)≈9.8×10⁴ m/s。半径は r=mv/(qB)≈0.102 m。半円の時間は半周期 πm/(qB)≈3.3×10⁻⁶ s で、速さや半径を使わずに決まる。","a":"速さ 約9.8×10⁴ m/s、半径 約0.102 m、時間 約3.3×10⁻⁶ s","claims":["≈9.8×10⁴ m/s","r=mv/(qB)≈0.102 m","πm/(qB)≈3.3×10⁻⁶ s"]}}];

/* ============ 純粋ロジック（DOM非依存・テスト対象） ============ */
function firstSentence(text) {
  const i = text.indexOf("。");
  return i >= 0 ? text.slice(0, i + 1) : text;
}
function newRun(boss) {
  return { bossId: boss.id, stepIdx: 0, wrongHere: 0, wrongTotal: 0, wrongPerStep: boss.steps.map(() => 0), solved: false, cleared: false, picked: -1 };
}
/* カード cardIdx を選んで決定。戻り値: {result:'correct'|'wrong', hint:boolean, cleared:boolean} */
function chooseCard(run, boss, cardIdx) {
  if (run.cleared || run.solved) return { result: "locked", hint: false, cleared: run.cleared };
  const step = boss.steps[run.stepIdx];
  if (step.correct.indexOf(cardIdx) >= 0) {
    run.solved = true;
    if (run.stepIdx === boss.steps.length - 1) run.cleared = true;
    return { result: "correct", hint: false, cleared: run.cleared };
  }
  run.wrongHere += 1;
  run.wrongTotal += 1;
  run.wrongPerStep[run.stepIdx] += 1;
  return { result: "wrong", hint: run.wrongHere >= 2, cleared: false };
}
function advance(run, boss) {
  if (!run.solved || run.cleared) return false;
  run.stepIdx += 1;
  run.wrongHere = 0;
  run.solved = false;
  run.picked = -1;
  return true;
}
function hintFor(boss, stepIdx) { return firstSentence(boss.steps[stepIdx].e); }
/* 仕上げ問題の自己申告フェーズ: think → revealed → done */
function newFinale() { return { phase: "think", thought: null, self: null }; }
function finaleThink(f, v) {
  if (f.phase !== "think") return false;
  f.thought = v; f.phase = "revealed"; return true;
}
function finaleJudge(f, v) {
  if (f.phase !== "revealed") return false;
  f.self = v; f.phase = "done"; return true;
}
/*CORE-END*/

/* ============ 進捗（localStorage） ============ */
const LS_KEY = "kaihou-steps-v1";
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    return { records: s.records || {} };
  } catch (e) { return { records: {} }; }
}
function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadState();

const byId = {};
BOSSES.forEach(b => { byId[b.id] = b; });
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function fmtTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function subjName(b) { return b.subj === "math" ? "数学" : "物理"; }

/* ============ 一覧 ============ */
function renderList() {
  const box = document.getElementById("bossList");
  let h = "";
  ["math", "phys"].forEach(subj => {
    h += '<div class="group-title">' + (subj === "math" ? "数学" : "物理") + "</div>";
    BOSSES.filter(b => b.subj === subj).forEach(b => {
      const rec = state.records[b.id];
      const meta = [];
      meta.push("Day" + b.day + "：" + esc(b.theme));
      meta.push(b.steps.length + "ステップ");
      if (rec && rec.clears > 0) meta.push("クリア " + rec.clears + "回・最少ミス " + rec.bestMistakes + "回");
      if (rec && rec.finale) meta.push("仕上げ問題：" + (rec.finale.self === "match" ? "合ってた" : "違ってた") + "（" + (rec.finale.thought === "got" ? "解法が思いついた" : "分からなかった") + "）");
      h += '<button class="boss-item" onclick="startRun(\'' + b.id + '\')">' +
        '<span class="b-theme">' + esc(meta.join("　")) + "</span>" +
        '<div class="b-title">' + esc(b.title) + "</div>" +
        (rec && rec.clears > 0 ? '<div class="b-meta"><span class="chip chip-clear">クリア済み</span></div>' : "") +
        "</button>";
    });
  });
  box.innerHTML = h;
}

/* ============ 演習 ============ */
let run = null, runBoss = null, runOrder = [], startAt = 0, timerId = null;
function show(id) {
  ["listView", "playView", "clearView", "finaleView"].forEach(v => { document.getElementById(v).style.display = (v === id ? "" : "none"); });
}
function startRun(id) {
  runBoss = byId[id];
  run = newRun(runBoss);
  startAt = Date.now();
  document.getElementById("pMeta").textContent = subjName(runBoss) + " Day" + runBoss.day + "：" + runBoss.theme;
  document.getElementById("pCore").textContent = "芯：" + runBoss.core;
  document.getElementById("pTitle").textContent = runBoss.title;
  document.getElementById("pSetup").innerHTML = runBoss.setup;
  document.getElementById("pFig").innerHTML = FIG[runBoss.fig]();
  document.getElementById("pFigcap").textContent = runBoss.figcap;
  document.getElementById("figDetails").open = true;
  document.getElementById("clearedList").innerHTML = "";
  document.getElementById("clearedBox").style.display = "none";
  show("playView");
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tick, 500);
  tick();
  renderStep();
  window.scrollTo(0, 0);
}
function tick() {
  if (!run) return;
  document.getElementById("pTimer").textContent = fmtTime(Math.floor((Date.now() - startAt) / 1000));
}
function renderStep() {
  const step = runBoss.steps[run.stepIdx];
  runOrder = shuffle(runBoss.cards.map((c, i) => i));
  document.getElementById("pCount").textContent = "ステップ " + (run.stepIdx + 1) + " / " + runBoss.steps.length;
  document.getElementById("pMiss").textContent = "ミス " + run.wrongTotal + " 回";
  document.getElementById("pDots").innerHTML = runBoss.steps.map((s, i) =>
    '<span class="dot' + (i < run.stepIdx ? " done" : (i === run.stepIdx ? " now" : "")) + '"></span>').join("");
  document.getElementById("sQ").textContent = step.q;
  const opt = document.getElementById("sOptions");
  opt.innerHTML = "";
  runOrder.forEach(ci => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = runBoss.cards[ci].label;
    b.onclick = () => pick(ci, b);
    b.dataset.card = ci;
    opt.appendChild(b);
  });
  document.getElementById("sHint").style.display = "none";
  document.getElementById("sFeedback").style.display = "none";
  document.getElementById("decideBtn").style.display = "";
  document.getElementById("decideBtn").disabled = true;
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("finishBtn").style.display = "none";
}
function pick(ci, btn) {
  if (run.solved) return;
  run.picked = ci;
  document.querySelectorAll("#sOptions .opt").forEach(o => o.classList.toggle("sel", Number(o.dataset.card) === ci));
  document.getElementById("decideBtn").disabled = false;
}
function decide() {
  if (run.picked < 0 || run.solved) return;
  const res = chooseCard(run, runBoss, run.picked);
  const fb = document.getElementById("sFeedback");
  const btns = document.querySelectorAll("#sOptions .opt");
  if (res.result === "correct") {
    const step = runBoss.steps[run.stepIdx];
    btns.forEach(o => {
      const ci = Number(o.dataset.card);
      if (ci === run.picked) o.classList.add("hit");
      o.disabled = true;
    });
    fb.className = "feedback ok";
    fb.innerHTML = "<div>正解！この解法で進められる。</div>" +
      '<div class="fb-ans">答え：' + esc(step.a) + "</div>" +
      '<div class="fb-expl">' + esc(step.e) + "</div>" +
      '<div class="fb-card">使ったカード：' + esc(runBoss.cards[run.picked].back) + "</div>";
    fb.style.display = "";
    document.getElementById("sHint").style.display = "none";
    document.getElementById("decideBtn").style.display = "none";
    document.getElementById(res.cleared ? "finishBtn" : "nextBtn").style.display = "";
    document.getElementById("pMiss").textContent = "ミス " + run.wrongTotal + " 回";
    document.getElementById("pDots").innerHTML = runBoss.steps.map((s, i) =>
      '<span class="dot' + (i < run.stepIdx ? " done" : (i === run.stepIdx ? (res.cleared ? " done" : " now") : "")) + '"></span>').join("");
  } else if (res.result === "wrong") {
    btns.forEach(o => { if (Number(o.dataset.card) === run.picked) o.classList.add("wrongpick"); });
    fb.className = "feedback ng";
    fb.textContent = "そのカードでは進めないみたい。別の解法を選んでみよう。";
    fb.style.display = "";
    document.getElementById("pMiss").textContent = "ミス " + run.wrongTotal + " 回";
    if (res.hint) {
      const hint = document.getElementById("sHint");
      hint.textContent = "ヒント（解説の最初の一文）：" + hintFor(runBoss, run.stepIdx);
      hint.style.display = "";
    }
  }
}
function nextStep() {
  addClearedItem(run.stepIdx);
  if (!advance(run, runBoss)) return;
  renderStep();
  window.scrollTo(0, 0);
}
function addClearedItem(idx) {
  const step = runBoss.steps[idx];
  document.getElementById("clearedBox").style.display = "";
  const d = document.createElement("div");
  d.className = "review-item";
  const miss = run.wrongPerStep[idx];
  d.innerHTML = '<div class="r-q">' + esc(step.q) + (miss ? ' <span class="r-miss">ミス' + miss + "回</span>" : "") + "</div>" +
    '<div class="r-a">' + esc(step.a) + '</div><div class="r-e" style="display:none">' + esc(step.e) + "</div>";
  d.querySelector(".r-q").onclick = () => {
    const e = d.querySelector(".r-e");
    e.style.display = e.style.display === "none" ? "" : "none";
  };
  document.getElementById("clearedList").appendChild(d);
}
let lastSec = 0;
function finishRun() {
  addClearedItem(run.stepIdx);
  lastSec = Math.floor((Date.now() - startAt) / 1000);
  const rec = state.records[runBoss.id] || { clears: 0, bestMistakes: null, lastMistakes: null, lastSec: null };
  rec.clears += 1;
  rec.lastMistakes = run.wrongTotal;
  rec.lastSec = lastSec;
  rec.bestMistakes = (rec.bestMistakes === null || run.wrongTotal < rec.bestMistakes) ? run.wrongTotal : rec.bestMistakes;
  state.records[runBoss.id] = rec;
  saveState();
  if (timerId) clearInterval(timerId);
  showClear();
}
function showClear() {
  document.getElementById("clearStats").textContent =
    runBoss.title + "　／　かかった時間 " + fmtTime(lastSec) + "　／　間違えた回数 " + run.wrongTotal + " 回";
  document.getElementById("reviewList").innerHTML = runBoss.steps.map((s, i) =>
    '<div class="review-item"><div class="r-q">' + esc(s.q) +
    (run.wrongPerStep[i] ? ' <span class="r-miss">ミス' + run.wrongPerStep[i] + "回</span>" : "") + "</div>" +
    '<div class="r-a">' + esc(s.a) + '</div><div class="r-e">' + esc(s.e) + "</div></div>").join("");
  document.getElementById("retryBtn").onclick = () => startRun(runBoss.id);
  renderFinaleBox();
  show("clearView");
  window.scrollTo(0, 0);
}
function renderFinaleBox() {
  const box = document.getElementById("finaleBox");
  if (!runBoss.finale) { box.innerHTML = ""; return; }
  const rec = state.records[runBoss.id];
  let h = '<div class="card-panel"><div style="font-weight:700;color:#0369a1">仕上げ問題</div>';
  if (rec && rec.finale) {
    h += '<p style="font-size:14px;margin-top:6px">前回の自己採点：' +
      (rec.finale.self === "match" ? "合ってた" : "違ってた") + "（" +
      (rec.finale.thought === "got" ? "解法が思いついた" : "分からなかった") + "）</p>";
  } else {
    h += '<p style="font-size:14px;margin-top:6px">同じ解法カードを使う類題が1題あるよ。選択肢なしで考えてみよう。</p>';
  }
  h += '<button class="btn" style="margin-top:12px" onclick="startFinale()">仕上げ問題に挑戦する</button></div>';
  box.innerHTML = h;
}

/* ============ 仕上げ問題 ============ */
let fin = null;
function startFinale() {
  fin = newFinale();
  document.getElementById("fMeta").textContent = subjName(runBoss) + " Day" + runBoss.day + "：" + runBoss.theme;
  document.getElementById("fQ").textContent = runBoss.finale.q;
  document.getElementById("fThinkBox").style.display = "";
  document.getElementById("fRevealBox").style.display = "none";
  show("finaleView");
  window.scrollTo(0, 0);
}
function thinkFinale(v) {
  if (!finaleThink(fin, v)) return;
  const f = runBoss.finale;
  document.getElementById("fCards").innerHTML = f.cards.map(ci =>
    '<div class="fb-card" style="border-top:none;padding-top:4px">・' + esc(runBoss.cards[ci].back) + "</div>").join("");
  document.getElementById("fFlow").textContent = f.flow;
  document.getElementById("fAns").textContent = "答え：" + f.a;
  document.getElementById("fThinkBox").style.display = "none";
  document.getElementById("fRevealBox").style.display = "";
  window.scrollTo(0, 0);
}
function judgeFinale(v) {
  if (!finaleJudge(fin, v)) return;
  const rec = state.records[runBoss.id] || { clears: 0, bestMistakes: null, lastMistakes: null, lastSec: null };
  rec.finale = { thought: fin.thought, self: fin.self };
  state.records[runBoss.id] = rec;
  saveState();
  showClear();
}
function backToClear() { showClear(); }
function quitToList() {
  if (timerId) clearInterval(timerId);
  run = null; runBoss = null;
  renderList();
  show("listView");
  window.scrollTo(0, 0);
}
renderList();
</script>
</body>
